<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#276a58"><link rel="manifest" href="manifest.webmanifest"><title>세계 음식대백과 V2 Stage 2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:#20362f;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#276a58;color:white;padding:14px 18px;z-index:4;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #c9d7d0;border-radius:12px;padding:10px 13px;background:white;color:#245b4c;font-weight:700}button.primary{background:#276a58;color:white}button:disabled{opacity:.45}main{max-width:1050px;margin:auto;padding:16px}.toolbar,.panel{background:white;border-radius:17px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #153b2210}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stat{background:#e9f4ed;border-radius:10px;padding:10px 14px}.muted{color:#66776f;font-size:13px}input,select,textarea{border:1px solid #c9d7d0;border-radius:10px;padding:10px;max-width:100%;background:white}input[type=search]{flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.tile{border:1px solid #dbe5df;border-radius:13px;padding:14px;text-align:left;background:white;color:#243b31;min-height:75px}.tile b{display:block}.tile small{color:#63766c}.done{border-left:6px solid #3aab6b}.candidate{border-left:6px solid #a37bd7}.empty{border-left:6px solid #d7d7d7}.error{border-left:6px solid #dd776b}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button.active{background:#276a58;color:white}.hidden{display:none!important}.card{background:white;border-radius:17px;padding:18px;max-width:800px;margin:15px auto}.card img{max-width:100%;max-height:280px;object-fit:contain;display:block;margin:10px auto;border-radius:12px}.card h2{margin:5px 0}.pill{border-radius:30px;padding:5px 9px;background:#e6f1ec;font-size:12px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field textarea{width:100%;min-height:100px}.field input{width:100%}.quality{font-size:14px;color:#526b5e}.warn{background:#fff5dc;padding:12px;border-radius:12px}.screen{display:none}.screen.show{display:block}footer{padding:18px;text-align:center;color:#718277} @media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:16px}.row button{padding:9px}}
</style></head><body><header><h1>🌍 세계 음식대백과 <small>V2 Stage 2.0</small></h1><button id="homeBtn">나라목록</button></header><main><section id="home" class="screen show"><div class="panel"><div id="stats" class="row"></div><p class="muted">기준: 101개국 · 음식 560개 + 사용자 추가 항목. 기존 검색결과는 제공된 품질보고서 기준으로 표시됩니다.</p><div class="row"><button class="primary" id="parentBtn">⚙️ 부모모드 · 품질관리</button><button id="backupBtn">💾 전체 백업</button><button id="importBtn">📂 백업 불러오기</button><input type="file" id="importFile" accept="application/json" hidden></div></div><div class="panel"><div class="row"><input type="search" id="countrySearch" placeholder="나라 검색"><button id="allBtn">전체 음식 보기</button></div></div><div id="countries" class="grid"></div></section>
<section id="list" class="screen"><div class="panel"><div class="row"><button id="backCountries">← 나라목록</button><h2 id="listTitle"></h2></div><div class="row"><input type="search" id="foodSearch" placeholder="음식·영어·현지어·별칭 검색"><select id="statusFilter"><option value="all">전체 상태</option><option value="done">🟢 완성</option><option value="candidate">🟣 후보</option><option value="empty">⚪ 미검색</option><option value="error">🔴 실패</option></select></div><p id="listCount" class="muted"></p></div><div id="foods" class="grid"></div></section>
<section id="detail" class="screen"><div class="row"><button id="detailBack">← 목록</button><button id="prevBtn">◀ 이전</button><button id="nextBtn">다음 ▶</button></div><div id="detailContent" class="card"></div></section>
<section id="parent" class="screen"><div class="panel"><div class="row"><button id="parentBack">← 나라목록</button><h2>⚙️ 부모모드 · 음식 이름 사전</h2></div><div class="warn">품질점수는 자료 충실도에 관한 참고값이며 음식·사진의 사실 검증 결과가 아닙니다. 기존 완료 상태를 자동으로 변경하지 않습니다.</div><div id="parentStats" class="row" style="margin:12px 0"></div><div class="row"><input type="search" id="parentSearch" placeholder="음식명·검색 제목·별칭 검색"><select id="parentFilter"><option value="all">전체 음식</option><option value="alias">별칭 부족</option><option value="short">설명 부족</option><option value="photo">사진 없음</option><option value="risk">오검색 검토 필요</option><option value="review">미검토</option></select><button id="reviewExport">📋 점검 보고서</button></div><p id="parentCount" class="muted"></p></div><div id="parentFoods" class="grid"></div></section></main><footer>기존 데이터 보호 · 사진 없어도 정확한 설명이면 카드 가능 · 수동 확인은 별도 기록</footer><script>
const VERSION='V2 Stage 2.0',KEY='world_food_v2_stage2_edits_v1';let base=[],countries=[],edits={},selectedCountry='ALL',viewList=[],activeId='',lastScreen='list',parentMode=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getAll(){let m=new Map(base.map(x=>[x.id,{...x}]));for(let [id,edit] of Object.entries(edits)){if(edit.__added&&!m.has(id))m.set(id,{...edit});else if(m.has(id))m.set(id,{...m.get(id),...edit});}return [...m.values()].filter(x=>!x.deleted)}
function state(x){return ['done','candidate','empty','error'].includes(x.status)?x.status:'empty'}
function label(x){return {done:'🟢 완성',candidate:'🟣 후보',empty:'⚪ 미검색',error:'🔴 실패'}[state(x)]}
function score(x){let a=x.aliases||[];return (x.name?20:0)+(a.length>=2?20:a.length?10:0)+(x.description?.length>=80?30:x.description?.length>=35?15:0)+(x.photoUrl?15:0)+(x.verification==='manual-confirmed'?15:0)}
function issues(x){let out=[];if((x.aliases||[]).length<2)out.push('별칭 부족');if((x.description||'').length<80)out.push('설명 부족');if(!x.photoUrl)out.push('사진 없음');if(/오검색|차단|불일치|비음식|상위개념|재검토/i.test(x.risk||''))out.push('오검색 검토');if(x.verification!=='manual-confirmed')out.push('미검토');return out}
function save(){try{localStorage.setItem(KEY,JSON.stringify(edits));return true}catch(e){alert('저장 실패: '+e.message+'\n기존 자료를 삭제하지 않았습니다. 백업을 먼저 저장하세요.');return false}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('show',x.id===id));scrollTo(0,0)}
function counts(a){let d=a.filter(x=>state(x)==='done').length;return `${d}/${a.length}`}
function home(){show('home');let all=getAll();$('stats').innerHTML=`<span class="stat">🌍 ${countries.length}개국</span><span class="stat">🍽️ ${all.length}개 음식</span><span class="stat">🟢 ${all.filter(x=>state(x)==='done').length}개 카드</span><span class="stat">🟣 ${all.filter(x=>state(x)==='candidate').length}개 후보</span>`;let term=$('countrySearch').value.trim();$('countries').innerHTML=countries.filter(c=>c.name.includes(term)).map(c=>{let a=all.filter(x=>x.countryCode===c.code);return `<button class="tile" data-country="${esc(c.code)}"><b>${esc(c.flag)} ${esc(c.name)}</b><small>🟢 ${counts(a)}</small></button>`}).join('');document.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>list(b.dataset.country))}
function list(code){selectedCountry=code;show('list');renderList()}
function renderList(){let all=getAll();let a=selectedCountry==='ALL'?all:all.filter(x=>x.countryCode===selectedCountry);let c=countries.find(x=>x.code===selectedCountry);$('listTitle').textContent=c?`${c.flag} ${c.name} · ${counts(a)}`:`전체 음식 · ${counts(a)}`;let q=$('foodSearch').value.toLowerCase(),st=$('statusFilter').value;viewList=a.filter(x=>(st==='all'||state(x)===st)&&[x.name,x.title,...(x.aliases||[])].join(' ').toLowerCase().includes(q));$('listCount').textContent=`${viewList.length}개 표시`; $('foods').innerHTML=viewList.map(x=>`<button class="tile ${state(x)}" data-id="${esc(x.id)}"><b>${esc(x.name)}</b><small>${label(x)} · 품질 ${score(x)}점</small></button>`).join('');document.querySelectorAll('#foods [data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id,'list'))}
function detail(id,from){activeId=id;lastScreen=from||lastScreen;show('detail');renderDetail()}
function renderDetail(){let x=getAll().find(z=>z.id===activeId);if(!x){list(selectedCountry);return}let a=lastScreen==='parent'?getParentItems():viewList;let ix=a.findIndex(z=>z.id===x.id);$('prevBtn').disabled=ix<1;$('nextBtn').disabled=ix<0||ix===a.length-1;$('prevBtn').onclick=()=>detail(a[ix-1].id,lastScreen);$('nextBtn').onclick=()=>detail(a[ix+1].id,lastScreen);let iss=issues(x);$('detailContent').innerHTML=`<div class="row"><span class="pill">${label(x)}</span><span class="pill">품질 참고점수 ${score(x)}/100</span><span class="pill">${esc(x.country)}</span></div><h2>${esc(x.name)}</h2><p class="muted">검색 제목: ${esc(x.title||'없음')}</p>${x.photoUrl?`<img src="${esc(x.photoUrl)}" alt="${esc(x.name)}" onerror="this.replaceWith(document.createTextNode('사진을 불러오지 못했습니다.'))">`:'<p class="warn">📷 사진 준비 중 — 설명이 정확하면 사진 없이도 카드를 완성할 수 있습니다.</p>'}<p style="white-space:pre-wrap;line-height:1.7">${esc(x.description||'설명이 아직 없습니다.')}</p><div class="field"><b>검색 별칭</b><p>${(x.aliases||[]).map(z=>`<span class="pill">${esc(z)}</span>`).join(' ')||'없음'}</p></div><p class="quality">검토 상태: ${esc(x.verification||'미검토')} · ${esc(x.risk||'')}</p><p class="muted">확인할 사항: ${esc(iss.join(', ')||'자동 규칙상 부족 항목 없음')}</p><button id="editThis" class="primary">✏️ 부모모드에서 수정·검토</button> ${x.sourceUrl?`<button id="sourceThis">출처 열기 ↗</button>`:''}<div id="editor" class="hidden"></div>`;$('editThis').onclick=()=>editor(x);if(x.sourceUrl)$('sourceThis').onclick=()=>window.open(x.sourceUrl,'_blank','noopener')}
function editor(x){let e=$('editor');e.classList.remove('hidden');e.innerHTML=`<hr><h3>부모모드: 카드 정보 편집</h3><p class="warn">대표이름과 항목 ID는 보존합니다. 별칭과 설명 수정은 현재 기기에 저장되며 백업으로 옮길 수 있습니다.</p><div class="field"><label>별칭 (한 줄에 하나)</label><textarea id="editAliases">${esc((x.aliases||[]).join('\n'))}</textarea></div><div class="field"><label>설명</label><textarea id="editDesc">${esc(x.description||'')}</textarea></div><div class="field"><label>사진 주소 (없어도 됩니다)</label><input id="editPhoto" value="${esc(x.photoUrl||'')}"></div><div class="field"><label>상태</label><select id="editStatus"><option value="${state(x)}">현재 상태 유지 (${label(x)})</option><option value="done">🟢 완료</option><option value="candidate">🟣 후보</option><option value="empty">⚪ 미검색</option></select></div><div class="row"><button id="saveEdit" class="primary">저장</button><button id="markReviewed">✔ 직접 검토 완료</button></div>`;function commit(review){let al=$('editAliases').value.split('\n').map(z=>z.trim()).filter(Boolean);al=[...new Set([x.name,...al])];let p={aliases:al,description:$('editDesc').value,photoUrl:$('editPhoto').value.trim(),status:$('editStatus').value};if(review){p.verification='manual-confirmed';p.risk='사용자 직접 검토 완료'}edits[x.id]={...(edits[x.id]||{}),...p};if(save()){renderDetail();alert(review?'검토 완료로 저장했습니다.':'변경 내용을 저장했습니다.')}}$('saveEdit').onclick=()=>commit(false);$('markReviewed').onclick=()=>commit(true)}
function getParentItems(){let a=getAll(),q=$('parentSearch').value.toLowerCase(),f=$('parentFilter').value;return a.filter(x=>[x.name,x.title,...(x.aliases||[])].join(' ').toLowerCase().includes(q)&& (f==='all'||(f==='alias'&&(x.aliases||[]).length<2)||(f==='short'&&(x.description||'').length<80)||(f==='photo'&&!x.photoUrl)||(f==='risk'&&issues(x).includes('오검색 검토'))||(f==='review'&&x.verification!=='manual-confirmed')))}
function parent(){show('parent');renderParent()}
function renderParent(){let a=getAll(),v=getParentItems();$('parentStats').innerHTML=`<span class="stat">560개 기준 항목</span><span class="stat">별칭 부족 ${a.filter(x=>(x.aliases||[]).length<2).length}</span><span class="stat">설명 부족 ${a.filter(x=>(x.description||'').length<80).length}</span><span class="stat">사진 없음 ${a.filter(x=>!x.photoUrl).length}</span><span class="stat">직접 검토 ${a.filter(x=>x.verification==='manual-confirmed').length}</span>`;$('parentCount').textContent=`${v.length}개 표시`;$('parentFoods').innerHTML=v.map(x=>`<button class="tile ${state(x)}" data-id="${esc(x.id)}"><b>${esc(x.country)} · ${esc(x.name)}</b><small>${label(x)} · ${score(x)}점<br>${esc(issues(x).join(' · '))}</small></button>`).join('');document.querySelectorAll('#parentFoods [data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id,'parent'))}
function download(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function backup(){download({format:'world-food-stage2-backup',version:VERSION,exported:new Date().toISOString(),edits,items:getAll()},'World_Food_V2_Stage2_Backup.json')}
function review(){download({format:'world-food-stage2-review',version:VERSION,exported:new Date().toISOString(),items:getAll().map(x=>({id:x.id,country:x.country,name:x.name,aliases:x.aliases,title:x.title,status:x.status,verification:x.verification,qualityScore:score(x),issues:issues(x),description:x.description,photoUrl:x.photoUrl}))},'World_Food_V2_Stage2_Quality_Review.json')}
function importData(d){if(d.format==='world-food-stage2-backup'&&d.edits&&typeof d.edits==='object'){edits={...edits,...d.edits};if(save()){alert('Stage 2 백업을 병합했습니다.');home()}return}if(d.app==='World Food Encyclopedia V2'&&d.edits){let override=d.edits.overrides||{},added=d.edits.added||[];for(let x of added){if(x.id)edits[x.id]={...x,description:x.desc||'',photoUrl:x.image||'',__added:true}}for(let [id,x] of Object.entries(override)){let p={...x};if('desc'in x)p.description=x.desc;if('image'in x)p.photoUrl=x.image;edits[id]={...(edits[id]||{}),...p}}if(save()){alert('V2 전체 백업의 편집 기록을 병합했습니다.');home()}return}alert('지원하지 않는 백업 형식입니다. 기존 자료는 유지했습니다.')}
$('homeBtn').onclick=home;$('backCountries').onclick=home;$('detailBack').onclick=()=>lastScreen==='parent'?parent():list(selectedCountry);$('parentBack').onclick=home;$('parentBtn').onclick=parent;$('allBtn').onclick=()=>list('ALL');$('countrySearch').oninput=home;$('foodSearch').oninput=renderList;$('statusFilter').onchange=renderList;$('parentSearch').oninput=renderParent;$('parentFilter').onchange=renderParent;$('backupBtn').onclick=backup;$('reviewExport').onclick=review;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{importData(JSON.parse(await f.text()))}catch(err){alert('파일 읽기 오류: '+err.message)}e.target.value=''};
(async()=>{try{let r=await fetch('catalog.json');if(!r.ok)throw Error('catalog.json 파일을 불러올 수 없습니다');let d=await r.json();base=d.items;countries=d.countries;try{edits=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){alert('저장 데이터 읽기 오류. 기존 저장소는 변경하지 않았습니다.')}home()}catch(e){$('stats').textContent='데이터 로딩 오류: '+e.message}})();
</script></body></html>
