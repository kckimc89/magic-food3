function autoTerms(f){
 const a=[...(f.aliases||[])].map(x=>String(x).trim()).filter(Boolean);
 const latin=a.filter(x=>/[A-Za-zÀ-ž]/.test(x));
 // 한국어 별칭만 등록된 나라가 많으므로 대표이름의 정확한 일치를 우선 확인.
 const terms=[...latin,f.name,f.name+' 음식',f.country+' '+f.name+' 요리',...a];
 return [...new Set(terms)].filter(x=>x&&x.length<90).slice(0,5);
}
function titleIdentity(title,f){
 const raw=String(title||'').replace(/\s*\([^)]*\)\s*/g,'').trim();
 const titleNorm=norm(raw);
 const aliases=[f.name,...(f.aliases||[])].filter(x=>String(x).trim().length>=2);
 return aliases.some(x=>{const n=norm(x);return n.length>=2&&titleNorm===n;});
}
function autoFoodCheck(f,title,desc){
 const d=String(desc||'').trim();
 if(d.length<70||!/[가-힣]/.test(d))return {ok:false,reason:'한국어 설명이 충분하지 않음'};
 if(rejectWikiTopic(title,d))return {ok:false,reason:'비음식 주제 차단'};
 if(!titleIdentity(title,f))return {ok:false,reason:'음식 대표이름과 검색 제목 불일치'};
 const intro=d.slice(0,500);
 const nonFood=/정치인|정당|축구 선수|축구단|농구 선수|배우|가수|천체|소행성|영화 작품|드라마|지명|도시|행정 구역|대학교|군인|전쟁|선거|기업|야구 선수/;
 if(nonFood.test(intro))return {ok:false,reason:'다른 분야의 문서로 의심'};
 const foodCue=/음식|요리|먹|식사|재료|조리|전통|주식|간식|만두|국수|수프|빵|밥|쌀|고기|생선|튀김|튀겨|굽|구워|찐|찌는|삶|치즈|소스|디저트|과자|음료|차\b|커피|국물|채소|샐러드|달걀|밀가루|떡|향신료|식품|발효|과일|식문화|요거트|파스타|면 요리|국물/;
 if(!foodCue.test(intro))return {ok:false,reason:'음식 설명이라는 근거가 부족함'};
 return {ok:true,reason:'제목 일치 · 음식 관련 설명 확인(사실검증 전)'};
}
async function fetchAutoWikiCandidate(f){
 const terms=autoTerms(f);let networkError=null;
 for(const term of terms){
  if(autoState.stopRequested)return {state:'stopped',terms};
  const api='https://ko.wikipedia.org/w/api.php?action=query&list=search&srlimit=6&format=json&origin=*&srsearch='+encodeURIComponent(term);
  let pages=[];
  try{const response=await fetchWithTimeout(api);pages=(await response.json()).query?.search||[];}
  catch(e){networkError=e;continue;}
  const exact=pages.filter(p=>titleIdentity(p.title,f)).slice(0,2);
  for(const p of exact){
   if(autoState.stopRequested)return {state:'stopped',terms};
   try{
    const url='https://ko.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages|info&exintro=1&explaintext=1&inprop=url&pithumbsize=700&redirects=1&format=json&origin=*&titles='+encodeURIComponent(p.title);
    const resp=await fetchWithTimeout(url);const data=await resp.json();const page=Object.values(data.query?.pages||{})[0];
    if(!page||page.missing!==undefined)continue;
    const desc=String(page.extract||'').slice(0,3500),test=autoFoodCheck(f,page.title,desc);
    if(!test.ok)continue;
    return {state:'candidate',terms,title:page.title,desc,image:page.thumbnail?.source||'',url:page.fullurl||'',reason:test.reason};
   }catch(e){networkError=e;}
  }
 }
 // 연결 장애가 발생한 경우 검색 실패로 확정하지 않고 안전하게 중지하여 재개 가능하게 함.
 if(networkError)return {state:'network-error',terms,reason:String(networkError.message||networkError)};
 return {state:'unmatched',terms,reason:'일치하는 한국어 음식 문서를 충분히 확인하지 못함 · 흰색 유지'};
}

   }

     terms:result.terms||[],checked:new Date().toISOString()};
   try{await dbWrite(AUTO_LOG_KEY,autoLog);}catch(e){autoState.message='검색 진행 기록 저장 실패: '+e.message;break;}
   autoState.processedSession++;
   autoState.message=result.state==='candidate'?`🟣 「${f.name}」 후보 저장됨 · 품질검토 대기`:`「${f.name}」 적합한 후보 미확보 · 흰색 유지`;
   updateAutoPanels();
   // 연속 API 호출 속도를 제한하고 iPad Safari가 화면 갱신할 시간을 줍니다.
   await new Promise(resolve=>setTimeout(resolve,1100));
  }
 }finally{

  renderAll();
 }
}

 modal(`<h2 class="titleline">🔍 ${esc(f.name)} · ${autoStart?'흰색 이름표 검색':'검색후보 다시 찾기'}</h2><p class="info">${autoStart?'흰색 이름표를 눌러 검색을 시작했습니다.':'음식 이름과 별칭으로 새 후보를 찾습니다.'} 검색한 결과는 확인 후 보라색 후보로 저장합니다. 자동으로 초록색이 되지는 않습니다.</p>${!admin?'<p class="warning">🔒 검색은 할 수 있지만 후보 저장에는 부모모드 ON이 필요합니다.</p>':''}<form class="searchbar" id="wikiForm"><input id="wikiQuery" value="${esc(initial)}" placeholder="음식 이름이나 현지어 별칭" aria-label="음식 검색어"><button type="submit">🔍 검색</button></form><div class="actions" style="margin:8px 0">${safeSuggestions}</div><div id="wikiResults" class="manage-list" aria-live="polite"><p class="muted">${autoStart?'자동 검색을 준비 중입니다…':'별칭을 선택하거나 검색 버튼을 눌러주세요.'}</p></div><div class="classic-action-row">${admin?`<button type="button" data-action="edit" data-id="${esc(id)}">✏️ 이름·별칭 수정</button><button type="button" data-action="delete" data-id="${esc(id)}">🗑 음식 항목 삭제 · 휴지통</button>`:`<button type="button" data-action="enable-parent-research" data-id="${esc(id)}">🔓 부모모드 켜고 검색</button>`}</div>`);
 const form=$('#wikiForm'),queryInput=$('#wikiQuery'),result=$('#wikiResults');
 const renderPages=(pages,q)=>{if(!result.isConnected)return;result.innerHTML=pages.length?`<p class="muted">「${esc(q)}」 검색 결과 ${pages.length}개 · 음식과 일치하는지 확인해 주세요.</p>`+pages.map(p=>`<div class="manage-row"><span><b>${esc(p.title)}</b><br><small class="muted">${esc((p.snippet||'').replace(/<[^>]+>/g,'').slice(0,160))}</small></span><button type="button" data-wiki="${esc(p.title)}" data-food="${esc(id)}">🔎 미리보기</button></div>`).join(''):'<p class="warning">검색 결과가 없습니다. 다른 별칭을 선택하거나 검색어를 수정해 주세요.</p>';};
 let serial=0;
 async function searchNow(q,allowFallback=false){
  const my=++serial;
  const terms=allowFallback?[...new Set([q,...suggestions])].slice(0,4):[q];
  for(let i=0;i<terms.length;i++){
   if(!result.isConnected||my!==serial)return;
   const term=terms[i];result.innerHTML=`<p class="info">🔄 검색 중… (${i+1}/${terms.length}) 「${esc(term)}」</p>`;
   try{
    const api='https://ko.wikipedia.org/w/api.php?action=query&list=search&srlimit=8&format=json&origin=*&srsearch='+encodeURIComponent(term);
    const r=await fetchWithTimeout(api),data=await r.json(),pages=data.query?.search||[];
    if(!result.isConnected||my!==serial)return;
    if(pages.length){queryInput.value=term;renderPages(pages,term);return;}
   }catch(e){if(!result.isConnected||my!==serial)return;if(i===terms.length-1){result.innerHTML=`<p class="warning">검색 연결에 실패했습니다. 인터넷 연결 또는 위키백과 접근을 확인해 주세요. (${esc(e.message)})</p>`;return;}}
  }
  if(result.isConnected&&my===serial)renderPages([],q);
 }
 form.addEventListener('submit',e=>{e.preventDefault();const q=queryInput.value.trim();if(q)searchNow(q,false);});
 const holder=$('#detail');holder.querySelectorAll('[data-research-query]').forEach(btn=>btn.addEventListener('click',()=>{queryInput.value=btn.dataset.researchQuery;searchNow(queryInput.value,false);}));
 if(autoStart)requestAnimationFrame(()=>{if(result.isConnected)searchNow(initial,true);});
}
function fetchWithTimeout(url){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),12000);return fetch(url,{signal:ctrl.signal}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r;}).finally(()=>clearTimeout(timer));}
async function wikiPreview(id,title){const f=foodMap.get(id);if(!f)return;modal(`<h2 class="titleline">후보 내용 확인</h2><p>불러오는 중입니다…</p>`);try{const url='https://ko.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages|info&exintro=1&explaintext=1&inprop=url&pithumbsize=700&redirects=1&format=json&origin=*&titles='+encodeURIComponent(title);const d=await (await fetchWithTimeout(url)).json(),p=Object.values(d.query?.pages||{})[0];if(!p||p.missing!==undefined)throw new Error('문서를 찾지 못했습니다.');const desc=(p.extract||'').slice(0,3500),img=p.thumbnail?.source||'',link=p.fullurl||'';modal(`<h2 class="titleline">${esc(p.title)}</h2><p class="warning">이 문서가 정말 「${esc(f.name)}」 음식인지 직접 확인해 주세요. 천체·인물·스포츠 등 다른 주제라면 저장하지 마세요.</p>${img?`<img class="detail-img" src="${esc(img)}" alt="검색 사진">`:''}<p class="desc">${esc(desc||'설명이 없습니다.')}</p><div class="actions"><button type="button" class="admin-button" id="saveWikiCandidate">이 결과를 검색후보로 저장</button><button type="button" data-action="research" data-id="${esc(id)}">다른 후보 찾기</button></div>`);$('#saveWikiCandidate').addEventListener('click',async()=>{if(!admin)return alert('후보를 저장하려면 부모모드를 켜주세요.');if(!desc||desc.length<25)return alert('설명이 부족하여 저장할 수 없습니다.');if(rejectWikiTopic(p.title,desc))return alert('음식과 무관한 문서로 의심되어 저장을 차단했습니다. 다른 검색어를 사용해 주세요.');if(!confirm('음식과 관련된 문서임을 확인했나요? 후보로만 저장되며 초록색 완성 카드는 되지 않습니다.'))return;const o=edits.overrides[id]||{};Object.assign(o,{title:p.title,desc:o.manualDescSet?o.manualDesc:desc,image:o.manualImageSet?o.manualImage:img,url:link,lang:'ko',status:'candidate',risk:'사용자 확인 대기',verification:'manual-candidate',descriptionLength:(o.manualDescSet?o.manualDesc:desc).length,reviewed:true,updated:new Date().toISOString()});edits.overrides[id]=o;if(await persist()){renderAll();openFood(id);}});}catch(e){modal(`<h2>후보 불러오기 실패</h2><p class="warning">${esc(e.message)}</p><button class="soft-btn" data-action="research" data-id="${esc(id)}">검색으로 돌아가기</button>`);}}
async function init(){renderAll();try{db=await openDB();const saved=await dbRead('edits');if(saved&&Array.isArray(saved.added)&&Array.isArray(saved.deleted)&&saved.overrides){edits={...JSON.parse(JSON.stringify(EMPTY)),...saved};}const storedLog=await dbRead(AUTO_LOG_KEY);if(storedLog&&typeof storedLog==='object'&&!Array.isArray(storedLog))autoLog=storedLog;renderAll();}catch(e){alert('저장소를 열지 못했습니다. 카드 관리를 저장할 수 없습니다. 사파리 일반 모드에서 열어주세요.\n'+e.message);}if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-action],[data-open],[data-country],[data-view-go],[data-cat],[data-restore],[data-permanent],[data-wiki],[data-country-jump]');if(!t)return;
 if(t.dataset.open){openFood(t.dataset.open);return;}
 if(t.dataset.countryJump){renderCountryFoods(t.dataset.countryJump);return;}
 if(t.dataset.country){renderCountryFoods(t.dataset.country);return;}
 if(t.dataset.viewGo){showView(t.dataset.viewGo);return;}
 if(t.dataset.cat){currentFilter=t.dataset.cat;renderFoods();return;}
 if(t.dataset.restore){await restoreItem(t.dataset.restore);return;}
 if(t.dataset.permanent){await permanentDelete(t.dataset.permanent);return;}
 if(t.dataset.wiki){await wikiPreview(t.dataset.food,t.dataset.wiki);return;}
 const action=t.dataset.action,id=t.dataset.id;
 if(action==='toggle-admin'){admin=!admin;renderAll();if($('#detail').classList.contains('active'))closeDetail();return;}
 if(action==='toggle-country-list'){countryListExpanded=!countryListExpanded;renderCountries();updateAutoPanels();return;}
 if(action==='toggle-all-country-cards'){allCountryCardsShown=!allCountryCardsShown;countryCardVisibility={};renderCountries();updateAutoPanels();return;}
 if(action==='toggle-country-cards'){countryCardVisibility[id]=!countryCardsVisible(id);renderCountries();updateAutoPanels();return;}
 if(action==='add-country'){openQuickAdd(id);return;}
 if(action==='trash-country'){openTrash(id);return;}
 if(action==='photo-change'){openEditor(id,'editPhotoFile');return;}
 if(action==='desc-edit'){openEditor(id,'editDesc');return;}
 if(action==='name-edit'){openEditor(id,'editName');return;}
 if(action==='restore-photo'){await restoreOriginal(id,'image');return;}
 if(action==='restore-desc'){await restoreOriginal(id,'desc');return;}
 if(action==='close'){closeDetail();return;}
 if(action==='open'){openFood(id);return;}
 if(action==='fav'||action==='bucket'){toggleList(action==='fav'?'favorites':'bucket',id);return;}
 if(action==='edit'){openEditor(id);return;}
 if(action==='add'){openQuickAdd();return;}
  if(action==='toggle-review'){parentOnlyReview=!parentOnlyReview;renderParent();updateAutoPanels();return;}
 if(action==='trash'){openTrash();return;}
 if(action==='card-remove'){await removeCardOnly(id);return;}
 if(action==='complete-card'){await completeCandidateCard(id);return;}
 if(action==='photo-full'){showFullPhoto(id);return;}
 if(action==='toggle-compact'){detailCompact=!detailCompact;openFood(id);return;}
 if(action==='review-group'){reviewGroup=id;parentOnlyReview=false;renderParent();return;}
 if(action==='delete'){await softDelete(id);return;}
 if(action==='reset'){await resetSearch(id);return;}
 if(action==='research'){openResearch(id);return;}
 if(action==='enable-parent-research'){admin=true;renderAll();openResearch(id,true);return;}
 if(action==='auto-start'){void startAutoBatch(false);return;}
 if(action==='auto-retry'){if(confirm('검색 결과가 없었던 흰색 항목을 다시 검색할까요? 기존 보라색·초록색 카드는 유지됩니다.'))void startAutoBatch(true);return;}
 if(action==='auto-stop'){autoState.stopRequested=true;autoState.message='현재 검색이 끝나면 일시중지합니다.';updateAutoPanels();return;}
 if(action==='review-export'){await exportReview();return;}
 if(action==='backup'){await exportBackup();return;}
 if(action==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>importBackup(inp.files[0]);inp.click();return;}
 if(action==='reset-user'){if(confirm('즐겨찾기와 먹어보고 싶어요 표시만 초기화할까요?')){user={favorites:[],bucket:[],notes:{}};saveUser();renderAll();}return;}
});
const backTop=$('#backTop');window.addEventListener('scroll',()=>{backTop.classList.toggle('visible',window.scrollY>450);},{passive:true});backTop.addEventListener('click',()=>{const d=$('#detail');if(d.classList.contains('active'))d.scrollTo({top:0,behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'});});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b){if(b.dataset.view==='parent'&&!admin){admin=true;renderAll();}showView(b.dataset.view);}});
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();searchQuery=$('#searchInput').value.trim();renderSearch();}if(e.target.id==='parentSearch'){e.preventDefault();parentQuery=$('#parentSearchInput').value.trim();renderParent();}});
$('#detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
init();
})();
</script>
