<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#7c3f16" />
<title>세계 음식대백과 V2</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
:root {
  --bg:#fff8ec; --paper:#ffffff; --ink:#2d221b; --muted:#735f50; --line:#ead9c5;
  --accent:#7c3f16; --accent2:#b65e22; --gold:#f3bb4f; --soft:#fff1d8;
  --green:#e4f7e9; --green-line:#8acb98; --purple:#efe6ff; --purple-line:#b59be5; --red:#ffe8e8; --blue:#eaf4ff;
  --shadow:0 10px 30px rgba(80,50,20,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#fff3df 0%,#fff8ec 42%,#fff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:18px 14px 90px}
.hero{border-radius:28px;padding:20px;background:linear-gradient(135deg,#8f4a1d,#ca7630 58%,#f6c15e);color:white;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero h1{margin:0 0 6px;font-size:clamp(28px,5.5vw,48px);letter-spacing:-.04em}
.hero p{margin:0;color:#fff7e7;font-size:17px}
.top-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.stat-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:8px 12px;font-weight:800}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.nav button,.soft-btn{min-height:54px;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 12px;color:var(--ink);box-shadow:0 4px 12px rgba(72,44,14,.06);font-weight:850}
.nav button.active{background:var(--accent);color:white;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 6px 20px rgba(80,50,20,.07)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}
.section-title h2{font-size:22px;margin:0;letter-spacing:-.03em}
.muted{color:var(--muted)}
.big-card{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center}
.food-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;background:#f2e5d7;border:1px solid var(--line)}
.placeholder{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border-radius:20px;background:linear-gradient(135deg,#fff0d6,#f7dba8);font-size:48px;border:1px solid var(--line)}
.titleline{font-size:26px;font-weight:900;letter-spacing:-.04em;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 9px;background:var(--soft);font-size:13px;font-weight:800;color:#704b2b;border:1px solid #f2d7ae}
.chip.done{background:var(--green);border-color:var(--green-line)}
.chip.candidate{background:var(--purple);border-color:var(--purple-line)}
.chip.warn{background:var(--red);border-color:#efb1b1}
.card-btn{border:0;background:transparent;text-align:left;padding:0;width:100%}
.country-card,.food-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 18px rgba(80,50,20,.06);min-height:126px;display:flex;flex-direction:column;gap:8px}
.country-card:hover,.food-card:hover{border-color:#d2a878}
.country-flag{font-size:34px}
.country-name{font-size:20px;font-weight:900}
.progress{height:9px;background:#f0e1cf;border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#7fb36b,#4f9b61);border-radius:999px}
.food-card .name{font-weight:900;font-size:18px}
.food-card.done{border-color:var(--green-line);background:linear-gradient(180deg,#fff,#f6fff8)}
.food-card.candidate{border-color:var(--purple-line);background:linear-gradient(180deg,#fff,#fbf7ff)}
.food-card.block{border-color:#efb1b1;background:linear-gradient(180deg,#fff,#fff4f4)}
.searchbar{display:flex;gap:8px;margin:8px 0 14px}
.searchbar input{flex:1;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:white;min-height:52px;font-size:17px}
.searchbar button{border:0;border-radius:18px;padding:0 18px;background:var(--accent);color:white;font-weight:900}
.view{display:none}
.view.active{display:block}
.detail{position:fixed;inset:0;background:rgba(45,34,27,.48);display:none;z-index:10;padding:14px;overflow:auto}
.detail.active{display:block}
.detail-card{max-width:860px;margin:20px auto;background:white;border-radius:28px;overflow:hidden;box-shadow:0 18px 60px rgba(30,20,10,.28)}
.detail-head{padding:16px 16px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.close{border:0;background:#f6e8d6;border-radius:999px;width:44px;height:44px;font-weight:900}
.detail-body{padding:0 16px 18px}
.detail-img{width:100%;max-height:390px;object-fit:cover;border-radius:22px;border:1px solid var(--line);background:#f2e5d7}
.desc{line-height:1.65;font-size:17px;background:#fffaf2;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.actions button{border:1px solid var(--line);border-radius:999px;background:white;padding:11px 14px;font-weight:900}
.actions button.on{background:var(--accent);color:white;border-color:var(--accent)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{border:1px solid var(--line);background:#fffdf8;border-radius:18px;padding:12px}
.kv b{display:block;margin-bottom:6px}
.list{display:grid;gap:8px}
.mini-food{border:1px solid var(--line);border-radius:16px;padding:10px;background:white;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.mini-food img{width:54px;height:44px;border-radius:10px;object-fit:cover;background:#f2e5d7}
.parent-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.parent-stat{background:#fffaf3;border:1px solid var(--line);border-radius:18px;padding:14px}
.parent-stat strong{font-size:26px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:16px;padding:12px}
.manage-form{display:grid;gap:12px}.manage-form label{display:grid;gap:6px;font-weight:800}.manage-form input,.manage-form select,.manage-form textarea{border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;background:#fff}.manage-form textarea{min-height:145px}.warning{background:#fff0e9;border:1px solid #f0baa1;border-radius:14px;padding:12px;color:#733a20}.info{background:#f0f8ff;border:1px solid #bddcf4;border-radius:14px;padding:12px}.manage-list{display:grid;gap:8px}.manage-row{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px;flex-wrap:wrap}.manage-row button{border:1px solid var(--line);border-radius:12px;background:white;padding:9px 12px;font-weight:800}.admin-button{background:#fff2d9!important;border-color:#e5b76c!important}.footer-note{margin:20px 0;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:880px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.big-card{grid-template-columns:1fr}.parent-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.app{padding:12px 10px 86px}.hero{border-radius:22px;padding:18px}.nav{grid-template-columns:repeat(2,1fr);position:sticky;bottom:8px;z-index:5;background:rgba(255,248,236,.86);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:8px}.nav button{min-height:48px;border-radius:14px;font-size:14px}.grid{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.detail-card{margin:0 auto;border-radius:22px}}

/* V2 Stage 1.9: 2줄 나라 선택기 / 연속 탐험 / 부모 ON·OFF */
.parent-toggle-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-4px 0 14px;flex-wrap:wrap}
.parent-switch{border:1px solid #d4c3b0;background:#fff;border-radius:999px;padding:11px 18px;font-weight:900;color:#5b4638;min-height:46px}
.parent-switch.on{background:#dff4e7;border-color:#75ba8c;color:#20683c}
.parent-switch:focus-visible,.country-choice:focus-visible,.food-pill:focus-visible{outline:3px solid #4b91dc;outline-offset:2px}
.country-picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.country-picker.collapsed .country-choice:nth-child(n+11){display:none}
.country-choice{border:1px solid var(--line);border-radius:15px;background:#fffdf8;min-height:54px;padding:8px 6px;font-weight:850;font-size:15px;color:var(--ink);text-align:center;overflow-wrap:anywhere}
.country-choice.selected{border-color:var(--accent2);background:#fff0d8}
.country-toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}
.country-toolbar button,.country-controls button{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px 13px;font-weight:850;min-height:44px}
.country-controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.country-section{border:1px solid var(--line);background:#fffdf9;border-radius:20px;padding:16px;margin:14px 0;scroll-margin-top:12px}
.country-section .section-title h2{font-size:24px}
.country-section .country-meta{color:var(--muted);font-size:14px}
.food-pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.food-pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:850;min-height:40px;color:#49362a}
.food-pill.done{border-color:var(--green-line);background:#f0fff3}
.food-pill.candidate{border-color:var(--purple-line);background:#f9f3ff}
.food-pill.block{border-color:#e6a0a0;background:#fff4f4}
.country-completed{margin-top:12px}
.admin-actions{background:#fff8e8;border:1px solid #e8c78f;border-radius:18px;padding:12px;margin:12px 0}
.admin-actions .actions{margin:6px 0}
.admin-actions .actions button{background:#fff;border-color:#e5bf83}
.admin-hint{font-size:13px;color:#735f50;margin:6px 0 0}
@media(max-width:560px){.country-picker{grid-template-columns:repeat(3,minmax(0,1fr))}.country-picker.collapsed .country-choice:nth-child(n+7){display:none}.country-choice{font-size:14px}.country-section{padding:12px}.country-section .section-title h2{font-size:21px}}
.review-filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.review-filters button{border:1px solid #ddcbb7;background:#fff;border-radius:13px;padding:10px 12px;font-weight:850}.review-filters button.chosen{background:#fff0d8;border-color:#c98f4c}#backTop{position:fixed;right:15px;bottom:22px;z-index:7;border:1px solid #c58c5a;background:#fff4df;border-radius:999px;padding:12px 15px;font-weight:900;box-shadow:0 3px 12px #0002;display:none}#backTop.visible{display:block}@media(max-width:560px){#backTop{bottom:88px;right:10px}}

/* Stage 1.9: 기존 보라색 후보 / 초록색 완성 카드 구성 */
.detail-card.classic-candidate{max-width:870px;border:2px solid #b59be5}
.classic-candidate .detail-body{padding:8px 20px 22px}
.classic-heading{font-size:21px;font-weight:900;margin:8px 0 14px}
.classic-name{display:inline-flex;align-items:center;border:2px solid #aa8bdf;background:#f5efff;border-radius:999px;padding:9px 15px;font-weight:900;margin-bottom:12px}
.classic-preview{border:1px solid #b8a1df;background:#fff;border-radius:20px;padding:18px;margin:12px 0}
.classic-preview .desc{background:transparent;border:0;padding:2px;margin:8px 0 14px}
.classic-photo-option{display:flex;gap:10px;align-items:flex-start;justify-content:center;border:2px solid #ae92d8;border-radius:17px;padding:10px;background:#fcfaff;cursor:pointer;min-height:120px}
.classic-photo-option input{width:20px;height:20px;flex:none;margin:8px 0 0}
.classic-photo-option img{width:min(100%,410px);height:260px;object-fit:contain;display:block;border-radius:9px}
.classic-candidate .classic-action-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.classic-action-row button,.classic-action-row .soft-btn{border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px 15px;font-weight:850;min-height:44px}
.classic-action-row .primary-action{background:#e7f6e9;border:1px solid #76bd8a;color:#176334}
.classic-action-row .primary-action:disabled{opacity:.55;cursor:not-allowed}
.classic-tools{margin:16px 0 2px;padding:14px;border-top:1px solid var(--line);border-radius:12px;background:#fffdf9}
.classic-tools summary{font-weight:850;cursor:pointer;padding:5px 0}
.classic-tools .actions{margin:12px 0}
.classic-tools button{min-height:44px}
.detail-card.classic-done{max-width:780px}
.classic-done .detail-body{padding:8px 22px 26px}
.classic-done .classic-main-photo{display:block;width:100%;height:clamp(220px,38vw,360px);object-fit:cover;border-radius:17px;background:#f7f1e8;border:1px solid var(--line)}
.classic-done .classic-title{text-align:center;font-size:27px;font-weight:900;margin:15px 0}
.classic-done .classic-description{font-size:17px;line-height:1.9;white-space:pre-wrap;margin:16px 0}
.classic-culture{background:#f1f8ff;border:1px solid #d6e4f2;border-radius:16px;padding:14px 16px;margin:15px 0}
.classic-culture strong{display:block;margin-bottom:8px}
.classic-culture p{margin:0;line-height:1.65}
.classic-done .classic-action-row{margin:14px 0;justify-content:center}
.classic-done .classic-bottom-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:16px}
.classic-bottom-nav button{border:1px solid var(--line);border-radius:12px;background:#fff;min-height:46px;padding:10px 18px;font-weight:850}
.classic-bottom-nav button:disabled{opacity:.4;cursor:not-allowed}
.classic-done.compact-card .classic-main-photo{height:160px;max-width:270px;margin:auto}
.classic-done.compact-card .classic-description{font-size:15px;line-height:1.55}
.classic-done.compact-card .classic-culture{display:none}
.classic-status-note{font-size:13px;color:var(--muted);line-height:1.6}
@media(max-width:560px){.classic-candidate .detail-body,.classic-done .detail-body{padding:8px 12px 18px}.classic-photo-option img{height:190px}.classic-done .classic-main-photo{height:240px}.classic-done .classic-title{font-size:23px}.classic-done .classic-action-row button,.classic-candidate .classic-action-row button{font-size:14px;padding:10px 12px}}

/* Stage 1.9: 기존 카드 화면은 유지, 자동검색 제어판만 추가 */
.auto-batch-slot{margin:12px 0}
.auto-batch-panel{border:1px solid #c5d8d0;background:#f5fbf7;border-radius:18px;padding:14px 16px;color:#284738}
.auto-batch-panel h3{font-size:18px;margin:0 0 7px}
.auto-batch-panel p{margin:6px 0;line-height:1.5}
.auto-batch-panel .actions{margin:10px 0 4px}
.auto-batch-panel .actions button{min-height:46px;background:white;border:1px solid #9ac8b0;color:#245c42}
.auto-batch-panel .actions button.primary-search{background:#286c51;color:white;border-color:#286c51}
.auto-batch-panel .actions button:disabled{opacity:.45;cursor:not-allowed}
.auto-batch-meter{height:13px;background:#dceee4;border-radius:999px;overflow:hidden;margin:9px 0}
.auto-batch-meter>span{display:block;background:#4d9c70;height:100%;transition:width .25s ease}
.auto-batch-note{font-size:13px;color:#536d5d}
@media(max-width:560px){.auto-batch-panel{padding:12px}.auto-batch-panel .actions button{font-size:14px;padding:10px}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="hero">
    <h1>🌍 세계 음식대백과 V2</h1>
    <p>아이가 10년 뒤에도 사용할 수 있는 세계 음식 탐험 앱 · Stage 1.9</p>
    <div class="top-stats" id="topStats"></div>
  </section>
  <nav class="nav" id="nav" aria-label="주요 메뉴">
    <button type="button" data-view="home" class="active">🏠 홈</button>
    <button type="button" data-view="countries">🌎 나라 탐험</button>
    <button type="button" data-view="foods">🍽 음식 탐험</button>
    <button type="button" data-view="search">🔍 검색</button>
    <button type="button" data-view="bucket">⭐ 먹어보고 싶어요</button>
    <button type="button" data-view="favorites">❤️ 즐겨찾기</button>
    <button type="button" data-view="parent">👨‍👩‍👧 부모모드</button>
  </nav>
  <div class="parent-toggle-bar"><span class="muted">수정할 때만 켜세요</span><button type="button" id="adminToggle" class="parent-switch" data-action="toggle-admin" aria-pressed="false">🔒 부모모드 OFF</button></div>
  <main>
    <section id="home" class="view active"></section>
    <section id="countries" class="view"></section>
    <section id="foods" class="view"></section>
    <section id="search" class="view"></section>
    <section id="bucket" class="view"></section>
    <section id="favorites" class="view"></section>
    <section id="parent" class="view"></section>
  </main>
  <p class="footer-note">V2 Stage 1.9 · 205개 기존 품질 검토 유지 · 101개국 유지 · 별칭 우선 자동검색 · 중지/이어하기 · 품질검토 백업</p>
</div>

 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["파바다 아스투리아나","파바다"],"category":"수프·국물","ingredients":["흰콩","돼지고기","소시지"],"descriptionLength":62,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ES|살모레호","countryCode":"ES","country":"스페인","flag":"🇪🇸","name":"살모레호","title":"안달루시아 요리","status":"candidate","desc":"안달루시아 요리(Andalucía料理, 스페인어: cocina andaluza 코시나 안달루사[*])는 안달루시아 지방의 광활하고 다양한 풍경에 따라 가지각색이다. 안달루시아 요리 중에서 잘 알려진 것으로는 가스파초, 생선튀김 (현지에서는 페스카이토 프리토, pescaíto frito라고 부름), 하부고와 발레데로스페로체스, 그리고 트레벨레스 지역의 하몬, 마지막으로 제레스 포도주, 특히 셰리주가 있다.","image":"","url":"https://ko.wikipedia.org/?curid=1408054","lang":"ko","updated":"2026-10-14T00:41:34.029Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["살모레호","안달루시아 요리"],"category":"수프·국물","ingredients":["생선","김"],"descriptionLength":227,"categoryOriginal":"해산물","extraCategories":[]},{"id":"ES|피스토","countryCode":"ES","country":"스페인","flag":"🇪🇸","name":"피스토","title":"피스토","status":"done","desc":"피스토(Pisto 또는 pisto manchego)는 원래 무르시아주 지역, 카스티야라만차주 및 엑스트레마두라주 지역의 스페인 요리이다. 이 요리는 토마토, 양파, 가지 또는 애호박, 녹색 및 빨강 고추, 올리브 오일로 만들어진다. 일반적으로 스타터로 따뜻하게 제공되거나 다른 요리와 함께 제공된다. 종종 흰 쌀밥, 빵, 달걀 프라이 또는 절인 햄 조각과 함께 제공된다. 페이스트리와 타르트렛(엠파나딜라)의 충전재로도 사용된다.\n이 요리는 라만차의 역사적인 지역(주로 카스티야 라만차 지역에 위치함)의 기원에서 공식적으로 피스토 만체고라고 불린다. 엑스트레마두라주(pisto extremeño)의 유사 버전에서도 발견된다. 바스크주 빌바오의 피스토 아 라 빌바이나(Pisto a la Bilbaína)는 피스토 만체고와 유사하지만 일반적으로 토마토 소스에 애호박과 피망만 포함하고 때로는 계란과 함께 가볍게 스크램블한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Pisto.jpg/500px-Pisto.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3664080","lang":"ko","updated":"2026-10-14T00:41:34.746Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["피스토"],"category":"채소·샐러드","ingredients":["쌀","토마토","양파","달걀","게"],"descriptionLength":459,"categoryOriginal":"디저트","extraCategories":[]},{"id":"JP|초밥","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"초밥","title":"Sushi","status":"done","desc":"Sushi (すし, 寿司, 鮨, 鮓; pronounced [sɯɕiꜜ] or [sɯꜜɕi] ) is a traditional Japanese dish made with vinegared rice (鮨飯, sushi-meshi), typically seasoned with sugar and salt, and combined with a variety of ingredients (ねた, neta), such as seafood, vegetables, or meat; raw seafood is the most common, although some may be cooked. While sushi has numerous styles and presentations, the current defining component is the vinegared rice, also known as shari (しゃり), or sumeshi (酢飯).\nThe modern form of sushi is believed to have been created by Hanaya Yohei, who invented nigiri-zushi, the most commonly recognized type today, in which seafood is placed on hand-pressed, vinegared rice. This innovation occurred around 1824 in the Edo period (1603–1867). It was the fast food of the chōnin class in the Edo period.\nSushi is traditionally made with medium-grain white rice, although it can also be prepared with brown rice or short-grain rice. It is commonly prepared with seafood, such as squid, eel, yellowtail, salmon, tuna, or imitation crab meat (surimi). Certain types of sushi are vegetarian. It is often served with pickled ginger (gari), wasabi, and soy sauce. Daikon radish or pickled daikon (takuan) are popular garnishes for the dish.\nSushi is sometimes confused with sashimi, a dish that consists of thinly sliced raw fish or occasionally meat, without sushi rice. Today, sushi is considered one of the most popular dishes in the world.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Sushi_platter.jpg/500px-Sushi_platter.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://en.wikipedia.org/?curid=28271","lang":"en","updated":"2026-10-14T00:41:35.974Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["초밥","Sushi","寿司"],"category":"쌀·밥","ingredients":["밥"],"descriptionLength":1435,"categoryOriginal":"쌀·밥","extraCategories":["생선·해산물"]},{"id":"JP|라멘","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"라멘","title":"라멘","status":"done","desc":"라멘(일본어: ラーメン)은 일본식 시나 국수 요리이다. 일본의 국민 음식 가운데 하나로 여겨진다. 시나(シナ) 소바라고 부른다. 일반적인 맛은 쇼유(간장)와 미소(일본된장)이며, 얇게 썬 돼지고기(차슈), 김(말린 해초), 멘마(대나무순), 쪽파 등을 토핑으로 얹는다.\n오늘날 라멘은 다양한 지역적 다양성과 다양한 토핑을 갖춘 일본의 문화적 아이콘이 되었다. 일본에서는 지역마다 규슈의 돈코쓰라멘, 홋카이도의 미소라멘, 하코다테의 시오라멘과 같은 다양한 라멘이 있다. 라멘은 다양한 시설과 위치에서 제공되며, 보통 라멘 전문점인 라멘집에서 최고의 품질을 볼 수 있다.\n일본식 라멘의 인기는 일본 밖으로도 퍼져나갔다. 인스턴트 라멘 또한 1958년 일본에서 개발된 이후 국제적인 인지도를 얻었다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Shoyu_ramen%2C_at_Kasukabe_Station_%282014.05.05%29_1.jpg/500px-Shoyu_ramen%2C_at_Kasukabe_Station_%282014.05.05%29_1.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=96789","lang":"ko","updated":"2026-10-14T00:41:36.694Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["라멘"],"category":"국수·면","ingredients":["김","돼지고기","게","국수"],"descriptionLength":388,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"JP|덴푸라","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"덴푸라","title":"덴푸라","status":"done","desc":"덴푸라(일본어: 天 (てん)ぷら)는 일본의 튀김 요리이다. 해산물이나 채소 등에 밀가루 튀김옷을 입혀 기름에 튀겨 내는 음식으로, 16세기 후반 경 포르투갈 선교사에 의해 전해진 서양 요리의 영향을 받아 만들어졌다. 에도막부가 식용유 증산을 주도한 후 튀김요리가 널리 보급되면서 현대들어서는 일본의 국민 음식 가운데 하나로 자리잡게 되었다.\n180도 정도의 고온으로 뜨거워진 기름에 단시간 내에 음식을 익힘으로 인해 영양가 손실이 적고 식재료 본연의 맛이 살아 있으며 기름으로 인해 고소한 맛을 더한다. 더운 날씨에 냉장 보관하지 않아도 쉽게 상하지 않는 특징이 있다. 튀김옷이나 식재료에 지방이 흡수되어 칼로리가 높은 음식으로 변한다.\n한반도에 튀김 요리 문화가 형성되는데 영향을 준 것을 추정된다. 본래 한반도에는 밀가루와 식용유가 귀했기 때문에 지짐이나 볶음 정도만 있었고 튀김 요리는 발달하지 못했었다. 조선후기와 일제 강점기 시절에 덴푸라와 함께 튀김요리가 한반도로 전래된 것으로 보인다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Tempura_01.jpg/500px-Tempura_01.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=486728","lang":"ko","updated":"2026-10-14T00:41:37.408Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["덴푸라","Tempura","튀김"],"category":"튀김·간식","ingredients":["김","밀가루","게","채소"],"descriptionLength":504,"categoryOriginal":"수프·국물","extraCategories":["생선·해산물","채소·샐러드"]},{"id":"JP|우동","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"우동","title":"우동","status":"done","desc":"우동(일본어: うどん, 순화어: 가락국수)는 밀가루에 소금물을 붓고 반죽한 것을 굵게 뽑아 만든 국수의 일종이다. 대표적인 일본 요리 중의 하나로, 밀가루를 넓게 펴서 칼로 썰어서 만든 굵은 국수, 또는 그 국수로 만든 국수 요리다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Kakeudon.jpg/500px-Kakeudon.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=148750","lang":"ko","updated":"2026-10-14T00:41:38.125Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["우동"],"category":"국수·면","ingredients":["밀가루","게","국수"],"descriptionLength":130,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"JP|소바","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"소바","title":"소바","status":"done","desc":"소바(일본어: 蕎 (そ)麦 (ば)→메밀)는 주로 메밀가루로 만든 일본 국수로, 소량의 밀가루가 혼합되어 있다. 회갈색을 띠며 약간 거친 식감이 특징이다. 이 국수를 차갑게 식혀서 차가운 쯔유에 무, 파, 고추냉이를 넣어 찍어 먹도록 함께 내거나, 뜨거운 국물에 말아서 내온다. 소바는 다양한 요리에 사용된다.\n일본에서는 패스트푸드점부터 고급 전문 음식점까지 소바를 판매한다. 건면 형태의 소바와 함께 '멘쯔유'(인스턴트 간장)가 상점에서 판매되어 가정에서도 쉽게 조리할 수 있다.\n메밀, 곧 소바에 함유된 단백질의 아미노산 균형은 인체의 필요성분과 잘 부합하며, 쌀이나 밀과 같은 다른 주식에서 부족한 아미노산을 보완할 수 있다(단백질 조합 참조). 소바를 먹는 전통은 에도 시대에 시작되었다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Dried_soba_noodles_by_FotoosVanRobin.jpg/500px-Dried_soba_noodles_by_FotoosVanRobin.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=486775","lang":"ko","updated":"2026-10-14T00:41:38.841Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["소바"],"category":"국수·면","ingredients":["쌀","밀가루","메밀","게","국수"],"descriptionLength":388,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"JP|오코노미야키","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"오코노미야키","title":"오코노미야키","status":"done","desc":"오코노미야키(일본어: お好み焼き)는 밀가루 반죽과 여러 재료를 섞거나 토핑으로 올려 철판에서 구워 만드는 짭짤한 부침개 형태의 일본식 철판요리이다. 일반적으로 양배추, 고기, 해산물 등을 넣으며, 우스터셔 소스로 만든 오코노미야키 소스, 아오노리(파래 가루), 가쓰오부시, 일본식 마요네즈, 생강초절임 등을 토핑으로 올린다.\n오코노미야키는 주로 일본 히로시마나 간사이 지방의 두 가지 독특한 조리법으로 구분되지만, 전국적으로 널리 퍼져 있으며 지역에 따라 토핑과 반죽 재료가 다양하다. 이름은 '좋아하는 대로' 또는 '원하는 대로'라는 뜻의 '오코노미'(일본어: お好み)와 '굽다'라는 뜻의 '야키'(일본어: 焼き)에서 유래했다. 간사이 방언으로 '코나몬'이라고도 하는 '코나모노', 즉 밀가루를 주재료로 하는 일본 요리의 한 예이다.\n줄여서 '오코노미'라고도 부르는데, 여기서 '오'는 경어 접두사이고 '코노미'는 '좋아하는 것'을 의미한다.\n도쿄에서 인기 있는 국물이 많은 형태의 오코노미야키는 몬자야키(또는 '몬자 야키')라고 하며 줄여서 '몬자'라고도 한다. 일본 외에도 마닐라, 타이베이, 방콕, 자카르타의 길거리 음식 상인들이 판매하고 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Okonomiyaki_001.jpg/500px-Okonomiyaki_001.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=119189","lang":"ko","updated":"2026-10-14T00:41:39.561Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["오코노미야키"],"category":"빵·밀가루","ingredients":["밀가루"],"descriptionLength":589,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"JP|다코야키","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"다코야키","title":"타코야끼","status":"done","desc":"다코야키는 밀가루 반죽에 문어 조각을 넣어 동그랗게 구운 일본 오사카의 간식입니다. 소스와 가다랑어포 등을 올려 먹습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Takoyaki_by_yomi955.jpg/500px-Takoyaki_by_yomi955.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=119191","lang":"ko","updated":"2026-10-14T00:41:40.275Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["다코야키","타코야끼","Takoyaki"],"category":"튀김·간식","ingredients":["문어","밀가루","달걀"],"descriptionLength":68,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"JP|돈카쓰","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"돈카쓰","title":"돈가스","status":"done","desc":"돈카쓰는 돼지고기에 밀가루와 달걀, 빵가루를 입혀 바삭하게 튀기는 일본 음식입니다. 잘게 썬 양배추와 소스를 곁들이는 경우가 많습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Tonkatsu_of_Kimukatsu.jpg/500px-Tonkatsu_of_Kimukatsu.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=143195","lang":"ko","updated":"2026-10-14T00:41:40.992Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["돈카쓰","돈가스","Tonkatsu"],"category":"고기요리","ingredients":["돼지고기","빵가루","달걀"],"descriptionLength":75,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"JP|스키야키","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"스키야키","title":"스키야키","status":"done","desc":"스키야키(일본어: すき焼 (や)き)는 얇게 저민 고기나 채소 등을 얕은 냄비에 굽거나 삶은 요리를 말한다. 양념국물을 넣어 달고 짭짭한 맛을 내는 요리를 스키야키풍(일본어: すき焼 (や)き風 (ふう) 스키야키후[*])이라고 부르기도 하고 규나베(일본어: 牛 (ぎゅう)鍋 (なべ))라고도 한다. 일반적인 스키야끼는 얇게 썬 쇠고기에 파, 양파, 쑥갓, 표고버섯, 팽이버섯, 청경채, 미나리. 두부, 곤약 등의 재료(일본어로 자쿠라고 부름)를 첨가한다. 맛은 간장과 설탕으로 낸다. 날달걀을 묻혀서 먹기도 하며 스키야키의 주재료인 소고기의 두께는 샤부샤부(일본어: しゃぶしゃぶ)보다는 좀 더 두껍다고 할 수 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Sukiyaki_01.jpg/500px-Sukiyaki_01.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=486783","lang":"ko","updated":"2026-10-14T00:41:41.708Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["스키야키"],"category":"수프·국물","ingredients":["쇠고기","소고기","양파","두부","달걀"],"descriptionLength":341,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"JP|샤부샤부","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"샤부샤부","title":"샤부샤부","status":"done","desc":"샤부샤부(일본어: しゃぶしゃぶ, 영어: shabu-shabu)는 얇게 썬 고기와 채소를 물에 데쳐서 찍어 먹는 소스와 함께 내놓는 일본식 나베모노 전골 요리이다. 이 용어는 의성어로, 조리용 냄비에서 재료를 저을 때 나는 소리인 \"살랑살랑\"에서 유래했다. 식사하는 사람이 식탁에서 재료를 하나씩 익혀 먹는다. 샤부샤부는 일반적으로 또 다른 전골 요리인 스키야키보다 감칠맛이 더 강하고 단맛이 적다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Shabu-shabu-01.jpg/500px-Shabu-shabu-01.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=256469","lang":"ko","updated":"2026-10-14T00:41:42.426Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["샤부샤부"],"category":"고기요리","ingredients":["게","채소"],"descriptionLength":222,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"JP|오니기리","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"오니기리","title":"오니기리","status":"done","desc":"오니기리(일본어: おにぎり) 또는 오무스비(おむすび, 영어: onigiri, omusubi, nigirimeshi 또는 rice ball)는 밥에 양념을 하거나 재료를 넣고 삼각형이나 약간 납작한 구 모양으로 빚은 일본의 주먹밥이다. 보통 손바닥 크기 정도로 만든다. 속재료에 따라 다양한 맛을 구현할 수 있으며, 간편하게 식사 할 수 있다. 원래 남은 음식의 저장이나 휴대용 식량으로 만들어졌으나 요즘은 평소에도 즐겨 먹는 음식으로 일본의 편의점이나 슈퍼마켓에서 판매되고 있다. 비슷한 음식이 한국에는 삼각김밥으로 알려져 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Japanese_rice_balls_%28onigiri%29.jpg/500px-Japanese_rice_balls_%28onigiri%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=486774","lang":"ko","updated":"2026-10-14T00:41:43.244Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["오니기리"],"category":"쌀·밥","ingredients":["김","게","밥"],"descriptionLength":296,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"JP|미소시루","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"미소시루","title":"미소시루","status":"done","desc":"미소시루(일본어: 味噌汁)는 일본식 전통 된장국이다.\n미소시루는 요리사나 시루 스타일에 따라 여러 방법으로 조리할 수 있다. 멸치는 내장을 떼어 내고, 다시마는 깨끗이 손질한다. 냄비에 물과 멸치, 다시마를 넣고 끓인다. 끓기 시작하면 다시마는 건져 내고, 국물은 약한 불에서 7-8분 다시 끓인다. 이 때 뚜껑은 덮지 않으며, 거품이 생기면 건져 낸다. 국물에 된장을 풀어 한소금 끓인 후 화학 조미료로 맛을 내고, 사방 0.8cm로 썬 두부를 넣어 한소끔 끓인다. 파를 아주 얇게 송송 썰어 국그릇에 담고, 두부가 끓어 오르면 불을 끄고 그릇에 담는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Miso_Soup_001.jpg/500px-Miso_Soup_001.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=547429","lang":"ko","updated":"2026-10-14T00:41:43.962Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["미소시루"],"category":"수프·국물","ingredients":["두부","게"],"descriptionLength":311,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"JP|스시","countryCode":"JP","country":"일본","flag":"🇯🇵","name":"스시","title":"스시","status":"done","desc":"스시(일본어: 寿司 (すし) 스시[*]) 또는 초밥(醋-)은 일본의 밥 요리이다. 쌀밥에 날생선 등의 해산물이나 달걀 등을 조합한 음식으로, 전통적으로 와사비와 함께 먹는다. 손으로 쥐어 만든 스메시(초를 친 밥)에 생선 등을 얹어 만든 니기리즈시가 대표적이지만, 그 외에도 여러 가지 형태가 있다. 일본의 국민 음식 가운데 하나로 여겨진다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Sushi_platter.jpg/500px-Sushi_platter.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=48727","lang":"ko","updated":"2026-10-14T00:41:44.678Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["스시","Sushi","寿司"],"category":"쌀·밥","ingredients":["쌀","생선","달걀","밥"],"descriptionLength":193,"categoryOriginal":"쌀·밥","extraCategories":["생선·해산물"]},{"id":"US|햄버거","countryCode":"US","country":"미국","flag":"🇺🇸","name":"햄버거","title":"햄버거","status":"done","desc":"햄버거(영어: hamburger), 간단히 버거(영어: burger)는 속 재료(보통 분쇄육, 일반적으로 쇠고기로 만든 패티)를 잘라낸 빵이나 롤빵 안에 넣어 만든다. 패티에는 종종 치즈, 양상추, 토마토, 양파, 피클, 베이컨, 고추 등이 함께 제공되며, 케첩, 머스터드, 마요네즈, 렐리시 또는 \"특별 소스\"(자주 사우전드 아일랜드 드레싱의 변형)와 같은 양념이 곁들여지고, 종종 참깨빵에 담겨 나온다. 치즈를 얹은 햄버거 패티를 치즈버거라고 한다. 일부 정의와 문화권에서는 햄버거를 샌드위치로 간주한다.\n햄버거는 일반적으로 패스트푸드 레스토랑 및 다이너와 관련이 있지만, 고급 식당을 포함한 다른 레스토랑에서도 판매된다. 햄버거에는 여러 국제적 및 지역적 변형이 있다. 가장 큰 다국적 패스트푸드 체인 중 일부는 버거를 핵심 제품 중 하나로 삼고 있다: 맥도날드의 빅맥과 버거킹의 와퍼는 미국 문화의 세계적인 아이콘이 되었다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/RedDot_Burger.jpg/500px-RedDot_Burger.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=332","lang":"ko","updated":"2026-10-14T00:41:45.395Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["햄버거"],"category":"빵·밀가루","ingredients":["쇠고기","토마토","양파","치즈","빵"],"descriptionLength":465,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"US|핫도그","countryCode":"US","country":"미국","flag":"🇺🇸","name":"핫도그","title":"핫도그","status":"done","desc":"핫도그(영어: hot dog, 문화어: 호트도그)는 굽거나 쪄서 익힌 소시지를 전통적인 핫도그빵에 끼워서 먹는 음식이다. 프랑크 소시지나 비엔나 소시지를 주로 사용하며, 종종 소스를 첨가하기도 하는데, 주로 케첩과 겨자 소스, 타르타르 소스 등을 핫도그 위에 뿌려서 먹는다. 대한민국과 뉴질랜드에서는 나무 젓가락에 소시지를 끼워서 튀겨낸 콘도그를 편의상 핫도그라고 부른다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Hot_dog_with_mustard.png/500px-Hot_dog_with_mustard.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=84720","lang":"ko","updated":"2026-10-14T00:41:46.112Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["핫도그"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":208,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"US|바비큐","countryCode":"US","country":"미국","flag":"🇺🇸","name":"바비큐","title":"바비큐","status":"done","desc":"바비큐(barbecue)는 고기를 통째로 구운 요리로 시작해, 야외에서 육류나 각종 야채, 과채를 굽는 음식으로 발전하는 과정을 거쳐, 지금은 야외나 실내에서 불을 피워 고기나 생선, 채소, 과일 등 모든 굽는 행위나 음식을 일컫는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/Barbecued_meats.jpg/500px-Barbecued_meats.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=294660","lang":"ko","updated":"2026-10-14T00:41:46.829Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["바비큐"],"category":"고기요리","ingredients":["생선","채소"],"descriptionLength":131,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"US|프라이드치킨","countryCode":"US","country":"미국","flag":"🇺🇸","name":"프라이드치킨","title":"프라이드 치킨","status":"done","desc":"프라이드 치킨(영어: fried chicken) 또는 서던 프라이드 치킨(영어: Southern fried chicken)은 미국 남부의 닭튀김 요리이다. 대한민국에서는 한국식 치킨과 마찬가지로 후라이드 치킨으로 불리기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Fried-Chicken-Set.jpg/500px-Fried-Chicken-Set.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=513760","lang":"ko","updated":"2026-10-14T00:41:47.546Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["프라이드치킨","프라이드 치킨"],"category":"고기요리","ingredients":["김","치킨"],"descriptionLength":127,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"US|애플파이","countryCode":"US","country":"미국","flag":"🇺🇸","name":"애플파이","title":"사과 파이","status":"done","desc":"애플파이는 사과에 설탕과 향신료를 더한 속을 파이 반죽에 넣어 구운 디저트입니다. 미국에서 특히 친숙한 가정식 디저트입니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Apple_pie.jpg/500px-Apple_pie.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=174583","lang":"ko","updated":"2026-10-14T00:41:48.667Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["애플파이","사과 파이","Apple pie"],"category":"디저트·과자","ingredients":["사과","밀가루","설탕","계피"],"descriptionLength":69,"categoryOriginal":"디저트","extraCategories":[]},{"id":"US|클램차우더","countryCode":"US","country":"미국","flag":"🇺🇸","name":"클램차우더","title":"클램 차우더","status":"done","desc":"클램 차우더(영어: Clam chowder)는 대합이나 가리비를 넣은 미국의 수프로, 대표적으로 맨해튼 클램 차우더와 뉴잉글랜드 클램 차우더가 있다. 맨해튼 클램 차우더는 대합이나 가리비, 소금에 절인 돼지고기, 토마토, 여러 채소를 푹 끓인 수프의 일종이다. 뉴잉글랜드 클램 차우더는 감자와 양파 등의 채소와 크림과 루가 들어간 크림 수프이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/Quail_07_bg_041506.jpg/500px-Quail_07_bg_041506.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=524303","lang":"ko","updated":"2026-10-14T00:41:49.387Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["클램차우더","클램 차우더"],"category":"수프·국물","ingredients":["돼지고기","감자","토마토","양파","채소"],"descriptionLength":193,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"US|버펄로윙","countryCode":"US","country":"미국","flag":"🇺🇸","name":"버펄로윙","title":"버펄로 윙","status":"done","desc":"버펄로 윙 (Buffalo wing)은 소스를 입혀서 튀겨낸 닭 날개 음식이다. 다양한 종류의 소스가 사용되지만, 기본적인 버펄로 소스는 카옌고추 핫소스와 버터를 사용한다. 식초와 고추 소스를 사용한 핫소스를 이용할 때에는 오직 핫소스와 녹인 버터만을 이용한다. 보기와는 달리 대부분의 버펄로 윙은 튀김옷을 입히지 않는다. 버펄로 윙은 이것이 처음 만들어진 곳인 미국 뉴욕주의 도시인 버펄로의 이름을 딴 것이며, '버펄로'라는 명칭은 현재 소스를 입힌 다른 닭 날개 요리와 유사한 종류의 요리에 적용되고 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Buffalo_-_Wings_at_Airport_Anchor_Bar.jpg/500px-Buffalo_-_Wings_at_Airport_Anchor_Bar.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=121713","lang":"ko","updated":"2026-10-14T00:41:50.106Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["버펄로윙","버펄로 윙"],"category":"고기요리","ingredients":["김","버터"],"descriptionLength":285,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"US|마카로니 앤 치즈","countryCode":"US","country":"미국","flag":"🇺🇸","name":"마카로니 앤 치즈","title":"마카로니 앤드 치즈","status":"done","desc":"마카로니 앤 치즈는 짧은 마카로니 면에 치즈 소스를 버무려 만드는 음식입니다. 미국에서 널리 즐겨 먹으며 오븐에 구워 윗면을 노릇하게 만들기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Original_Mac_n_Cheese_.jpg/500px-Original_Mac_n_Cheese_.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=758227","lang":"ko","updated":"2026-10-14T00:41:51.027Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["마카로니 앤 치즈","마카로니 앤드 치즈"],"category":"국수·면","ingredients":["마카로니","치즈","우유"],"descriptionLength":84,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"US|팬케이크","countryCode":"US","country":"미국","flag":"🇺🇸","name":"팬케이크","title":"팬케이크","status":"done","desc":"팬케이크(pancake)는 납작한 빵의 일종으로, 달게 만든 반죽물을 뜨거운 석쇠 위나 프라이팬으로 구워 만든다. 팬케이크는 수많은 지역 요리에 따라 다양한 형태의 변형이 있다. 일부 팬케이크는 이스트로 팽창을 촉진시키거나, 발효한 반죽물을 이용해서 만들지만, 거의 대부분의 팬케이크는 금방 만들 수 있는 빵이다.\n와플은 팬케이크에 비해 달걀이 더 많이 들어가며, 전용팬인 와플팬으로 굽는다. 또한 시럽을 끼얹는다는 점에서도 팬케이크는 와플과 차이가 있다. 브레통 갈레트를 제외하고 대부분의 팬케이크는 조리과정에서 한 번에 한 면을 구운 뒤, 뒤집어서 조리한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Blueberry_pancakes_%283%29.jpg/500px-Blueberry_pancakes_%283%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=145434","lang":"ko","updated":"2026-10-14T00:41:51.743Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["팬케이크"],"category":"디저트·과자","ingredients":["달걀","게","빵"],"descriptionLength":314,"categoryOriginal":"디저트","extraCategories":[]},{"id":"US|뉴욕 스타일 피자","countryCode":"US","country":"미국","flag":"🇺🇸","name":"뉴욕 스타일 피자","title":"디트로이트식 피자","status":"candidate","desc":"디트로이트식 피자, 디트로이트 피자, 디트로이트 스타일 피자(Detroit-style pizza)는 두껍고 바삭하며 쫄깃한 크러스트를 가진 직사각형 팬 피자이다. 전통적으로 모차렐라 또는 위스콘신 브릭 치즈를 가장자리까지 얹는데, 이는 높이가 있는 무거운 직사각형 팬에 구워지면서 캐러멜화된다. 디트로이트 스타일 피자는 원래 자동차 드립 팬으로 사용하거나 공장에서 작은 산업 부품을 담는 용도로 설계된 직사각형 강철 트레이에 구워졌다. 이 피자는 20세기 중반 미시간주 디트로이트에서 개발되었으며, 2010년대에 미국 다른 지역으로 확산되었다. 디트로이트의 가장 유명한 향토 음식 중 하나이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/Detroit_Style_Pizza_in_Lloyds_Detroit_Style_Pan.png/500px-Detroit_Style_Pizza_in_Lloyds_Detroit_Style_Pan.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4089840","lang":"ko","updated":"2026-10-14T00:41:52.460Z","verification":"","risk":"차단 권고","reasons":["기존 보고서의 오검색/상위 개념","등록 이름·별칭과 검색 제목 불일치"],"aliases":["뉴욕 스타일 피자","디트로이트식 피자","New York-style pizza","New York style pizza"],"category":"빵·밀가루","ingredients":["치즈"],"descriptionLength":332,"categoryOriginal":"디저트","extraCategories":[]},{"id":"US|콘브레드","countryCode":"US","country":"미국","flag":"🇺🇸","name":"콘브레드","title":"콘브레드","status":"done","desc":"콘브레드는 옥수수가루를 주재료로 하여 굽는 미국의 빵입니다. 약간 포슬포슬한 식감이 특징이며 수프나 고기 요리와 곁들여 먹습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Skillet_cornbread_%28cropped%29.jpg/500px-Skillet_cornbread_%28cropped%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1230193","lang":"ko","updated":"2026-10-14T00:41:53.177Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["콘브레드"],"category":"빵·밀가루","ingredients":["옥수수가루","밀가루","우유"],"descriptionLength":72,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"KR|김치","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"김치","title":"김치","status":"done","desc":"김치는 한국의 전통 발효식품이다. 소금에 절인 배추나, 무 등을 고춧가루, 파, 마늘 등의 양념에 버무린 뒤 발효시켜 만든다. 한국의 국민 음식 가운데 하나로 여겨진다. 한국식 식사에서 빠지지 않는 부식이며, 지방에 따라 재료와 조리 방법가에 따라 많은 종류가 있다. 다양한 한국 요리에 식재료로 사용되기도 한다. 김치는 올림픽, 아시안 게임, FIFA 월드컵 공식 지정 식품이기도 하다.\n겨울내 먹기 위하여 김치를 한꺼번에 많이 담그는 것은 김장이라 하며, 그렇게 담근 김장 김치는 겨울에 얼지 않고 더운 여름에는 시원하게 유지하기 위해 옹기라 불리는 큰 토기 발효 용기에 땅속에 보관했다. 또한 야외에 장독대라고 불리는 용기에 보관된다. 현대에는 가정용 김치냉장고가 더 많이 사용된다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Various_kimchi.jpg/500px-Various_kimchi.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=436065","lang":"ko","updated":"2026-10-14T00:41:53.894Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["김치"],"category":"채소·샐러드","ingredients":["김","게","김치","마늘"],"descriptionLength":385,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KR|비빔밥","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"비빔밥","title":"비빔밥","status":"done","desc":"비빔은 한국의 밥 요리이다. 쌀밥에 고기나 나물 등과 여러 가지의 양념을 넣어 비벼 먹는 음식이며, 비빔밥이나 제삿밥, 골동반(骨董飯), 교반(攪飯)으로도 부른다. 과거 궁중에서는 비빔이라 불렀다. 대한민국의 국민 음식 가운데 하나로 여겨진다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Dolsot-bibimbap.jpg/500px-Dolsot-bibimbap.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=22697","lang":"ko","updated":"2026-10-14T00:41:54.610Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["비빔밥"],"category":"쌀·밥","ingredients":["쌀","밥"],"descriptionLength":138,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"KR|불고기","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"불고기","title":"불고기","status":"done","desc":"불고기는 얇게 썬 고기를 간장 등으로 양념해 굽거나 볶아 먹는 한국 음식입니다. 달콤하고 짭짤한 맛이 특징이며 밥과 함께 먹습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/Bulgogi_2.jpg/500px-Bulgogi_2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=7761","lang":"ko","updated":"2026-10-14T00:41:55.327Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["불고기"],"category":"고기요리","ingredients":["쇠고기","간장","마늘"],"descriptionLength":73,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KR|잡채","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"잡채","title":"잡채","status":"done","desc":"잡채(雜菜)는 고기, 버섯, 채소 등의 재료를 볶은 것에 삶은 당면을 넣고 버무린 음식이다. 일반적으로 고구마 녹말로 만든 당면을 끓는 물에 삶고 물기를 뺀 뒤, 참기름에 가늘게 채를 친 쇠고기와 당근, 시금치, 버섯, 양파 등 다양한 채소와 함께 볶은 후 간장으로 풍미를 낸 한국 음식을 말한다. 잡채는 흔히 참깨를 위에 뿌려 장식한다.\n잡채를 주요리로 주문할 때도 있지만, 한국 요리에서 주로 반찬처럼 부요리로 먹는다. 또한 밥에 덮밥처럼 먹는 경우는 잡채밥이라 부르며, 이 때 짜장소스를 곁들이기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Polish_Korean_Cuisine_and_Culture_Exchanges_Gradmother%E2%80%99s_Recipes_05.jpg/500px-Polish_Korean_Cuisine_and_Culture_Exchanges_Gradmother%E2%80%99s_Recipes_05.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=8575","lang":"ko","updated":"2026-10-14T00:41:56.045Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["잡채"],"category":"국수·면","ingredients":["쇠고기","양파","게","채소","밥"],"descriptionLength":285,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"KR|떡볶이","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"떡볶이","title":"떡볶이","status":"done","desc":"떡볶이는 떡면(가는 가래떡)을 주재료로 하는 한국 전통요리이다. 일반적인 떡볶이는 밀떡, 쌀떡, 어묵, 채소, 고추장 등의 양념을 넣어 볶은 음식으로 한국의 대표적 길거리 음식이다. 고추장과 간장을 기본으로 양념할 수 있는데 전자가 가장 대표적인 형태다.\n일반적으로 분식점과 노점상에서 많이 판매하며 보통 떡볶이와 함께 다른 음식을 곁들여 먹는 경우가 흔하다. 일반적으로 튀김류에 떡볶이 양념을 묻혀 먹기도 하며, 김밥과 순대와 곁들이기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Tteokbokki.JPG/500px-Tteokbokki.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2359","lang":"ko","updated":"2026-10-14T00:41:56.762Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["떡볶이"],"category":"떡·간식","ingredients":["쌀","김","고추장","채소","밥"],"descriptionLength":249,"categoryOriginal":"디저트","extraCategories":[]},{"id":"KR|삼계탕","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"삼계탕","title":"삼계탕","status":"done","desc":"삼계탕(蔘鷄湯, 문화어: 인삼닭탕)은 한국 요리 중 하나로 닭 한 마리를 반 잘라서 인삼, 대추, 생강, 마늘 등의 재료와 함께 고아 만든다. 한국에서는 주로 삼복(초복, 중복, 말복)날에 먹는다. 삼계탕은 여름철의 대표적인 보양음식이다. 한편, 삼계탕은 계삼탕이라고도 한다. 그리고 병아리보다 조금 큰 닭을 사용한 것은 영계백숙, 반토막을 내어 넣은 것을 반계탕이라고 부른다. 백숙과 매우 비슷하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Samgye-tang_2.jpg/500px-Samgye-tang_2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=66550","lang":"ko","updated":"2026-10-14T00:41:57.479Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["삼계탕"],"category":"수프·국물","ingredients":["마늘"],"descriptionLength":224,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KR|냉면","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"냉면","title":"냉면","status":"done","desc":"냉면은 차가운 육수에 면을 담거나 매콤한 양념에 비벼 먹는 한국의 면 요리입니다. 메밀이나 전분으로 만든 면을 사용하고 오이와 달걀 등을 올리기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/92/Dongmu_Bapsang_02.jpg/500px-Dongmu_Bapsang_02.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=65655","lang":"ko","updated":"2026-10-14T00:41:58.196Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["냉면"],"category":"국수·면","ingredients":["면","육수","오이"],"descriptionLength":86,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"KR|김밥","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"김밥","title":"김밥","status":"done","desc":"김밥은 소금과 참기름으로 맛을 낸 밥을 시금치, 단무지, 당근, 달걀, 우엉, 햄, 맛살, 어묵등 속재료를 넣고 김으로 말아서 한입 크기로 썰어 낸 한국의 음식이다. 주먹밥처럼 이동할 때나 빠르게 먹기가 편하여 소풍이나 여행, 이동할 때 즐겨 먹는다. 소금이 없어도 참기름으로 맛을 낼 수 있지만 소금이 들어가면 맛이 풍부해진다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Gimbap_%28pixabay%29.jpg/500px-Gimbap_%28pixabay%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=64502","lang":"ko","updated":"2026-10-14T00:41:58.912Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["김밥"],"category":"쌀·밥","ingredients":["김","달걀","게","밥"],"descriptionLength":186,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"KR|된장찌개","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"된장찌개","title":"된장찌개","status":"done","desc":"된장찌개는 끓는 육수에 된장을 풀고 육류나 어패류, 채소, 두부, 버섯 등을 비롯한 각종 재료를 넣어 끓인 찌개의 한 종류이다. 된장국과도 비슷하며, 육류와 어패류를 된장찌개에 함께 넣는 경우도 있다. 계절에 따라 다른 재료를 곁들이기도 한다. 토장찌개라고도 한다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Doenjang_jjigae.jpg/500px-Doenjang_jjigae.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=156479","lang":"ko","updated":"2026-10-14T00:41:59.628Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["된장찌개"],"category":"수프·국물","ingredients":["두부","채소"],"descriptionLength":150,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KR|떡국","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"떡국","title":"떡국","status":"done","desc":"떡국은 한국의 전통 음식이다. 장국에 일정한 두께로 얇게 썬 흰떡을 넣고 끓여 만든 음식이며, 고기와 달걀 등을 고명으로 얹거나 만두를 넣어 떡만둣국으로 먹기도 한다. 설날에 먹는 대표적인 명절 음식이자 정월 시식이다. 현대에는 양력 새해 첫날에 먹기도 한다.\n떡국은 지방에 따라 다양한 형태로 전해진다. 예를 들어 개성에서는 조랭이떡국이라 하여, 조선 초기에 이성계의 목을 자르고 싶다는 뜻을 담아 만들었다는 설이 있다. 이후 임진왜란 직후에는 그 대상이 도요토미 히데요시로 바뀌어 재해석되었다는 이야기도 전한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Tteokguk.jpg/500px-Tteokguk.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=169375","lang":"ko","updated":"2026-10-14T00:42:00.346Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["떡국"],"category":"수프·국물","ingredients":["달걀","게"],"descriptionLength":288,"categoryOriginal":"디저트","extraCategories":[]},{"id":"KR|송편","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"송편","title":"송편","status":"done","desc":"송편(松䭏)은 한국 떡의 한 종류로 한국의 명절 추석을 대표하는 전통음식이다. 추석 때 햇곡식으로 빚는 명절떡이다.\n멥쌀가루를 익반죽하여 알맞은 크기로 떼어 거기에 깨·팥·콩·녹두·밤 등의 소를 넣고 반달이나 조개 모양으로 빚어 솔잎을 깔고 찐 떡이다.\n음력 팔월 15일 추석에는 햅쌀로 만든 송편으로 조상께 차례를 지낸다.\n『동국세시기』에 따르면 송편은 정월 보름날 농가에서 만들었다는 기록이 나온다. 농가에서는 풍년을 기원하는 의미로 집집마다 장대에 곡식 이삭을 매달아 대문간에 세워뒀다가 중화절(中和節: 2월 1일)에 이것으로 송편을 만들어 노비에게 나이수대로 나눠준 풍속이 있었다고 전해진다. 그래서 이 때 송편은 나이떡이라고도 불렸다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Chuseok_Songpyeon.jpg/500px-Chuseok_Songpyeon.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=7069","lang":"ko","updated":"2026-10-14T00:42:01.059Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["송편"],"category":"디저트·과자","ingredients":["쌀","콩","게"],"descriptionLength":362,"categoryOriginal":"디저트","extraCategories":[]},{"id":"KR|전","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"전","title":"전 (음식)","status":"done","desc":"전(煎, 영어: jeon)은 생선이나 고기, 채소 등을 얇게 썰거나 다지고 양념을 한 후, 밀가루와 달걀물을 씌워 기름에 지진 음식이다. 전유(煎油)라고도 부르며, 부침개와 달리 재료의 형태를 최대한 유지한다. 굴전·새우전·버섯전·고추전·호박전 등이 대표적이다. 조선왕조 궁중음식에서는 얇게 저민 고기나 생선 따위에 밀가루를 묻히고 달걀 푼 것을 씌워 기름에 지진 음식을 저냐로 부르는데, 전유어(煎油魚)와 전유화(煎油花)의 와음이다. 제사에 쓰는 저냐는 간납(干納, 肝納)이라 부르며, 소의 간이나 처녑 또는 생선 살 따위로 만든다.\n전은 보통 전채, 반찬, 안주로 먹는다. 화전 등은 후식으로 먹기도 한다.","image":"https://upload.wikimedia.org/wikipedia/commons/b/b2/KOCIS_Korean_meal_table_%284553953910%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=211380","lang":"ko","updated":"2026-10-14T00:42:03.111Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["전","전 (음식)","Jeon Korean pancake"],"category":"튀김·간식","ingredients":["생선","새우","밀가루","달걀","게"],"descriptionLength":341,"categoryOriginal":"고기요리","extraCategories":["채소·샐러드"]},{"id":"KR|떡","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"떡","title":"떡","status":"done","desc":"떡은 주로 멥쌀이나 찹쌀, 또는 다른 곡식을 쪄서 찧거나 가루 내어 쪄서 빚어 만든 음식을 통칭하는 말이다. 일반적으로는 쌀을 주재료로 사용하지만 감자 녹말이나 기타 곡물을 이용하기도 하고, 맛과 모양을 더하기 위해서 다양한 종류의 부재료들이 추가되기도 한다. 곡식가루를 시루에 안쳐 찌거나, 쪄서 치거나, 물에 삶거나, 혹은 기름에 지져서 굽거나, 빚어서 찌는 등 다양한 방법으로 조리된다.\n동남아시아와 동북아시아를 중심으로 쌀을 주식으로 먹는 지역에서 발달하였다. 한국에서는 명절이나 관혼상제 같은 잔치나 축제 행사에서 떡을 많이 짓고 나누어 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/Tteok.jpg/500px-Tteok.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=80326","lang":"ko","updated":"2026-10-14T00:42:03.823Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["떡","Tteok","Korean rice cake"],"category":"떡·간식","ingredients":["쌀","감자"],"descriptionLength":310,"categoryOriginal":"디저트","extraCategories":[]},{"id":"KR|호떡","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"호떡","title":"호떡","status":"done","desc":"호떡은 밀가루 반죽 안에 설탕과 견과류 등을 넣고 납작하게 눌러 구운 한국의 간식입니다. 겨울철 길거리에서도 자주 만날 수 있습니다.","image":"https://thumb.wikimedia.org/wikipedia/ko/thumb/6/6b/%EC%A4%91%EA%B5%AD%EC%8B%9D_%ED%98%B8%EB%96%A1.JPG/500px-%EC%A4%91%EA%B5%AD%EC%8B%9D_%ED%98%B8%EB%96%A1.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=220411","lang":"ko","updated":"2026-10-14T00:42:04.544Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["호떡"],"category":"디저트·과자","ingredients":["밀가루","설탕","견과류"],"descriptionLength":74,"categoryOriginal":"디저트","extraCategories":[]},{"id":"KR|고추장","countryCode":"KR","country":"대한민국","flag":"🇰🇷","name":"고추장","title":"고추장","status":"done","desc":"고추장(苦椒醬)은 고춧가루를 주원료로 하여 찹쌀과 메주 등을 섞어 만드는 한국의 전통음식이다. 된장·간장과 함께 한국의 대표적인 전통 양념 중 하나로, 한국 요리에서 고추장의 쓰임새는 매우 다양하다. 담글 때 마늘, 무, 더덕, 도라지, 매실 등을 박아 넣어 장아찌를 만들기도 한다. 고추장은 섬진강에 인접한 전북특별자치도 순창군이 유명하다. 이밖에 원주시 정지뜰 지역 등에 토속적인 고추장이 있다.","image":"https://upload.wikimedia.org/wikipedia/commons/c/cb/Korean_chili_pepper_paste_GOCHUJANG.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=207813","lang":"ko","updated":"2026-10-14T00:42:05.261Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["고추장","Gochujang"],"category":"음료·소스","ingredients":["쌀","고추장","마늘"],"descriptionLength":223,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"IN|비리야니","countryCode":"IN","country":"인도","flag":"🇮🇳","name":"비리야니","title":"비리야니","status":"done","desc":"비리야니(힌디어: बिरयानी, 우르두어: بریانی)는 남아시아의 쌀 요리이다. 일반적으로 닭고기, 쇠고기, 염소고기, 양고기 등의 육류 또는 새우, 생선 등의 해산물과 달걀을 넣어 만들며, 각종 향신료와 채소가 들어간다. 남아시아 무슬림 음식에 그 기원을 두며, 인도와 파키스탄의 국민 음식 가운데 하나이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/%22Hyderabadi_Dum_Biryani%22.jpg/500px-%22Hyderabadi_Dum_Biryani%22.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1814982","lang":"ko","updated":"2026-10-14T00:42:06.284Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["비리야니"],"category":"쌀·밥","ingredients":["쌀","생선","쇠고기","소고기","닭고기"],"descriptionLength":176,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"IN|난","countryCode":"IN","country":"인도","flag":"🇮🇳","name":"난","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=430481","lang":"ko","updated":"2026-10-14T00:42:07.206Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 난(卵·亂·蘭 등)의 동음이의어 문서입니다."],"aliases":["난"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":0,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"IN|탄두리 치킨","countryCode":"IN","country":"인도","flag":"🇮🇳","name":"탄두리 치킨","title":"탄두리 치킨","status":"done","desc":"탄두리 치킨(펀자브어: ਤੰਦੂਰੀ ਚਿਕਨ 탄두리 치칸)은 남아시아의 닭고기 요리이다. 대표적인 펀자브 요리로, 인도와 파키스탄 모두에서 즐겨 먹는다. 다히와 각종 향신료와 발효유에 재운 닭고기를 쇠꼬챙이에 꽂아 탄두르에 향기롭게 굽는 요리로, 카슈미르고추가루를 사용한 양념에서 나오는 불타는 듯한 빨간색이 특징이다. 난이나 차파티에 싸서 주 요리로 먹는 것이 전통적이며, 무르그 마카니와 같이 크림으로 만든 커리에 들어가는 재료로도 많이 쓰인다. 남아시아, 말레이시아, 싱가포르, 인도네시아, 중동, 서양에 널리 알려졌으며, 인도의 국민 음식 가운데 하나로 여겨진다.","image":"https://upload.wikimedia.org/wikipedia/commons/e/e1/Chickentandoori.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=779310","lang":"ko","updated":"2026-10-14T00:42:08.128Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["탄두리 치킨"],"category":"고기요리","ingredients":["닭고기","치킨","게"],"descriptionLength":319,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"IN|도사","countryCode":"IN","country":"인도","flag":"🇮🇳","name":"도사","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=283499","lang":"ko","updated":"2026-10-14T00:42:09.664Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 인도 음식이 아닌 도교의 도사에 관한 내용입니다."],"aliases":["도사"],"category":"빵·밀가루","ingredients":["게"],"descriptionLength":0,"categoryOriginal":"해산물","extraCategories":[]},{"id":"IN|사모사","countryCode":"IN","country":"인도","flag":"🇮🇳","name":"사모사","title":"사모사","status":"done","desc":"사모사란 감자와 채소, 커리 등을 넣은 삼각형 모양의 튀김을 말한다. 주로 인도나 네팔에서 흔히 볼 수 있으며 간식으로 많이 먹는 대중적인 음식이다. 방글라데시와 파키스탄 등에서도 볼 수 있는 요리이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Chamu%C3%A7as.jpg/500px-Chamu%C3%A7as.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=160773","lang":"ko","updated":"2026-10-14T00:42:10.381Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["사모사"],"category":"튀김·간식","ingredients":["김","감자","채소"],"descriptionLength":117,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"IN|달","countryCode":"IN","country":"인도","flag":"🇮🇳","name":"달","title":"달","status":"candidate","desc":"달은 지구의 유일한 자연위성이고, 태양계의 위성 중에서 5번째로 크다. 행성의 크기와 비교하여, 자연위성 중에서 가장 크다. 지구 중심부터 달 중심까지 거리는 평균 38만 4400km로, 지구 30개가 들어가는 거리이다. 이 거리면 태양계 모든 행성을 그 사이에 줄 세우고도 조금 남는다. 지구에서 태양까지 거리(1AU)의 1/389 보다 작다. 달 지름은 지구의 약 4분의 1, 태양의 약 400분의 1인 3,476 km이다. 달의 부피는 지구의 약 1/50 정도이며, 표면 중력은 지구의 약 17%이다. 달은 지구를 약 27.3일에 일주하며(공전 주기), 지구-달-태양의 위치 변화는 29.5일을 주기로 달라지는 달의 상을 만든다.(삭망 주기)\n지구에서 가장 가까운 천체인 만큼, 달은 현재까지 인류가 직접 탐험한 유일한 외계이다. 1969년, 인류가 만든 최초 무인 우주선이 달로 보내기 시작하여, 1972년까지 6차례 직접 달을 탐사했다. 이후 달 탐사는 중단했으나, 2000년대에 들어, 달 탐사를 재개하였다. 2020년까지 우주인을 보내는 탐사를 계획했다.\n또한, 인도에서 발사한 달 탐사선 찬드라얀 1호가 2009년 9월 26일 달에 있는 물을 발견하였다. 오래 전 소행성이 달과 충돌하여 카모오알레바가 생겼다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Full_Moon_Luc_Viatour.jpg/500px-Full_Moon_Luc_Viatour.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=72789","lang":"ko","updated":"2026-10-14T00:42:11.096Z","verification":"","risk":"일치 후보","reasons":[],"aliases":["달"],"category":"콩·유제품","ingredients":[],"descriptionLength":631,"categoryOriginal":"대표음식","extraCategories":["수프·국물"]},{"id":"IN|팔락 파니르","countryCode":"IN","country":"인도","flag":"🇮🇳","name":"팔락 파니르","title":"팔락 파니르","status":"done","desc":"팔락 파니르는 시금치를 갈아 만든 초록색 ,"updated":"2026-10-14T00:42:13.962Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 차이의 여러 뜻을 나열한 동음이의어 문서입니다."],"aliases":["차이"],"category":"음료·소스","ingredients":[],"descriptionLength":0,"categoryOriginal":"음료·소스","extraCategories":[]},{"id":"IN|커리","countryCode":"IN","country":"인도","flag":"🇮🇳","name":"커리","title":"커리","status":"done","desc":"커리(영어: curry) 또는 카리(타밀어: கறி)는 강황을 비롯한 여러 향신료들을 넣어 만든 배합 향신료인 마살라를 사용해 채소나 고기 등으로 맛을 낸 인도 요리이다. 인더스 문명 시기부터 먹었을 정도로 역사가 깊은 음식으로, 일본에서는 메이지 시대에 영국을 거쳐 전해진 커리가 일본 카레로 자리 잡으면서 국민식으로 불릴 정도의 인기를 가지게 되었고 일제강점기 때 일본 카레가 한국으로도 전파되었다. 한국, 일본 등에서는 쌀밥과 함께 카레라이스로 먹는 경우가 많다. 문어 토핑이 추가된 커리는 세이셸의 국민 음식으로 여겨진다.","image":"https://upload.wikimedia.org/wikipedia/commons/6/69/Curry_-_Indian_cuisine.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=242332","lang":"ko","updated":"2026-10-14T00:42:14.682Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["커리"],"category":"수프·국물","ingredients":["쌀","문어","게","채소","카레"],"descriptionLength":296,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"TH|팟타이","countryCode":"TH","country":"태국","flag":"🇹🇭","name":"팟타이","title":"팟 타이","status":"done","desc":"팟 타이(태국어: ผัดไทย)는 태국의 국수 요리이다. 쌀국수를 사용한 새콤, 달콤, 짭조름한 볶음국수로, 대표적인 길거리 음식이다. 태국의 국민 음식 가운데 하나이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Phat_Thai_kung_Chang_Khien_street_stall.jpg/500px-Phat_Thai_kung_Chang_Khien_street_stall.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=639859","lang":"ko","updated":"2026-10-14T00:42:15.296Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["팟타이","팟 타이"],"category":"국수·면","ingredients":["쌀","국수"],"descriptionLength":99,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"TH|똠얌꿍","countryCode":"TH","country":"태국","flag":"🇹🇭","name":"똠얌꿍","title":"똠 얌 꿍","status":"done","desc":"똠얌꿍은 새우에 레몬그라스, 라 ons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["그린 커리"],"category":"수프·국물","ingredients":["코코넛 밀크","풋고추","향신료"],"descriptionLength":80,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"TH|카오팟","countryCode":"TH","country":"태국","flag":"🇹🇭","name":"카오팟","title":"카오 팟","status":"done","desc":"카오 팟(태국어: ข้าวผัด, khao phat)은 태국식 볶음밥이다. '카우'(태국어: ข้าว)는 '쌀'을 의미하고 '팟'(태국어: ผัด)은 '볶는다'를 의미한다.\n태국요리에는 카오팟 무쌉은 없습니다\n퓨전화되었다고 보시면 되십니다.\n일부 식당에서 마치 태국요리인것처럼 판매하지만 오리지널이  아닙니다.\n기본적으로 밥과 함께 고기와 달걀, 남 쁠라(어장)와 간장으로 간을 하여 만든다.\n들어가는 부가적 재료에 따라 여러 가지 종류가 있다. 명칭은 보통 '카오 팟'+'부가재료'로 부여된다.\n\n카오 팟 마쁘라오 (태국어: ข้าวผัดมะพร้าว, Khao phat maphrao) : (코코넛)\n카오 팟 쌉빠롯 (태국어: ข้าวผัดสับปะรด, Khao phat sapparot) : (파인애플)\n카오 팟 끄라파오 (태국어: ข้าวผัดกระเพรา, Khao phat kraphao) : (바질)\n카오 팟 무 (Khao phat mu) : (돼지고기)\n카오 팟 까이 (태국어: ข้าวผัดไก่, Khao phat kai) : (닭고기)\n카오 팟 꿍 (Khao phat kung) : (새우)\n카오 팟 뿌  (태국어: ข้าวผัดปู, Khao phat pu) : (게)\n카오 팟 카이 (태국어: ข้าวผัดไข่, Khao phat khai) : (달걀)\n카오 팟 체 (Khao phat che) : (채소)\n카오 팟 아메리깐(ข้าวผัดอเมริกัน)","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Thaifriedrice.jpg/500px-Thaifriedrice.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1032962","lang":"ko","updated":"2026-10-14T00:42:18.163Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["카오팟","카오 팟"],"category":"쌀·밥","ingredients":["쌀","돼지고기","닭고기","새우","달걀"],"descriptionLength":717,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"TH|카오소이","countryCode":"TH","country":"태국","flag":"🇹🇭","name":"카오소이","title":"카오 소이","status":"done","desc":"카오 소이(샨어: ၶဝ်ႈသွႆး)는 동남아시아 태국, 라오스, 미얀마에서 먹는 국수 요리이다. 원래는 손으로 썬 쌀국수 요리만을 가리켰는데, 태국과 미얀마 등지에서는 \"코코넛밀크가 들어간 커리 국수\"를 가리키기도 한다. 미얀마 샨주와 라오스 북부에서는 여전히 맑은 국물의 쌀국수 요리를 가리킨다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Khao_soi_nuea_Fueng_Fah.jpg/500px-Khao_soi_nuea_Fueng_Fah.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4065991","lang":"ko","updated":"2026-10-14T00:42:18.880Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["카오소이","카오 소이"],"category":"국수·면","ingredients":["쌀","코코넛","국수"],"descriptionLength":166,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"TH|똠카가이","countryCode":"TH","country":"태국","flag":"🇹🇭","name":"똠카가이","title":"Tom kha kai","status":"done","desc":"Tom kha kai, tom kha gai, or Thai coconut soup (Thai: ต้มข่าไก่, pronounced [tôm kʰàː kàj]; lit. 'chicken galangal soup') is a spicy and sour hot soup with coconut milk in Thai cuisine.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Flickr_preppybyday_4711943668--Tom_kha_gai.jpg/500px-Flickr_preppybyday_4711943668--Tom_kha_gai.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://en.wikipedia.org/?curid=404895","lang":"en","updated":"2026-10-14T00:42:20.826Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["똠카가이","Tom kha kai","Tom kha gai","ต้มข่าไก่"],"category":"수프·국물","ingredients":[],"descriptionLength":185,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"TH|망고 찹쌀밥","countryCode":"TH","country":"태국","flag":"🇹🇭","name":"망고 찹쌀밥","title":"망고","status":"candidate","desc":"망고(영어: mango 맹고[*])는 망고 (학명: Mangifera indica) 열대 나무에서 생산되는 식용 핵과이다. 미얀마 북서부, 방글라데시, 인도 북동부 사이의 지역에서 유래했다. 망고는 고대부터 남아시아와 동남아시아에서 재배되어 왔으며, 그 결과 현대에는 \"인도 유형\"과 \"동남아시아 유형\"이라는 두 가지 망고 재배 품종이 생겨났다. 망고속의 다른 종들도 \"망고\"라고 불리는 식용 과일을 생산하며, 이들 대부분은 말레이시아 생태구에서 발견된다.\n전 세계적으로 수백 가지의 망고 재배 품종이 존재한다. 재배 품종에 따라 망고 열매는 크기, 모양, 단맛, 껍질 색깔, 과육 색깔이 다양하며, 과육은 연노랑, 금색, 녹색 또는 주황색일 수 있다. 망고는 인도, 파키스탄, 필리핀의 국가 과일이며, 망고나무는 방글라데시의 국목이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Starr_080417-4175_Mangifera_indica.jpg/500px-Starr_080417-4175_Mangifera_indica.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":" "반미는 다음 등을 가리킨다.\n\n반미(反美): 미국을 반대·혐오하는 것을 가리킴\n반미(潘美, 925~991): 북송의 장수\n바인 미(bánh mì): 베트남의 빵, 또는 그 빵으로 만든 샌드위치를 달리 부르는 말","image":"","url":"https://ko.wikipedia.org/?curid=410825","lang":"ko","updated":"2026-10-14T00:42:23.899Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["반미"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":117,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"VN|분짜","countryCode":"VN","country":"베트남","flag":"🇻🇳","name":"분짜","title":"분 짜","status":"done","desc":"분 짜(베트남어: bún chả)는 쌀국수 분과 숯불에 구운 돼지고기, 그리고 고수 잎, 소엽풀, 타이바질, 향유 등 허브와 숙주나물 등 채소를 느억 쩜 소스에 찍어 먹는 음식이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Bun_cha.jpg/500px-Bun_cha.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=873264","lang":"ko","updated":"2026-10-14T00:42:24.615Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["분짜","분 짜"],"category":"국수·면","ingredients":["쌀","돼지고기","채소","국수"],"descriptionLength":101,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"VN|고이꾸온","countryCode":"VN","country":"베트남","flag":"🇻🇳","name":"고이꾸온","title":"고이 꾸온","status":"done","desc":"고이 꾸온(베트남어: gỏi cuốn) 또는 냄 꾸온(베트남어: nem cuốn)은 바인 짱(라이스 페이퍼)에 돼지고기, 새우, 채소와 허브 등을 넣어 돌돌 말아 만드는 베트남 음식이다. 한국에서는 월남쌈이라 부르기도 하며, 영어권 등지에서는 \"베트남 롤(Vietnamese roll)\", \"베트남 춘권(Vietnamese spring roll)\" 또는 \"하권(summer roll)\"이라 부르기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Sommerrolle_mit_Hoisin-Sauce_170305_AW.jpg/500px-Sommerrolle_mit_Hoisin-Sauce_170305_AW.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=153415","lang":"ko","updated":"2026-10-14T00:42:25.536Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["고이꾸온","고이 꾸온"],"category":"채소·샐러드","ingredients":["돼지고기","새우","채소"],"descriptionLength":226,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"VN|반쎄오","countryCode":"VN","country":"베트남","flag":"🇻🇳","name":"반쎄오","title":"바인 쌔오","status":"done","desc":"반쎄오는 쌀가루 반죽을 얇고 바삭하게 부쳐 숙주와 새우, 돼지고기 등을 넣는 베트남 음식입니다. 채소에 싸서 소스에 찍어 먹기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Banh_Xeo%2C_Eden_Center.jpg/500px-Banh_Xeo%2C_Eden_Center.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=873261","lang":"ko","updated":"2026-10-14T00:42:26.762Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["반쎄오","바인 쌔오"],"category":"빵·밀가루","ingredients":["쌀가루","숙주","새우"],"descriptionLength":76,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"VN|까오러우","countryCode":"VN","country":"베트남","flag":"🇻🇳","name":"까오러우","title":"유재석","status":"candidate","desc":"유재석(劉在錫, 1972년 8월 14일 ~ )은 대한민국의 희극인, 방송인이다. 1991년에 KBS 공채 7기 개그맨으로 데뷔했다. 《X맨》, 《무한도전》, 《해피투게더》, 《런닝맨》, 《놀면 뭐하니?》, 《유 퀴즈 온 더 블럭》, 《식스센스》 등 다수의 TV 프로그램 진행을 맡았거나 맡고 있다. 대한민국 지상파 방송 3사(KBS, MBC, SBS)와 백상예술대상의 대상을 총 19회 수상하여 최다 수상 기록을 세웠으며, 2018년 대중문화예술상 대통령 표창을 받았다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Yoo_Jae_Suk_going_to_work_at_Happy_Together_on_August_19%2C_2017_%281%29.jpg/500px-Yoo_Jae_Suk_going_to_work_at_Happy_Together_on_August_19%2C_2017_%281%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=96924","lang":"ko","updated":"2026-10-14T00:42:27.481Z","verification":"","risk":"차단 권고","reasons":["기존 보고서의 오검색/상위 개념","비음식 주제 가능성","등록 이름·별칭과 검색 제목 불일치"],"aliases":["까오러우","유재석","Cao lầu","Cao lau"],"category":"국수·면","ingredients":["게"],"descriptionLength":265,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ID|나시고렝","countryCode":"ID","country":"인도네시아","flag":"🇮🇩","name":"나시고렝","title":"나시 고렝","status":"done","desc":"나시 고렝(말레이어·인도네시아어: nasi goreng)은 인도네시아, 말레이시아, 브루나이, 싱가포르 등 말레이어 사용 동남아시아 지역의 볶음밥이다. 인도네시아의 국민 음식 가운데 하나로 여겨지며, CNN에서 진행한 인기 투표에서 세계에서 가장 맛있는 음식 2위로 선정된 바 있다. 덥고 습한 기후 특성상 밥이 일찍 쉬는 것을 막기 위한 보존식으로 등장하였으며, 미리 음식을 한 상 차려놓는 식문화를 반영하여 만들어졌다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Nasi_goreng_indonesia.jpg/500px-Nasi_goreng_indonesia.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=88191","lang":"ko","updated":"2026-10-14T00:42:28.198Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["나시고렝","나시 고렝"],"category":"쌀·밥","ingredients":["밥"],"descriptionLength":236,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"ID|렌당","countryCode":"ID","country":"인도네시아","flag":"🇮🇩","name":"렌당","title":"른당","status":"done","desc":"렌당은 쇠고기 등을 코코넛 밀크와 여러 향신료에 넣어 오랫동안 졸이는 인도네시아 음식입니다. 진한 향과 부드러운 고기가 특징입니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Randang_cubadak2.jpg/500px-Randang_cubadak2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1424266","lang":"ko","updated":"2026-10-14T00:42:29.120Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["렌당","른당"],"category":"고기요리","ingredients":["쇠고기","코코넛 밀크","향신료"],"descriptionLength":73,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ID|사테","countryCode":"ID","country":"인도네시아","flag":"🇮🇩","name":"사테","title":"사테","status":"done","desc":"사테(말레이어·인도네시아어: sate, 자와어: saté)는 인도네시아, 말레이시아, 브루나이, 싱가포르를 비롯한 동남아시아 지역에서 먹는 고기 꼬치 구이이다. 대표적인 자와 요리로, 인도네시아와 말레이시아의 국민 음식 가운데 하나로 여겨진다. 태국과 필리핀 등 주변 지역뿐 아니라, 인도네시아를 식민 지배했던 네덜란드와 네덜란드의 식민 지배를 받았던 수리남, 말레이계 이민자가 많은 스리랑카 등에서도 즐겨 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Satay_2.jpg/500px-Satay_2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=88187","l 체제를 타파하는 것을 목표로 활동하였다.\n실제 일루미나티는 여러 차례의 분열과 외압으로 인해 해산되었으나, 오늘날 대중에서 유행하는 미스터리 및 오컬트 문화에서는 이들이 암암리에 잔존해 있으며, 정치인이나 군대, 과학자, 그 밖의 유명인을 포섭하여 배후에서 세계의 정치·경제를 조종하고 있다는, 이른바 그림자 정부 관련 음모론의 소재로도 이용되고 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Dollarnote_siegel_hq.jpg/500px-Dollarnote_siegel_hq.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=300656","lang":"ko","updated":"2026-10-14T00:42:35.881Z","verification":"","risk":"차단 권고","reasons":["기존 보고서의 오검색/상위 개념","비음식 주제 가능성","등록 이름·별칭과 검색 제목 불일치"],"aliases":["라밍턴","일루미나티","Lamington","Lamington cake"],"category":"디저트·과자","ingredients":[],"descriptionLength":421,"categoryOriginal":"디저트","extraCategories":[]},{"id":"AU|파블로바","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"파블로바","title":"파블로바 (음식)","status":"done","desc":"파블로바(영어: pavlova 패블로버[*])는 뉴질랜드와 오스트레일리아의 디저트이다. 발레리나 안나 파블로바의 이름을 딴 머랭 기반 양과자로, 겉은 바삭바삭하고 속은 부드러운 케이크 형태를 띤다. 보통 크림과 과일을 토핑한다. 크리스마스 등 명절에 흔히 먹는 음식이며, 뉴질랜드와 오스트레일리아의 국민 음식 가운데 하나이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Pavlova_dessert.JPG/500px-Pavlova_dessert.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=482704","lang":"ko","updated":"2026-10-14T00:42:36.799Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["파블로바","파블로바 (음식)"],"category":"디저트·과자","ingredients":[],"descriptionLength":186,"categoryOriginal":"디저트","extraCategories":[]},{"id":"AU|바비큐","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"바비큐","title":"바비큐","status":"done","desc":"바비큐(barbecue)는 고기를 통째로 구운 요리로 시작해, 야외에서 육류나 각종 야채, 과채를 굽는 음식으로 발전하는 과정을 거쳐, 지금은 야외나 실내에서 불을 피워 고기나 생선, 채소, 과일 등 모든 굽는 행위나 음식을 일컫는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/Barbecued_meats.jpg/500px-Barbecued_meats.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid
