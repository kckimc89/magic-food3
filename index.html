wikimedia.org/wikipedia/commons/thumb/3/30/Gado-gado_in_Jakarta.JPG/500px-Gado-gado_in_Jakarta.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1981401","lang":"ko","updated":"2026-10-14T00:42:30.758Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["가도가도"],"category":"채소·샐러드","ingredients":["두부","달걀","채소"],"descriptionLength":156,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ID|소토","countryCode":"ID","country":"인도네시아","flag":"🇮🇩","name":"소토","title":"소토","status":"candidate","desc":"소토의 다른 뜻은 다음과 같다.\n\n소토(soto)는 인도네시아의 국물 요리이다.\n소토족\n소토역: 로스앤젤레스 군 광역철도의 금선역 중 하나","image":"","url":"https://ko.wikipedia.org/?curid=2334030","lang":"ko","updated":"2026-10-14T00:42:32.604Z","verification":"","risk":"재검토","reasons":["설명 부족"],"aliases":["소토"],"category":"수프·국물","ingredients":[],"descriptionLength":77,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ID|템페","countryCode":"ID","country":"인도네시아","flag":"🇮🇩","name":"템페","title":"템페","status":"done","desc":"템페(자와어: témpé)는 인도네시아의 발효 식품이다. 콩을 발효시켜 만든 음식으로, 청국장과 비슷하지만 무르지 않고 단단하다. 겉모습은 두부와, 맛은 견과류나 버섯과 비슷한 편이다.인도네시아의 중요한 음식으로 고기보다 훨씬 싸서 많은 사람들이 즐긴다. 그리고 템페는 단백질의 양이 매우 크기에 인도네시아의 밥상에는 한국의 김치처럼 항상 올라온다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/Tempeh_tempe.jpg/500px-Tempeh_tempe.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1181348","lang":"ko","updated":"2026-10-14T00:42:33.318Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["템페"],"category":"콩·유제품","ingredients":["김","콩","두부","김치","밥"],"descriptionLength":197,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"AU|미트파이","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"미트파이","title":"미트 파이","status":"done","desc":"미트 파이(영어: meat pie)는 오스트레일리아(호주)와 뉴질랜드의 파이이다. 다진 고기와 그레이비를 넣어 만든 손바닥 크기의 고기 파이로, 가벼운 식사나 간식 등으로 먹는다. 오스트레일리아와(호주) 뉴질랜드의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Meat_pie.jpg/500px-Meat_pie.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=559554","lang":"ko","updated":"2026-10-14T00:42:34.036Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["미트파이","미트 파이"],"category":"빵·밀가루","ingredients":[],"descriptionLength":139,"categoryOriginal":"디저트","extraCategories":[]},{"id":"AU|베지마이트","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"베지마이트","title":"베지마이트","status":"done","desc":"베지마이트(영어: Vegemite)는 오스트레일리아의 스프레드이다. 효모 추출물로 만든 짭조름하고 약간 쌉싸름한 진갈색 페이스트로, 주로 빵이나 크래커에 얇게 펴 발라 먹는다. 오스트레일리아의 국민 음식 가운데 하나로 여겨진다.","image":"https://upload.wikimedia.org/wikipedia/commons/1/10/Vegemiteontoast_large.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=163850","lang":"ko","updated":"2026-10-14T00:42:34.752Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["베지마이트"],"category":"음료·소스","ingredients":["게","빵"],"descriptionLength":127,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"AU|라밍턴","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"라밍턴","title":"일루미나티","status":"candidate","desc":"일루미나티(라틴어: Illuminati), 바이에른 광명회( - 光明會, 독일어: Illuminatenorden Bayern, 영어: Bavarian Illuminati) 또는 단순히 광명회(光明會, 독일어: Der Illuminatenorden)는 계몽주의 시대인 1776년 5월 1일 독일에서 조직되어 1785년 해산된 역사상의 비밀결사로, 계몽주의 사상에 근거하여 급진적인 정치종교 중심의 사회 체제를 타파하는 것을 목표로 활동하였다.\n실제 일루미나티는 여러 차례의 분열과 외압으로 인해 해산되었으나, 오늘날 대중에서 유행하는 미스터리 및 오컬트 문화에서는 이들이 암암리에 잔존해 있으며, 정치인이나 군대, 과학자, 그 밖의 유명인을 포섭하여 배후에서 세계의 정치·경제를 조종하고 있다는, 이른바 그림자 정부 관련 음모론의 소재로도 이용되고 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Dollarnote_siegel_hq.jpg/500px-Dollarnote_siegel_hq.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=300656","lang":"ko","updated":"2026-10-14T00:42:35.881Z","verification":"","risk":"차단 권고","reasons":["기존 보고서의 오검색/상위 개념","비음식 주제 가능성","등록 이름·별칭과 검색 제목 불일치"],"aliases":["라밍턴","일루미나티","Lamington","Lamington cake"],"category":"디저트·과자","ingredients":[],"descriptionLength":421,"categoryOriginal":"디저트","extraCategories":[]},{"id":"AU|파블로바","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"파블로바","title":"파블로바 (음식)","status":"done","desc":"파블로바(영어: pavlova 패블로버[*])는 뉴질랜드와 오스트레일리아의 디저트이다. 발레리나 안나 파블로바의 이름을 딴 머랭 기반 양과자로, 겉은 바삭바삭하고 속은 부드러운 케이크 형태를 띤다. 보통 크림과 과일을 토핑한다. 크리스마스 등 명절에 흔히 먹는 음식이며, 뉴질랜드와 오스트레일리아의 국민 음식 가운데 하나이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Pavlova_dessert.JPG/500px-Pavlova_dessert.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=482704","lang":"ko","updated":"2026-10-14T00:42:36.799Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["파블로바","파블로바 (음식)"],"category":"디저트·과자","ingredients":[],"descriptionLength":186,"categoryOriginal":"디저트","extraCategories":[]},{"id":"AU|바비큐","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"바비큐","title":"바비큐","status":"done","desc":"바비큐(barbecue)는 고기를 통째로 구운 요리로 시작해, 야외에서 육류나 각종 야채, 과채를 굽는 음식으로 발전하는 과정을 거쳐, 지금은 야외나 실내에서 불을 피워 고기나 생선, 채소, 과일 등 모든 굽는 행위나 음식을 일컫는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/Barbecued_meats.jpg/500px-Barbecued_meats.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=294660","lang":"ko","updated":"2026-10-14T00:42:37.926Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["바비큐"],"category":"고기요리","ingredients":["생선","채소"],"descriptionLength":131,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"AU|안작 비스킷","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"안작 비스킷","title":"앤잭 비스킷","status":"candidate","desc":"앤잭 비스킷(영어: Anzac biscuit)은 오스트레일리아와 뉴질랜드의 비스킷으로 으깬 귀리, 밀가루, 설탕, 버터(또는 마가린), 당밀, 베이킹소다, 말린 코코넛 등을 이용해 만든다.\n제1차 세계 대전 시대에 창설된 오스트레일리아 뉴질랜드 군단(ANZAC, 앤잭) 소속 군인들의 가족들이 군인들에게 보낸 것에서 유래되었는데 이는 비스킷이 해상 수송 과정에서 잘 상하지 않기 때문이었다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/ANZAC_biscuits_%2814_April_2006%29.jpg/500px-ANZAC_biscuits_%2814_April_2006%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1982578","lang":"ko","updated":"2026-10-14T00:42:38.642Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["안작 비스킷","앤잭 비스킷"],"category":"디저트·과자","ingredients":["밀가루","버터","코코넛","게"],"descriptionLength":218,"categoryOriginal":"디저트","extraCategories":[]},{"id":"AU|미트 파이","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"미트 파이","title":"미트 파이","status":"done","desc":"미트 파이(영어: meat pie)는 오스트레일리아(호주)와 뉴질랜드의 파이이다. 다진 고기와 그레이비를 넣어 만든 손바닥 크기의 고기 파이로, 가벼운 식사나 간식 등으로 먹는다. 오스트레일리아와(호주) 뉴질랜드의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Meat_pie.jpg/500px-Meat_pie.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=559554","lang":"ko","updated":"2026-10-14T00:42:39.360Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["미트 파이"],"category":"빵·밀가루","ingredients":[],"descriptionLength":139,"categoryOriginal":"디저트","extraCategories":[]},{"id":"AU|베지마이트 토스트","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"베지마이트 토스트","title":"베지마이트","status":"candidate","desc":"베지마이트(영어: Vegemite)는 오스트레일리아의 스프레드이다. 효모 추출물로 만든 짭조름하고 약간 쌉싸름한 진갈색 페이스트로, 주로 빵이나 크래커에 얇게 펴 발라 먹는다. 오스트레일리아의 국민 음식 가운데 하나로 여겨진다.","image":"https://upload.wikimedia.org/wikipedia/commons/1/10/Vegemiteontoast_large.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=163850","lang":"ko","updated":"2026-10-14T00:42:40.076Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["베지마이트 토스트","베지마이트"],"category":"빵·밀가루","ingredients":["게","빵"],"descriptionLength":127,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"AU|램 요리","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"램 요리","title":"양고기","status":"candidate","desc":"양고기는 사육된 양을 도축하여 만든 고기이다. 나이에 따라 어린양고기/램(lamb), 머튼(mutton), 호깃(hogget) 등으로 구분하기도 한다. 일반적으로 램이 머턴에 비해 가격이 비싼 특징이 있으며, 의미의 확장으로 인하여 현재는 램을 양고기와 동의어로 사용하기도 한다. 반면 머턴의 경우 현대에 이르러 점차 소비가 줄어드는 추세이다. 이외에 오스트레일리아에서는 고기를 생산할 목적으로 사육된 양을 일컬어 '프라임 램'(prime lamb)이라고도 한다.\n양고기는 보통 가공을 하여 꼬치 등으로 구워 먹으며, 지역 및 문화에 따라 다양한 조리법이 개발되었다. 중국에는 뀀, 동남아시아에는 사테, 러시아에는 샤실리크, 터키에는 아다나 케밥 등의 요리가 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Schafh%C3%A4lfte.jpg/500px-Schafh%C3%A4lfte.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=415444","lang":"ko","updated":"2026-10-14T00:42:40.794Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["램 요리","양고기"],"category":"고기요리","ingredients":["양고기","밥"],"descriptionLength":372,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"CA|푸틴","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"푸틴","title":"푸틴 (음식)","status":"done","desc":"푸틴(프랑스어: poutine)은 캐나다의 감자 요리이다. 감자 튀김에 치즈 커드와 브라운 그레이비를 곁들인 음식으로, 1950년대 후반 상트르뒤케베크 지역에서 만들어졌다. 캐나다의 국민 음식 가운데 하나로 여겨진다. 위안을 주는 음식으로 여겨지며, 해장 음식으로도 사랑받는다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Poutine.JPG/500px-Poutine.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=833143","lang":"ko","updated":"2026-10-14T00:42:42.125Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["푸틴","푸틴 (음식)"],"category":"튀김·간식","ingredients":["김","감자","치즈"],"descriptionLength":157,"categoryOriginal":"수프·국물","extraCategories":["기타·전통요리"]},{"id":"CA|메이플 시럽","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"메이플 시럽","title":"메이플 시럽","status":"done","desc":"메이플 시럽(영어: maple syrup, 프랑스어: sirop d'erable, 네덜란드어: esdoornsiroop)  또는 단풍당밀(丹楓糖蜜)은 단풍나무의  수액으로부터 만드는 감미료의 하나이다. 단풍나무 시럽, 또는 단풍당(丹楓糖)이라고도 부른다.  캐나다 및 미국 등지에서 주로 따뜻한 와플이나 팬케이크 위에 부어 함께 먹는다. 그 외에도 엄지 손가락 한마디 크기로 만든 단풍나뭇 잎 모양의 사탕인 메이플슈거캔디를 만들며 빵이나 후식을 만드는 데 재료로 들어가거나 간혹 맥주를 만들 때 당의 주원료나 감미료로 이용된다. 조림음식의 독특한 향과 맛을 내기 위하여 설탕 대용으로 쓰인다.\n메이플 시럽의 성분은 수크로스가 약 62%를 차지하고, 과당과 포도당이 각각 약 1%정도를 차지한다.\n아메리카 토착민들이 처음으로 메이플 시럽을 채취하고 사용을 하였고 이후 유럽인 정착자들도 이를 받아들여 이용하게 되었다.\n캐나다는 전 메이플 시럽 생산량의 85%를 차지하고 있다. 캐나다 식품검사청(CFIA)에서는 메이플 시럽을 세 등급으로 분류하여 관리하고 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Maple_syrup.jpg/500px-Maple_syrup.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=299461","lang":"ko","updated":"2026-10-14T00:42:42.841Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["메이플 시럽"],"category":"음료·소스","ingredients":["게","빵"],"descriptionLength":537,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|투르티에르","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"투르티에르","title":"고기 파이","status":"candidate","desc":"고기 파이(-pie)는 소로 고기와 다른 재료를 넣어 만든 파이이다. 가나, 나이지리아, 남아프리카 공화국, 뉴질랜드, 영국, 오스트레일리아, 미국, 짐바브웨, 캐나다 등에서 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/MeatPie.JPG/500px-MeatPie.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=422695","lang":"ko","updated":"2026-10-14T00:42:43.559Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["투르티에르","고기 파이"],"category":"빵·밀가루","ingredients":[],"descriptionLength":102,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|버터 타르트","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"버터 타르트","title":"타르트","status":"candidate","desc":"타르트(tart)는 윗쪽이 패스트리로 덮이지 않은 파이 형태의 패스트리 양과자의 일종이다. 보통 달콤한 맛이 나게 하여 먹는다. 양파 타르트, 블루베리 타르트, 타르트 타틴, 애플 타르트 등 여러 종류가 있다.\n일반적으로, 파이 도우(dough)는 밀가루, 유지(fat), 물 등을 섞어 만든다. 이스트는 넣지 않는다. 여기서 유지(fat)란 버터, 혹은 마가린을 말한다. 생지는 보통 납작하게 만든다. 잎사귀 두께만큼 두께를 갖도록 만든다. 장식을 위에 두고 혹은 위에 두지 않고 팬에 넣고 굽는다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Raspberry_tart.jpg/500px-Raspberry_tart.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=231470","lang":"ko","updated":"2026-10-14T00:42:44.377Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["버터 타르트","타르트"],"category":"디저트·과자","ingredients":["양파","밀가루","버터","게"],"descriptionLength":282,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|나나이모 바","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"나나이모 바","title":"나나이모 바","status":"done","desc":"나나이모 바(Nanaimo bar, /nəˈnaˈmoʊ/ nə-NY-moh)는 베이킹이 필요 없는 바 디저트로 브리티시컬럼비아주의 캐나다 도시 너나이모의 이름을 따서 명명되었다. 웨이퍼 (음식), 견과류(호두, 아몬드 또는 피칸), 코코넛 부스러기 베이스의 세 가지 층으로 구성된다. 중간에 커스터드 아이싱, 그리고 그 위에 초코 가나슈를 얹어준다. 다양한 유형의 부스러기(crumb), 다양한 맛의 아이싱(예: 땅콩버터 또는 코코넛, 모카), 다양한 유형의 초콜릿으로 구성된 다양한 종류가 존재한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Nanaimo_bar.JPG/500px-Nanaimo_bar.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3818016","lang":"ko","updated":"2026-10-14T00:42:45.196Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["나나이모 바"],"category":"디저트·과자","ingredients":["콩","버터","코코넛"],"descriptionLength":280,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|몬트리올 베이글","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"몬트리올 베이글","title":"몬트리올 베이글","status":"done","desc":"몬트리올 베이글(영어: Montreal-style bagel 몬트리올스타일 베이글[*])은 독특한 종류의 베이글의 일종이다. 기계 작업 없이 손으로 만들며 나무에 불을 붙여 굽는다. 뉴욕 베이글에 비해서 몬트리올 베이글은 더 작고, 더 단 맛이 나며, 더 밀도가 높다. 중앙에 뚫려 있는 베이글 특유의 구멍 역시 몬트리올 베이글이 좀 더 큰 편이다. 몬트리올 베이글은 항상 나무에 불을 붙여 그 위에서 굽는다. 엿기름과 달걀이 주 재료로 들어가며 소금은 이 베이글에 들어가지 않는다. 그리고 나무에 불을 붙여 굽기 전에는 보통 꿀이 들어간 뜨거운 물에 베이글을 데운다.\n많은 몬트리올의 빵집에서는 아직도 몬트리올 베이글을 수작업으로 손수 만들며 나무를 태워서 굽는다. 시중에서 팔리는 몬트리올 베이글에는 양귀비 씨가 뿌려진 \"블랙 시드\"와 참깨가 뿌려진 \"화이트 시드\"가 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Bagels-Montreal-REAL.jpg/500px-Bagels-Montreal-REAL.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1236181","lang":"ko","updated":"2026-10-14T00:42:46.121Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["몬트리올 베이글"],"category":"빵·밀가루","ingredients":["달걀","빵"],"descriptionLength":435,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"CA|연어 요리","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"연어 요리","title":"연어 (음식)","status":"candidate","desc":"연어는 세계적으로 인기 있는 식재료이다. 연어는 기름기가 많은 생선이지만 건강에 좋다. 연어는 단백질 함유량이 많고, 비타민 D, 오메가-3 지방산도 많이 포함하고 있다. 연어는 종에 따라 100g당 23 ~ 214 mg의 콜레스테롤을 함유하고 있다. 하지만 과학 잡지 사이언스에 의하면 양식 연어는 폴리염화디벤조디옥신을 많이 함유하고 있다고 밝혔다. 폴리염화 바이페닐은 자연산에 비해 양식이 8배 정도 갖고 있지만, 인체에 유해한 정도는 아니라고 밝혔다. 2006년 미국의학협회 저널에서는 양식 연어를 먹는 것이 인체에 무해하며, 건강에 도움이 된다고 밝혔다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/Salmon_salad.jpg/500px-Salmon_salad.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1448380","lang":"ko","updated":"2026-10-14T00:42:46.875Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["연어 요리","연어 (음식)"],"category":"생선·해산물","ingredients":["생선","연어"],"descriptionLength":314,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"CA|베이글","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"베이글","title":"베이글","status":"done","desc":"베이글(영어: bagel, 이디시어: בײגל beygl로부터)은 전통적으로, 손바닥 정도 넓이에 이스트를 첨가한 밀가루를 반죽하여 끓는 물에 데친 다음 구워서 만든 빵이다. 바깥 면이 바삭거리는 것도 있는데 보통은 노릇한 갈색을 띤다. 안쪽은 마치 가래떡같이 쫄깃한 맛과 보통 식빵에 비해 씹는 맛이 있다. 아무것도 넣지 않은 플레인 베이글도 있고 양귀비 씨나 깨를 얹은 베이글도 있다. 가운데에 구멍이 뚫려 있어서 모양은 도넛과 유사하지만, 도넛은 기름에 튀기는 반면 베이글은 그렇지 않아 담백하고 버터, 우유, 설탕이 들어가지 않아서 저지방, 저콜레스테롤의 건강식으로 각광받고 있다.","image":"https://upload.wikimedia.org/wikipedia/commons/9/98/Bagel.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=107452","lang":"ko","updated":"2026-10-14T00:42:47.551Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["베이글"],"category":"빵·밀가루","ingredients":["밀가루","우유","버터","빵"],"descriptionLength":329,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|배넉","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"배넉","title":"배넉 (음식)","status":"done","desc":"배넉(영어: bannock)은 큰 납작한 종류의 퀵 브레드(베이킹파우더와 탄산 수소 나트륨을 이용해 즉석으로 부풀린 빵)이다. 배넉이라는 단어는 영어에서 크고 둥근 빵을 가리킬 수 있다. 둥근 배넉을 쐐기 모양의 조각으로 자르면 스콘이라고 부른다. 하지만 스코틀랜드에서는 배넉과 스콘의 뜻을 교체할 수 있다.","image":"https://upload.wikimedia.org/wikipedia/commons/d/d2/BannockBeremeal.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=525755","lang":"ko","updated":"2026-10-14T00:42:48.268Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["배넉","배넉 (음식)"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":172,"categoryOriginal":"디저트","extraCategories":[]},{"id":"MX|타코","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"타코","title":"타코","status":"done","desc":"타코(스페인어: taco)는 멕시코의 전통 음식이다. 토티아(토르티야)에 고기와 채소 등 여러 가지 재료를 올리고 소스를 얹어 먹는 음식으로, 대표적인 안토히토이다. 멕시코의 길거리 음식이며,  국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/001_Tacos_de_carnitas%2C_carne_asada_y_al_pastor.jpg/500px-001_Tacos_de_carnitas%2C_carne_asada_y_al_pastor.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=229325","lang":"ko","updated":"2026-10-14T00:42:50.728Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["타코"],"category":"빵·밀가루","ingredients":["채소"],"descriptionLength":128,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"MX|몰레","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"몰레","title":"몰레","status":"done","desc":"몰레(스페인어: mole)는 멕시코 요리에 쓰이는 여러 소스를 일컫는 말이다. 멕시코 밖에서 \"몰레\"는 주로 푸에블라식 소스인 몰레 포블라노를 일컫는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Mole_in_Puebla.JPG/500px-Mole_in_Puebla.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1821283","lang":"ko","updated":"2026-10-14T00:42:51.545Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["몰레"],"category":"음료·소스","ingredients":[],"descriptionLength":85,"categoryOriginal":"음료·소스","extraCategories":["수프·국물"]},{"id":"MX|타말","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"타말","title":"타말","status":"done","desc":"타말(스페인어: tamal)은 멕시코, 과테말라 등 중앙아메리카 많은 나라의 전통 음식이다. 옥수수로 만든 마사 반죽을 옥수수 껍질이나 바나나잎에 싸서 쪄낸다. 고기, 치즈, 토마토 등으로 만든 속이나 소스를 넣기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Gastronom%C3%ADa_de_Tochap%C3%A1n.jpg/500px-Gastronom%C3%ADa_de_Tochap%C3%A1n.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1891244","lang":"ko","updated":"2026-10-14T00:42:52.262Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["타말"],"category":"빵·밀가루","ingredients":["토마토","치즈","바나나","옥수수"],"descriptionLength":124,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"MX|포솔레","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"포솔레","title":"포솔레","status":"done","desc":"포솔레(스페인어: pozole, 나와틀어: pozolli에서 유래)는 멕시코의 전통적인 국 또는 스튜이다. 닉스타말과 고기 (일반적으로 닭고기 또는 돼지고기)로 만들며, 잘게 썬 상추나 양배추, 고추, 양파, 마늘, 무, 아보카도, 살사 또는 라임으로 양념하고 장식할 수 있다. 선콜럼버스 시대부터 중앙아메리카 지역에 존재했으며, 멕시코와 인접 국가들에서 일상식과 축제 요리로 흔하게 볼 수 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Green_pozole%2C_dressed_%2829161841908%29_%28cropped%29.jpg/500px-Green_pozole%2C_dressed_%2829161841908%29_%28cropped%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4049085","lang":"ko","updated":"2026-10-14T00:42:53.080Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["포솔레"],"category":"수프·국물","ingredients":["돼지고기","닭고기","양파","게","마늘"],"descriptionLength":222,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"MX|과카몰레","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"과카몰레","title":"과카몰레","status":"done","desc":"과카몰레(스페인어: guacamole)는 멕시코 요리의 소스로, 콘칩과 유사한 '토토포(Totopo)'라고 하는 튀긴 토르티야 조각으로 퍼서 먹는다.\n'과카'는 멕시코에서 아보카도를 뜻하는 '아과카테(Aguacate)'에서 온 것이며, '몰레'는 멕시코 원주민 어로 '소스'를 뜻한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b9/El_tango_guacamole.jpg/500px-El_tango_guacamole.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=366966","lang":"ko","updated":"2026-10-14T00:42:53.900Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["과카몰레"],"category":"음료·소스","ingredients":[],"descriptionLength":159,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MX|엔칠라다","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"엔칠라다","title":"엔칠라다","status":"done","desc":"엔칠라다(스페인어: enchilada IPA: [entʃiˈlaða])는 옥수수 토르티야에 (만두처럼) 소를 넣고 돌돌 만 뒤 매운 고추 소스를 뿌려 먹는 음식이다. 고기, 치즈, 콩, 감자, 채소, 해산물 등으로 엔칠라다의 소를 만든다. 또 취향에 따라 치즈, 사워크림, 상추, 올리브, 다진 양파, 고추, 고수 잎 등을 엔칠라다 위에 얹어서 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Enchilada_Rice_Beans.jpg/500px-Enchilada_Rice_Beans.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=761969","lang":"ko","updated":"2026-10-14T00:42:54.617Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["엔칠라다"],"category":"빵·밀가루","ingredients":["감자","양파","치즈","콩","옥수수"],"descriptionLength":197,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"BR|페이조아다","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"페이조아다","title":"페이조아다","status":"done","desc":"페이조아다(포르투갈어: feijoada)는 포르투갈, 브라질, 앙골라, 모잠비크 등 포르투갈어권 지역의 대표적인 음식이다. 돼지고기나 쇠고기 등을 넣어 만든 강낭콩 스튜의 일종으로, 거의 항상 쌀밥과 함께 먹는다. 고기를 넣지 않고 콩만으로 조리한 것은 포르투갈어로 \"콩\"을 뜻하는 \"페이장\"이라 부르며, 흔히 쌀밥과 함께 점심 식사 때 고기 요리 등의 부식으로 곁들인다. 고기 등 부재료를 넣어 조리한 페이조아다는 주말 점심 식사 주요리로 먹는다. 포르투갈 북부가 기원이며, 브라질에서는 페이조아다가 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Feijoada_%C3%A0_transmontada.jpg/500px-Feijoada_%C3%A0_transmontada.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=210476","lang":"ko","updated":"2026-10-14T00:42:55.333Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["페이조아다"],"category":"수프·국물","ingredients":["쌀","돼지고기","쇠고기","콩","밥"],"descriptionLength":300,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"BR|슈하스코","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"슈하스코","title":"슈하스쿠","status":"candidate","desc":"슈하스쿠(브라질 포르투갈어: churrasco) 또는 추라스코(스페인어: churrasco)는 브라질과 우루과이, 아르헨티나를 비롯한 포르투갈어권·스페인어권 아메리카 지역의 전통 고기 구이 요리이다. 라틴아메리카 외에 포르투갈과 갈리시아 등에서도 즐겨 먹으며, 브라질의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Churrasco_carioca.jpg/500px-Churrasco_carioca.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1811234","lang":"ko","updated":"2026-10-14T00:42:56.051Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["슈하스코","슈하스쿠"],"category":"고기요리","ingredients":[],"descriptionLength":170,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"BR|모케카","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"모케카","title":"모케카","status":"candidate","desc":"모케카(포르투갈어: moqueca) 또는 무케카(포르투갈어: muqueca)는 브라질과 앙골라의 생선·해산물 스튜 또는 국이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Moqueca.jpg/500px-Moqueca.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3620208","lang":"ko","updated":"2026-10-14T00:42:56.767Z","verification":"","risk":"재검토","reasons":["설명 부족"],"aliases":["모케카"],"category":"생선·해산물","ingredients":["생선"],"descriptionLength":71,"categoryOriginal":"수프·국물","extraCategories":["수프·국물"]},{"id":"BR|파웅 지 케이주","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"파웅 지 케이주","title":"브라질의 문화","status":"candidate","desc":"브라질의 문화는 다양한 원주민 문화의 융합과 특히 브라질 식민지 시대에 원주민, 포르투갈인 식민지 개척자 및 아프리카인들 사이에서 일어난 문화적 융합으로 형성되었다. 19세기 후반과 20세기 초반에 브라질은 주로 포르투갈, 이탈리아, 스페인, 독일 출신의 상당수 이민자를 받아들였으며, 이들과 함께 일본, 오스트리아, 네덜란드, 아르메니아, 아랍, 유대인, 폴란드, 우크라이나, 프랑스, 러시아, 스위스, 헝가리, 그리스, 중국, 한국 출신의 소수 이민자들이 브라질의 지역 문화 형성에 중요한 기여를 했으며, 이로써 브라질이 현재의 다원적이고 인종적으로 다양한 사회로 존재하는 데 기여했다.\n포르투갈 제국에 의한 3세기 동안의 식민지화의 결과로, 브라질 문화의 많은 측면은 포르투갈의 문화에서 파생되었다. 포르투갈로부터 물려받은 수많은 것에는 포르투갈어, 쌀밥과 콩 및 페이조아다와 같은 음식, 지배적인 종교 및 식민지 건축 양식이 포함된다. 그러나 이러한 측면은 아프리카 및 원주민 전통과 다른 서유럽 국가들의 전통에 의해 영향을 받았다. 브라질 문화의 일부 측면은 이탈리아, 스페인, 독일, 일본 및 기타 유럽 이민자들의 기여이다. 아메리카 원주민과 아프리카인들도 브라질 언어, 요리, 음악, 춤, 종교 형성에 중요한 역할을 했다.\n이 다양한 문화적 배경은 리우 카니발과 분바 메우 보이와 같이 세계적으로 알려진 많은 축제와 행사를 선보이는 데 기여했다. 다채로운 문화는 브라질을 매년 100만 명 이상의 관광객이 방문하는 인기 있는 관광지로 만드는 환경을 조성한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Roda_de_capoeira4.jpg/500px-Roda_de_capoeira4.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3994541","lang":"ko","updated":"2026-10-14T00:42:57.484Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["파웅 지 케이주","브라질의 문화"],"category":"빵·밀가루","ingredients":["쌀","콩","밥"],"descriptionLength":767,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"BR|아카라제","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"아카라제","title":"아카라","status":"candidate","desc":"아카라(요루바어: àkàrà)는 서아프리카의 튀김 요리이다. 동부를 갈아 만든 반죽을 기름에 튀겨 만드는 요루바 요리로, 서아프리카계 주민이 많은 카리브, 브라질 등에서도 즐겨 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Beans_Ball-Akara.jpg/500px-Beans_Ball-Akara.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2683285","lang":"ko","updated":"2026-10-14T00:42:58.304Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["아카라제","아카라"],"category":"튀김·간식","ingredients":["김"],"descriptionLength":103,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"BR|브리가데이루","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"브리가데이루","title":"브리가데이루","status":"candidate","desc":"브리가데이루(포르투갈어: brigadeiro)는 브라질의 초콜릿 후식이다. 가당연유와 버터, 코코아가루로 만든 부드러운 후식이며, 겉에는 초콜릿 스프링클이 뿌려져 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Brigadeiro.jpg/500px-Brigadeiro.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3620350","lang":"ko","updated":"2026-10-14T00:42:59.430Z","verification":"","risk":"재검토","reasons":["설명 부족"],"aliases":["브리가데이루"],"category":"디저트·과자","ingredients":["버터"],"descriptionLength":94,"categoryOriginal":"디저트","extraCategories":[]},{"id":"BR|팡 지 케이주","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"팡 지 케이주","title":"팡 지 케이주","status":"done","desc":"팡 지 케이주(브라질 포르투갈어: pão de queijo)는 브라질의 치즈빵이다. 18세기쯤 미나스제라이스주에서 처음 만들어졌다고 추정된다. \"빵\"이라 불리지만, 카사바 녹말에 달걀, 소금, 기름, 치즈 등을 넣어 만든 쫄깃쫄깃한 비스킷이다. 겉은 바삭바삭하고 속은 부드럽다. 브라질에서는 주로 아침밥이나 간식으로 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Pao_de_queijo_brasil.jpg/500px-Pao_de_queijo_brasil.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1866859","lang":"ko","updated":"2026-10-14T00:43:00.351Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["팡 지 케이주"],"category":"빵·밀가루","ingredients":["치즈","달걀","밥","빵"],"descriptionLength":181,"categoryOriginal":"디저트","extraCategories":[]},{"id":"BR|아사이 볼","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"아사이 볼","title":"아사이 볼","status":"done","desc":"아사이 볼(açaí bowl) 또는 아사이 나 치젤라(브라질 포르투갈어: açaí na tigela→사발에 담긴 아사이)는 파라주와 아마조나스주가 원산지인 브라질의 달콤한 후식이다. 아사이야자 열매를 얼린 뒤 으깨어 만든 요리로, '흙 맛이 나는 듯한' 또는 크리미한 맛이 난다고 알려져 있다. 갈아내기 전에는 입자가 있는 질감이며, 높은 산도로 인한 신맛이 있어 맛있게 즐길 수 있다. 주로 과라나 시럽과 섞어 스무디 형태로 그릇에 담아 내며, 보통 그래놀라와 바나나를 올려 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e1/Acai_bowl_-_A%C3%A7a%C3%AD_na_tigela.jpg/500px-Acai_bowl_-_A%C3%A7a%C3%AD_na_tigela.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1836093","lang":"ko","updated":"2026-10-14T00:43:01.068Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["아사이 볼"],"category":"디저트·과자","ingredients":["바나나","게"],"descriptionLength":271,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"GB|피시 앤 칩스","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"피시 앤 칩스","title":"피시 앤드 칩스","status":"candidate","desc":"피시 앤드 칩스(fish and chips)는 길게 썬 감자와 생선을 튀겨 만든 영국의 대표 요리이다. 많은 사람들이 즐기는 서민적이고 대중적인 음식으로 유명하며 19세기 중반부터 먹기 시작한 이 음식은 영국인들로 부터 사랑받는 음식이다. 요리법이 간단한 패스트푸드로 포장 음식에 속한다. 해안가 마을에서 많이 팔리며, 캐나다, 오스트레일리아와 뉴질랜드 등에서도 인기가 있는 편이다.\n한 국가의 대표음식치고는 다른 국가들과 비교했을 때 상대적으로 심심하고 맛이 없다는 평가를 받고 있기는 하나 한끼 식사로는 손색이 없다. 칼로리가 높고 기름진 탓에 한꺼번에 많이 먹기에는 부담스러우나 의외로 질리지는 않는 편이라 다시 찾게 만드는 매력이 있다. 영국인들은 최소한 일주일에 한번 이상은 피시앤칩스를 먹는다고 한다.\n저렴한 가격에 쉽게 포만감을 얻을 수 있는 편이라 세계대전 당시에는 영국인들의 지치고 불안한 마음을 달래주는 컴포트 푸드(comfort food)로 인정을 받은 적이있다. 2차 세계대전 당시 윈스턴 처칠이 피시앤칩스를 ‘좋은 친구(the good companions)’라 불렀다는 사실은 영국인들 사이에서 잘 알려져 있다. 참전 병사들 역시 피시앤칩스를 아군과 적군을 판별하는 암호처럼 활용했다.\n오늘날에도 영국에서는 매년 최고의 피시앤칩스 가게를 선정, 발표하는 경연이 열리기도 한다. 영국 일간지 「인디펜던트」(Independent)에 따르면 2010년에 영국전역에 약 1만 500개의 피시앤칩스 음식점이 있다고 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Fish_and_chips_blackpool.jpg/500px-Fish_and_chips_blackpool.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=61848","lang":"ko","updated":"2026-10-14T00:43:01.890Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["피시 앤 칩스","피시 앤드 칩스"],"category":"생선·해산물","ingredients":["생선","감자","게"],"descriptionLength":747,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"GB|선데이 로스트","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"선데이 로스트","title":"선데이 로스트","status":"done","desc":"선데이 로스트(영어: Sunday roast)는 영국인들이 주로 일요일에 즐기는 전통적인 식사로, 보통 로스트와, 채소, 요크셔 푸딩, 그레이비 등으로 이루어진다. 영국의 국민 음식 가운데 하나로 여겨진다. 펍에서도 맛볼 수 있으며 영국의 영향을 받은 아일랜드 등의 국가에서도 찾아볼 수 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/A_roast_lamb_dinner_at_Black_Horse_Inn%2C_Nuthurst%2C_West_Sussex_England.jpg/500px-A_roast_lamb_dinner_at_Black_Horse_Inn%2C_Nuthurst%2C_West_Sussex_England.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1595608","lang":"ko","updated":"2026-10-14T00:43:02.605Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["선데이 로스트"],"category":"고기요리","ingredients":["채소"],"descriptionLength":164,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|셰퍼드 파이","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"셰퍼드 파이","title":"셰퍼드 파이","status":"done","desc":"셰퍼드 파이(영어: shepherd's pie) 또는 코티지 파이(영어: cottage pie)는 매시트 포테이토를 올려 구운 고기 파이이다. 다진 양고기로 만든 것은 \"셰퍼드 파이\", 다진 쇠고기로 만든 것은 \"코티지 파이\"라 부른다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Shepherd%27s_Pie_%288227698373%29.jpg/500px-Shepherd%27s_Pie_%288227698373%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1822377","lang":"ko","updated":"2026-10-14T00:43:03.321Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["셰퍼드 파이"],"category":"고기요리","ingredients":["쇠고기","양고기"],"descriptionLength":132,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|스콘","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"스콘","title":"스콘","status":"done","desc":"스콘(영어: scone)은 스코틀랜드에서 기원한 영국식 소형 퀵 브레드이다. 보통, 밀, 보리, 오트밀을 재료로 하여, 베이킹파우더를 팽창제(발효소) 삼아 써서 만든다. 스콘은 크림 티(다른 말로 데본셔 티)의 기본 구성 요소이다.\n상업적으로 판매되는 스콘은 일반적으로 둥근 모양이다. 집에서 구워지는 스콘은 삼각형, 원형, 입방체 등 여러 다양한 모양이다. 많은 사람들이 집에서 스콘을 만들 때는 요리책을 보고 만들기 보다 집안 고유의 방법을 따른다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Scones_cream_jam.jpg/500px-Scones_cream_jam.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=281160","lang":"ko","updated":"2026-10-14T00:43:03.932Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["스콘"],"category":"빵·밀가루","ingredients":[],"descriptionLength":253,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|해기스","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"해기스","title":"해기스","status":"done","desc":"해기스(영어: haggis, 스코틀랜드 게일어: taigeis)는 양이나 염소, 송아지의 내장이 포함된 푸딩의 일종으로, 양이나 염소, 송아지 등의 내장을 다진 양파, 오트밀, 쇠기름, 향신료, 소금 등과 섞은 뒤 그 위장에 넣어서 삶은 요리이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Haggis.JPG/500px-Haggis.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=381055","lang":"ko","updated":"2026-10-14T00:43:04.650Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["해기스"],"category":"고기요리","ingredients":["양파","게"],"descriptionLength":138,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|애프터눈 티","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"애프터눈 티","title":"티 (식사)","status":"candidate","desc":"티(영어: tea→차)는 예전부터 차 자체뿐만 아니라 그것을 이용한 여러 가지 식사도 포함하는 포괄적인 용어로 사용되어 왔다. 19세기, 가정경제학에 대한 책을 많이 읽은 이사벨라 비톤은 다양한 종류의 애프터눈 티를 설명하고 고풍스러운 차, 재택에서의 차, 가족끼리의 차, 고급스러운 차를 제공하였다.\n티타임(영어: teatime)은 영국의 전통문화이며 늦은 오후 ~ 이른 저녁 사이 먹는 차를 이용한 식사이다. 식사로서의 차는 영국, 아일랜드 및 일부 영연방 국가와 관련되어 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Afternoon_meal_in_Tiffin.jpg/500px-Afternoon_meal_in_Tiffin.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=978447","lang":"ko","updated":"2026-10-14T00:43:05.371Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["애프터눈 티","티 (식사)"],"category":"음료·소스","ingredients":[],"descriptionLength":270,"categoryOriginal":"수프·국물","extraCategories":["디저트·과자"]},{"id":"GB|잉글리시 브렉퍼스트","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"잉글리시 브렉퍼스트","title":"잉글리시 브렉퍼스트","status":"done","desc":"잉글리시 브렉퍼스트(영어: English breakfast)는 잉글랜드식 아침 식사이다. 풀 잉글리시 브랙퍼스트(full English breakfast)라는 이름으로도 불리는데, 여러 요리가 큰 접시를 가득 채운 모양에서 비롯된 이름이다. 프라이 업(fry-up)이라는 별칭도 있는데, 달걀, 베이컨, 소시지, 빵 등 다양한 재료를 모두 굽기 때문에 생긴 이름이다.\n유럽대륙의 대다수 국가들이 아침과 점심을 간단히 먹고 저녁을 푸짐하게 먹는 것과는 대조적으로 영국에서는 아침을 푸짐하고 든든하게 먹고 점심과 저녁을 간단하게 먹는 식문화 전통이 있다. 이런 전통은 대영제국의 황금기였던 빅토리아 여왕 시대(1837~1901)에 탄생했다. 19세기 중반에 들어 산업혁명에 따른 경제 발전으로 생활에 여유가 생긴 영국의 중산층과 유산층은 아침식사를 푸짐하고 여유있게 먹기 시작했다. 이것이 정착되어 1950년대에 들어서는 영국인들의 절반 정도가 잉글리시 브렉퍼스트를 즐겼으며, 이 같은 인기에 힘입어 호텔과 카페, 레스토랑에서도 판매되기 시작하였다.\n베이컨, 달걀, 토마토, 버섯, 빵, 버터, 소시지 등이 식탁에 올라온다. 블랙 푸딩, 베이크트 빈즈, 버블 앤드 스퀴크와 해시 브라운도 포함되는 경우가 많으며 주로 홍차와 함께 먹는다.\n오늘날에는 빵이나 시리얼 등의 간소한 메뉴를 선호하기도 하지만, 주말에는 전통적인 잉글리시 브랙퍼스트로 푸짐하게 차려 먹곤 한다. 또한 호텔 등의 숙박업소, ‘올데이브랙퍼스트(all-day-breakfast)’라는 문구를 내건 레스토랑이나 카페, 펍(pub) 등에서도 잉글랜드 지역 전통의 아침식사를 쉽게 맛 볼 수 있다.\n웨일즈, 스코틀랜드, 아일랜드에서는 각 지역마다 조금씩 다른 형태의 아침식사가 발전하였다.\n현대들어 영국에서 제조업이 쇠퇴하고 사무 노동자가 증가하면서 1000kcal가 넘는 잉글리시 브랙퍼스트를 기피하는 사람들도 많이 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Englishbreakfast.jpg/500px-Englishbreakfast.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1835905","lang":"ko","updated":"2026-10-14T00:43:06.086Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["잉글리시 브렉퍼스트"],"category":"기타·전통요리","ingredients":["토마토","달걀","버터","게","빵"],"descriptionLength":942,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|샌드위치","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"샌드위치","title":"샌드위치","status":"done","desc":"샌드위치(sandwich)는 얇게 썬 빵 조각 사이에 육류나 채소류 등을 끼워서 먹는 간편한 식사 대용 빵을 말한다. 빵 사이에는 햄, 채소, 치즈, 잼 등 다양한 식재료를 넣으며, 통상 빵에는 열을 가하지 않으나 버터, 기름, 또는 다른 대체물, 혹은 전통적인 양념이나 소스 등을 발라서 풍미와 식감을 높이는 방식을 사용하기도 한다. 샌드위치는 흔히 학교나 직장에서 먹는 점심을 위해, 도시락 통이나 갈색 종이에 넣어서 가져가는 간편 대용식에 속한다.\n이 음식의 기원으로 볼 수 있는 유사한 형태가 고대로부터 많이 존재한다. 다만 오늘날 형태의 샌드위치는 18세기 영국의 4대 샌드위치 백작에 의해 만들어졌고, 이름은 또한 그의 이름으로부터 유래되었다는 것이 전설이다.\n샌드위치는 크게 빵 위에 재료를 올려놓는 오픈 샌드위치(Open sandwich)와 빵과 빵 사이에 속을 채워넣는 클로즈드 샌드위치(Closed sandwich)로 나뉜다. 일반적으로는 샌드위치라고 하면 이 클로즈드 샌드위치를 가리킨다. 또 샌드위치의 재료로 쓰는 빵을 구워서 만든 토스트 사이에 속을 채워넣는 핫 샌드위치(hot sandwich)도 있는데 이 경우는 보통 구운 빵을 가리키는 토스트라고 부르기도 한다.\n한국에서는 미국형 식빵을 미리 잘라놓은 두께 1cm 가량의 정사각형 빵을 많이 사용한다. 미국형 식빵이란 반죽을 굽는 틀에 뚜껑을 닫고 구워 사면이 편평하고 상자 모양을 가지고 있는 빵을 말한다. 샌드위치의 모양은 정해진 것이 아니며, 둥근 모양의 빵을 사용하는 햄버거와는 외관이나 여러 가지 차이가 있고, 빵을 구울 경우 토스트로 분류하는 등 차이점이 있다. 빵을 버터, 마가린 등을 두른 팬 위에서 굽지 않고 안쪽에 넣는 고기 등을 직접 만지지 않기 때문에 손으로 직접 집어 먹어도 손에 기름 성분이 묻지 않는다.","image":"https://upload.wikimedia.org/wikipedia/commons/2/24/Bologna_sandwich.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=144930","lang":"ko","updated":"2026-10-14T00:43:06.803Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["샌드위치"],"category":"빵·밀가루","ingredients":["치즈","버터","게","채소","빵"],"descriptionLength":900,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"DE|브라트부르스트","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"브라트부르스트","title":"브라트부르스트","status":"candidate","desc":"브라트부르스트(독일어: Bratwurst) 또는 브라트부어스트는 송아지고기, 쇠고기 또는 가장 일반적으로 돼지고기로 만든 독일 소시지 유형이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/German_Bratw%C3%BCrste.jpg/500px-German_Bratw%C3%BCrste.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2270929","lang":"ko","updated":"2026-10-14T00:43:07.519Z","verification":"","risk":"재검토","reasons":["설명 부족"],"aliases":["브라트부르스트"],"category":"고기요리","ingredients":["돼지고기","쇠고기"],"descriptionLength":80,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"DE|프레첼","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"프레첼","title":"브레첼","status":"candidate","desc":"브레첼(독일어: Brezel)은 매듭 모양으로 만든 독일식 빵이다. 독일, 오스트리아, 스위스 등 독일어 사용 국가에서 흔히 주식으로 먹는 빵이며, 프랑스의 알자스 지방에서도 즐겨 먹는다. 같은 모양의 미국식 과자가 프레츨(영어: pretzel)로 불리기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/BrezelnSalz02_%28cropped%29.JPG/500px-BrezelnSalz02_%28cropped%29.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=151734","lang":"ko","updated":"2026-10-14T00:43:08.133Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["프레첼","브레첼"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":147,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"DE|자우어브라텐","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"자우어브라텐","title":"자우어브라텐","status":"done","desc":"자우어브라텐(독일어: Sauerbraten)은 독일의 고기 요리이다. 쇠고기 등을 포도주 마리네이드에 재어 뒀다가 냄비 로스트 방식으로 익힌 음식이며, 지역에 따라 조금씩 달리 만든다. 독일의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/K%C3%B6stritzer_Schwarzbierbraten_2.JPG/500px-K%C3%B6stritzer_Schwarzbierbraten_2.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=873168","lang":"ko","updated":"2026-10-14T00:43:08.854Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["자우어브라텐"],"category":"고기요리","ingredients":["쇠고기"],"descriptionLength":127,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"DE|슈페츨레","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"슈페츨레","title":"슈페츨레","status":"done","desc":"슈페츨레(Spätzle)는 밀가루에 달걀과 소금을 넣어 만드는 달걀 국수 또는 덤플링이다. 고기요리와 같은 메인 요리의 사이드 메뉴로 곁들여 서빙되는 경우가 많다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Sp%C3%A4tzle-02.jpg/500px-Sp%C3%A4tzle-02.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=873205","lang":"ko","updated":"2026-10-14T00:43:09.567Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["슈페츨레"],"category":"국수·면","ingredients":["밀가루","달걀","국수"],"descriptionLength":91,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"DE|슈니첼","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"슈니첼","title":"슈니첼","status":"done","desc":"슈니첼(독일어: Schnitzel)은 독일어권에서 고기망치 등으로 얇게 두드려 편 고기를 일컫는 말이다. 보통 튀김옷을 입혀 기름에 튀겨 먹는다.\n독일어권 밖에서는 비너 슈니첼과 같이 튀김옷 커틀릿 형태로 튀겨낸 슈니첼 요리를 일컫는 경우가 많다. 송아지고기, 양고기, 닭고기, 쇠고기, 칠면조고기, 돼지고기 등 다양한 고기를 재료로 사용하며, 프랑스 요리인 에스칼로프와 유사한 형태를 갖고 있다.\n이름의 유래는 '음식을 얇게 썬 조각'라는 의미의 중세 고지 독일어의 단어인 Sniz에서 파생된 Snitzel이며, 19세기 비너 슈니첼이 대중적으로 펴지며 본격적으로 자리잡았다.\n슈니첼은 사용하는 재료에 따라서 송아지 고기로 만든 슈니첼 이외에도 돼지고기로 만든 슈바인슈니첼, 닭고기로 만든 후너슈니첼 등 다양한 갈래로 나뉜다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Schweineschnitzel.jpg/500px-Schweineschnitzel.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1322316","lang":"ko","updated":"2026-10-14T00:43:10.284Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["슈니첼"],"category":"고기요리","ingredients":["김","돼지고기","쇠고기","닭고기","게"],"descriptionLength":407,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"DE|슈바르츠발트 케이크","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"슈바르츠발트 케이크","title":"슈바르츠발트 케이크","status":"candidate","desc":"슈바르츠발트 케이크(Schwarzwald cake)는 독일의 초콜릿 케이크/토르테이다. \"검은 숲\"이라고도 불리는 슈바르츠발트의 이름을 땄다. 독일에서는 \"검은 숲 체리 토르테\"라는 뜻인 슈바르츠벨더 키르슈토르테(독일어: Schwarzwälder Kirschtorte)로 불린다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Black_Forest_gateau.jpg/500px-Black_Forest_gateau.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1840858","lang":"ko","updated":"2026-10-14T00:43:11.001Z","verification":"","risk":"일치 후보","reasons":[],"aliases":["슈바르츠발트 케이크"],"category":"디저트·과자","ingredients":[],"descriptionLength":156,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GR|무사카","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"무사카","title":"무사카","status":"done","desc":"무사카(moussaka)는 그리스, 레반트, 발칸반도, 이집트, 튀르키예에서 먹는 전통 채소 요리이다. 지역에 따라 여러 가지 형태가 있으나, 주로 가지나 감자를 기반으로 만드는 음식이며, 대개 다진 고기가 들어가지만 채식 버전도 존재한다. 1920년대에 그리스 요리사 니콜라오스 첼레멘데스가 만든 버전이 유명하며, 이 버전이 그리스의 국민 음식이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/MussakasMeKolokithakiaKePatates.jpg/500px-MussakasMeKolokithakiaKePatates.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=534742","lang":"ko","updated":"2026-10-14T00:43:11.719Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["무사카"],"category":"고기요리","ingredients":["감자","채소"],"descriptionLength":200,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"GR|수블라키","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"수블라키","title":"수블라키","status":"done","desc":"수블라키(그리스어: σουβλάκι) 또는 칼라마키(그리스어: καλαμάκι)는 그리스의 꼬치구이이다. 꼬챙이에 고기와 때때로 채소를 꿰어 구워 만드는 요리로, 그리스 외에도 키프로스에서도 즐겨 먹는다. 그리스의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Souvlaki_457.jpg/500px-Souvlaki_457.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=873728","lang":"ko","updated":"2026-10-14T00:43:12.437Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["수블라키"],"category":"고기요리","ingredients":["채소"],"descriptionLength":139,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"GR|그릭 샐러드","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"그릭 샐러드","title":"과일 샐러드","status":"candidate","desc":"과일 샐러드(Fruit salad)는 과일이 들어간 샐러드이다.\n과일뿐만 아니라, 콘플레이크, 드레싱, 요구르트 등을 곁들여 먹기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Fruktsallad_%28Fruit_salad%29.jpg/500px-Fruktsallad_%28Fruit_salad%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=915355","lang":"ko","updated":"2026-10-14T00:43:13.152Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치","설명 부족"],"aliases":["그릭 샐러드","과일 샐러드"],"category":"채소·샐러드","ingredients":[],"descriptionLength":77,"categoryOriginal":"채소·샐러드","extraCategories":[]},{"id":"GR|차치키","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"차치키","title":"AC 키에보베로나","status":"candidate","desc":"아소차치오네 칼초 키에보베로나(Associazione Calcio ChievoVerona S.r.l.)는 보통 키에보베로나(ChievoVerona) 또는 키에보(Chievo)라고 불리는 이탈리아의 축구단으로 베네토주 베로나를 연고로 한다.\n1929년 창단했고 2024년에 재창단 했다. 키에보는 이탈리아 축구에 있어서 유일무이한 역사를 기록한 구단으로 지역 리그에서 시작하여 이탈리아 축구 리그 피라미드를 올라와 세리에 A와 UEFA 클럽 대항전까지 진출하는 역사를 가진 유일한 구단이다.","image":"","url":"https://ko.wikipedia.org/?curid=208953","lang":"ko","updated":"2026-10-14T00:43:13.868Z","verification":"","risk":"차단 권고","reasons":["기존 보고서의 오검색/상위 개념","비음식 주제 가능성","등록 이름·별칭과 검색 제목 불일치"],"aliases":["차치키","AC 키에보베로나","Tzatziki","τζατζίκι"],"category":"음료·소스","ingredients":[],"descriptionLength":273,"categoryOriginal":"채소·샐러드","extraCategories":["채소·샐러드"]},{"id":"GR|스파나코피타","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"스파나코피타","title":"스파나코피타","status":"candidate","desc":"스파나코피타(그리스어: Σπανακόπιτα)는 시금치와 치즈, 달걀 등을 섞어 만든 그리스의 페이스트리이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/23/Spanikopita_Greek_dish.jpg/500px-Spanikopita_Greek_dish.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=862348","lang":"ko","updated":"2026-10-14T00:43:14.584Z","verification":"","risk":"재검토","reasons":["설명 부족"],"aliases":["스파나코피타"],"category":"빵·밀가루","ingredients":["치즈","달걀"],"descriptionLength":61,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"GR|돌마데스","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"돌마데스","title":"포도잎말이","status":"candidate","desc":"포도잎말이는 포도잎에 소를 넣고 말아 만든 음식이다. 사르마나 돌마의 일종이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Sarma.jpg/500px-Sarma.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2279686","lang":"ko","updated":"2026-10-14T00:43:15.199Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치","설명 부족"],"aliases":["돌마데스","포도잎말이"],"category":"채소·샐러드","ingredients":[],"descriptionLength":44,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"TR|케밥","countryCode":"TR","country":"튀르키예","flag":"🇹🇷","name":"케밥","title":"케밥","status":"done","desc":"케밥(튀르키예어: kebap 케바프[*])은 서남아시아, 중앙아시아, 남아시아, 북아프리카의 구운 고기 요리이다. 꼬치구이인 시시 케밥, 세로 회전구이인 되네르 케밥 등 외에도 고기를 썰거나 다져서 구운 여러 가지 요리가 \"케밥\"이라 불린다. 튀르키예의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Lula_kebab_2.jpg/500px-Lula_kebab_2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=341036","lang":"ko","updated":"2026-10-14T00:43:15.915Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["케밥"],"category":"고기요리","ingredients":["밥"],"descriptionLength":161,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"TR|되네르","countryCode":"TR","country":"튀르키예","flag":"🇹🇷","name":"되네르","title":"되네르","status":"done","desc":"되네르(튀르키예어: döner) 또는 되네르 케밥(튀르키예어: döner kebap 되네르 케바프[*])은 튀르키예의 세로 회전구이 케밥이다. 튀르키예의 국민 음식 가운데 하나로 여겨진다. 독일에서도 국민 음식 가운데 하나로 여겨지며, 도너(독일어: Döner)라고 불린다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/D%C3%B6ner_Kebab_in_Istanbul.jpg/500px-D%C3%B6ner_Kebab_in_Istanbul.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=789228","lang":"ko","updated":"2026-10-14T00:43:16.633Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["되네르"],"category":"고기요리","ingredients":["밥"],"descriptionLength":153,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"TR|만티","countryCode":"TR","country":"튀르키예","flag":"🇹🇷","name":"만티","title":"만트","status":"candidate","desc":"만트(튀르키예어: mantı)는 여러 튀르크계 민족의 전통 음식이다. 만두류 음식의 하나로, 튀르키예 요리 뿐만 아니라 캅카스 요리, 중앙아시아 요리, 헤자즈 요리, 칭전 요리에서도 나타난다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/%D0%9C%D0%B0%D0%BD%D1%82%D1%8B.jpg/500px-%D0%9C%D0%B0%D0%BD%D1%82%D1%8B.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1368243","lang":"ko","updated":"2026-10-14T00:43:17.350Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["만티","만트"],"category":"빵·밀가루","ingredients":[],"descriptionLength":107,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"TR|피데","countryCode":"TR","country":"튀르키예","flag":"🇹🇷","name":"피데","title":"이스켄데르 케밥","status":"candidate","desc":"이스켄데르 케밥(튀르키예어: İskender kebap 이스켄데르 케바프[*]) 또는 이스켄데르 되네르(튀르키예어: iskender döner)는 튀르키예 서북부의 도시인 부르사의 요리이다. 이스켄데르 케밥은 19세기 말에 처음으로 요리를 발명한 이스켄데르 에펜디의 이름을 따서 지어졌다.\n이스켄데르 케밥은 일종의 되네르 케밥으로, 얇게 썬 양고기에 토마토 소스를 얹고, 그 위에 요거트와 양 치즈를 얹은 후, 피데 빵을 함께 서빙하는 요리다.\n음식이 서빙된 후에, 웨이터가 녹인 버터를 끼얹어 주는 것이 특징이다. 원통 모양의 쾨프테도 종종 같이 제공된다.\n\"케밥츠 이스켄데르\"라는 상표는 이스켄데로을루(İskenderoğlu) 가족에 의해 상표등록이 되어 있다. 이스켄데르 케밥은 전국의 많은 식당에서 \"이스켄데르 케밥\", \"부르사 케밥\" 같은 이름으로 판매가 되고 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/%C4%B0skender_kebap.JPG/500px-%C4%B0skender_kebap.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1616606","lang":"ko","updated":"2026-10-14T00:43:18.068Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["피데","이스켄데르 케밥"],"category":"빵·밀가루","ingredients":["토마토","치즈","버터","게","양고기"],"descriptionLength":434,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"TR|바클라바","countryCode":"TR","country":"튀르키예","flag":"🇹🇷","name":"바클라바","title":"바클라바","status":"candidate","desc":"바클라바(튀르키예어: baklava)는 튀르키예를 비롯한 서아시아, 캅카스, 중앙아시아, 동남유럽, 북아프리카 지역에서 즐겨 먹는 달콤한 페이스트리이다. 유프카와 견과류, 시럽으로 만드는 오스만 후식이며,운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Baklavas.jpg/500px-Baklavas.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=170386","lang":"ko","updated":"2026-10-14T00:43:18.787Z","verification":"","risk":"일치 후보","reasons":[],"aliases":["바클라바"],"category":"디저트·과자","ingredients":[],"descriptionLength":126,"categoryOriginal":"디저트","extraCategories":[]},{"id":"TR|메네멘","countryCode":"TR","country":"튀르키예","flag":"🇹🇷","name":"메네멘","title":"메네멘","status":"done","desc":"메네멘은 달걀, 양파, 토마토, 피망에 간 후추, 오레가노, 소금 등의 향신료가 들어간 전통적인 튀르키예 요리이다. 올리브 오일이나 해바라기 유로 요리한다. 샤크슈카와 비슷한 요리이다. 메네멘은 흔히 아침 식사로 먹으며, 빵과 곁들여 차려진다.아침 식사가 아닌 메인 디시로 대접될 때에는 양파를 더 곁들여서 차려진다.","image":"https://upload.wikimedia.org/wikipedia/commons/9/97/MenemenIstanbul.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=1373436","lang":"ko","updated":"2026-10-14T00:43:19.603Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["메네멘"],"category":"달걀·채소","ingredients":["토마토","양파","달걀","빵"],"descriptionLength":177,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"EG|코샤리","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"코샤리","title":"코샤리","status":"done","desc":"코샤리(이집트 아랍어: كشرى)는 이집트의 전통 음식이다. 마카로니와 부순 버미셀리, 스파게티 등의 파스타와 쌀, 렌즈콩을 함께 익힌 요리로, 토마토 소스와 병아리콩, 양파 튀김 등을 토핑해 낸다. 이집트의 국민 음식 가운데 하나로 여겨지며, 흔한 길거리 음식이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Egyptian_food_Koshary.jpg/500px-Egyptian_food_Koshary.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=219306","lang":"ko","updated":"2026-10-14T00:43:20.320Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["코샤리"],"category":"쌀·밥","ingredients":["쌀","김","토마토","양파","콩"],"descriptionLength":153,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"EG|풀 메담메스","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"풀 메담메스","title":"풀 메담메스","status":"done","desc":"풀 메담메스(이집트 아랍어: فول مدمس, 표준 아랍어:  풀 무담마스[*]) 또는 풀(아랍어: فول)은 이집트의 콩 요리이다. 누에콩으로 만든 콩 스튜로, 특히 아침 식사로 인기 있다. 이집트와 수단, 남수단의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Hummus_and_Ful.jpg/500px-Hummus_and_Ful.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1837032","lang":"ko","updated":"2026-10-14T00:43:21.038Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["풀 메담메스"],"category":"콩·유제품","ingredients":["콩"],"descriptionLength":141,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"EG|타메야","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"타메야","title":"팔라펠","status":"candidate","desc":"팔라펠(아랍어: فلافل 팔라필[*])은 중동의 콩 완자이다. 이집트에서는 누에콩으로, 레반트 등지에서는 병아리콩으로 완자를 빚어 튀겨 내는 음식이며, 흔히 길거리 음식으로 먹는다. 이집트, 팔레스타인의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Falafels_2.jpg/500px-Falafels_2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=837129","lang":"ko","updated":"2026-10-14T00:43:21.755Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["타메야","팔라펠"],"category":"튀김·간식","ingredients":["콩"],"descriptionLength":134,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"EG|몰로키야","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"몰로키야","title":"몰로키야","status":"done","desc":"몰로키야(이집트 아랍어: ملوخية, 표준 아랍어: مُلُوخِيَّة 물루키야[*])는 이집트 등지에서 채소로 먹는 장삭황마 잎을 일컫는 말이며, 장삭황마 잎을 주재료로 끓인 음식을 일컫는 말이기도 하다. 이집트의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Molokheya_hi_res.JPG/500px-Molokheya_hi_res.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2468355","lang":"ko","updated":"2026-10-14T00:43:22.470Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["몰로키야"],"category":"수프·국물","ingredients":["채소"],"descriptionLength":142,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"EG|파타","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"파타","title":"파타","status":"candidate","desc":"파타(아랍어: فتح, 영어: Fatah)는 팔레스타인의 정당이다. 팔레스타인 최대 정당 중 하나로 팔레스타인 해방 기구를 주도하고 있다. 1993년 오슬로 협정 이래로 이스라엘과 평화 공존을 추구해 왔으며 양국 방안을 지지한다. 그러나 이스라엘에서 우익 정당인 리쿠드가 집권하고 팔레스타인에 강경책을 펴기 시작한 영향을 받아 2006년 총선에서 급진주의, 무장 투쟁, 이슬람주의 정당인 하마스에 패배했다. 이후 정치 주도권을 두고 파타와 하마스 간에 분쟁이 발생하였으며 현재 하마스는 가자 지구에서, 파타는 서안 지구에서 집권하고 있다.","image":"","url":"https://ko.wikipedia.org/?curid=170042","lang":"ko","updated":"2026-10-14T00:43:23.188Z","verification":"","risk":"일치 후보","reasons":[],"aliases":["파타"],"category":"쌀·밥","ingredients":[],"descriptionLength":301,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"EG|바스부사","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"바스부사","title":"바스부사","status":"done","desc":"바스부사(Basbousa, 이집트 아랍어: بسبوسة, 로마자: basbūsah)는 이집트에서 시작된 달콤한 시럽에 적신 세몰리나 케이크이다. 세몰리나 반죽은 시트 팬에서 구운 다음 오렌지 꽃수, 장미수 또는 단순 시럽으로 달게 하고 일반적으로 다이아몬드(마름모꼴) 모양 또는 사각형으로 자른다. 이 요리는 또한 과거 오스만 제국 대부분 지역에 퍼졌으며 일반적으로 중동 요리, 마그레브 요리, 그리스 요리, 아제르바이잔 요리, 에티오피아 요리 및 기타 여러 요리에서 찾아볼 수 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/Basboosa.jpg/500px-Basboosa.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3662085","lang":"ko","updated":"2026-10-14T00:43:23.903Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["바스부사"],"category":"디저트·과자","ingredients":["게"],"descriptionLength":271,"categoryOriginal":"디저트","extraCategories":[]},{"id":"EG|풀 메다메스","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"풀 메다메스","title":"스트로베리 딜라이트","status":"candidate","desc":"스트로베리 딜라이트(영어: Strawberry delight)는 미국, 특히 남부와 미네소타주의 농촌 지역에서 볼 수 있는 디저트 샐러드이다. 스트로베리 딜라이트는 그레이엄 크래커 크러스트 위에 우유, 휘핑 토핑, 크림 치즈, 딸기 및 딸기 젤라틴을 얹어 만든다. 변형된 형태로는 아이스크림, 통조림 과일(귤이나 파인애플이 사용됨), 마시멜로, 레몬즙, 호두 등의 재료가 포함될 수 있다. 크러스트 재료를 섞어서 팬에 눌러 담고, 크림 형태의 재료들을 섞어서 그 위에 올린다. 딸기 젤라틴 가루에 끓는 물을 붓고 딸기를 섞은 다음, 이 혼합물을 팬에 담긴 크림 층 위에 붓고 냉장고에서 굳힌다.\n스트로베리 딜라이트라는 이름은 쿠키, 케이크, 그리고 비슷하게 분홍빛이 돌고 달콤한 특성을 가진 다른 음식들을 지칭할 때도 사용된다. 스펀지 케이크와 아이스크림을 곁들인 소다 파운틴 버전이 1922년판 《소다 파운틴》(The Soda fountain) 소식지에 소개되기도 했다.\n페르시아 요리에서 스트로베리 딜라이트(deser-e toot farangi)는 바닐라와 장미수(rosewater) 향을 낸 액체 설탕에 딸기를 담가서 만든다. 딸기, 호두 또는 아몬드 오일, 분유를 섞은 재료는 \"스트로베리 딜라이트\" 보습제 피부 크림으로 제안되기도 했다. 스트로베리 딜라이트라는 이름은 비비추속(H. longipes X H. pycnophylla)과 푸크시아 품종에도 붙여졌다. 인도네시아어-영어 독본에도 한 버전이 수록된 바 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Strawberry_Delight.jpg/500px-Strawberry_Delight.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4138371","lang":"ko","updated":"2026-10-14T00:43:24.827Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["풀 메다메스","스트로베리 딜라이트"],"category":"콩·유제품","ingredients":["치즈","우유","게"],"descriptionLength":741,"categoryOriginal":"디저트","extraCategories":[]},{"id":"EG|아이시 발라디","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"아이시 발라디","title":"빵","status":"candidate","desc":"빵(포르투갈어: pão 팡[*], 영어: bread 브레드[*])은 곡식 가루와 물로 된 반죽을 익혀 만든 음식 중 하나이다. 영국의 브리태니커 백과사전에 따르면, “빵을 밀가루와 물로 만들어진 반죽을 구워서 준비한 일반식”이라고 정의하고 있고, 한국 국립국어원 표준국어대사전에서는 “밀가루를 주원료로 하여 소금, 설탕, 버터, 효모 따위를 섞어 반죽하여 발효한 뒤에 불에 굽거나 찐 음식, 서양 사람들의 주 음식”, “먹고 살 양식”으로 정의한다. 한국에서는 빵을 쌀과 함께 식량과 기아를 의미하는 상징적인 시어로 종종 사용되곤 한다.\n거의 대부분 밀가루로 만들지만 쌀, 옥수수, 보리, 감자 등 각종 곡식의 가루로도 만들기도 한다. 발효를 하지 않는 케이크나 쿠키와 혼동되는 경우가 많지만 엄연히 다르다. 가령 몇몇은 머핀 혹은 케이크를 빵이라고 인식하는 경우가 종종 있으나 사실은 비스킷이다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c7/Korb_mit_Br%C3%B6tchen.JPG/500px-Korb_mit_Br%C3%B6tchen.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=66498","lang":"ko","updated":"2026-10-14T00:43:25.542Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["아이시 발라디","빵"],"category":"빵·밀가루","ingredients":["쌀","감자","밀가루","버터","옥수수"],"descriptionLength":448,"categoryOriginal":"디저트","extraCategories":[]},{"id":"ZA|보보티","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"보보티","title":"보보티","status":"done","desc":"보보티(아프리칸스어: bobotie)는 남아프리카 공화국의 고기 요리이다. 양념한 다진 고기에 달걀 토핑을 올린 뒤 오븐에 구워 만든 음식으로, 남아프리카의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Bobotie%2C_South_African_dish.jpg/500px-Bobotie%2C_South_African_dish.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1866928","lang":"ko","updated":"2026-10-14T00:43:26.259Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["보보티"],"category":"고기요리","ingredients":["달걀"],"descriptionLength":107,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ZA|브라이","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"브라이","title":"브라이","status":"done","desc":"브라이(아프리칸스어: braai)는 남아프리카 지역의 바비큐이다. 남아프리카 공화국 아프리카너 전통이지만, 나미비아, 레소토, 보츠와나, 잠비아, 짐바브웨 등 주변국에도 브라이 문화가 널리 퍼져 있다. 남아프리카 공화국의 국민 음식 가운데 하나이기도 하다. 남아프리카 공화국에서는 매년 9월 24일을 \"브라이의 날\"로 기념한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fe/Backyard_Braai.jpg/500px-Backyard_Braai.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2885634","lang":"ko","updated":"2026-10-14T00:43:26.977Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["브라이"],"category":"고기요리","ingredients":[],"descriptionLength":183,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"ZA|빌통","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"빌통","title":"빌통","status":"done","desc":"빌통(아프리칸스어: biltong)는 나미비아, 남아프리카 공화국, 짐바브웨의 염지·건조식품이다. 쇠고기와 사냥 고기부터 필레까지, 여러 종류의 고기를 근섬유 결대로 채썰거나 결 반대 방향으로 얇게 저며 만든다. 과거에는 스프링복이나 큰쿠두 등 사냥감을 활용해 만들었으나, 오늘날은 쇠고기와 타조고기를 많이 쓴다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Sliced_Biltong.jpg/500px-Sliced_Biltong.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1837817","lang":"ko","updated":"2026-10-14T00:43:27.690Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["빌통"],"category":"고기요리","ingredients":["쇠고기","게"],"descriptionLength":175,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ZA|버니 차우","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"버니 차우","title":"버니 차우","status":"candidate","desc":"버니 차우(영어: bunny chow) 또는 버니(영어: bunny)는 남아프리카 공화국의 빵 요리이다.","image":"https://upload.wikimedia.org/wikipedia/commons/7/70/Quarter_Mutton_Bunny_Chow.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=1866910","lang":"ko","updated":"2026-10-14T00:43:28.409Z","verification":"","risk":"재검토","reasons":["설명 부족"],"aliases":["버니 차우"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":58,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"ZA|보어워스","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"보어워스","title":"코스워스 DFV","status":"candidate","desc":"DFV 엔진은 포뮬러 원 자동차 경주를 위해 코스워스가 제작한 내연기관이다. DFV는 더블 포 밸브(Double Four Valve)의 약자로, 실린더 당 4개의 밸브가 있었던 4기통 FVA 엔진의 V8 엔진으로 개발되었기 때문에 붙은 이름이다.\nDFV 엔진은 1967년 콜린 채프먼의 팀 로터스에서 개발하였으며, 미국의 자동차 제조사인 포드가 지원하였다. DFV 엔진은 1960년대 후반부터 1980년대 중반까지 포뮬러 원에서 널리 사용되었으며 자체 제작한 엔진을 사용했던 페라리, 알파 로메오, 르노, BRM과 마트라 등의 팀을 제외한 팀들에서 채용하였다. 또한 DFV 엔진의 변형 엔진들이 CART, 포뮬러 3000, 스포츠카 레이싱 등 다른 유형의 경주에서 사용되었다.\nDFV 엔진은 90도, 2,993cc V8 엔진으로 보어와 스트로크는 85.77 × 64.90 mm이다. 엔진은 400bhp 이상을 지속적으로 출력할 수 있으며 9,000rpm에서 407bhp에 도달하고, 7,000rpm에서 370 N⋅m의 토크를 발생시킨다. 후기에 사용된 DFV 엔진은 11,200rpm에서 최대 510bhp를 출력하였다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Cosworth_DFV.jpg/500px-Cosworth_DFV.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3873233","lang":"ko","updated":"2026-10-14T00:43:29.125Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["보어워스","코스워스 DFV"],"category":"고기요리","ingredients":[],"descriptionLength":570,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ZA|밀크타르트","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"밀크타르트","title":"동티모르 요리","status":"candidate","desc":"동티모르 요리(東Timor 料理, 테툼어: hahaan Timor 하한 티모르, 포르투갈어: cozinha timorense 코지냐 티모렌스[*])는 해양 동남아시아에 있는 동티모르의 요리이다. 토착 오스트로네시아 식문화 전통과 포르투갈 식민 지배의 유산이 융합된 독특한 형태로, 그 외에도 말레이 요리 등 다양한 영향을 받아 형성되었다.\n동티모르에서 음식은 의례와 가족 공동체 생활에서 중요한 역할을 하며, 조리법은 주로 구전을 통해 전승된다. 페이조아다나 파스텔 드 나타 같은 포르투갈 요리는 현지 식재료를 활용하여 재해석되었다.\n농업 중심의 생계 구조는 식문화 전반에 깊이 반영되어 있으며, 동물 사육과 어업도 주요한 식량 공급원이다. 쌀, 옥수수, 카사바, 토란, 고구마 등 주식 작물과 콩류, 닭고기와 돼지고기, 생선, 열대 과일 등이 주된 식재료이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1d/IkanPepes.JPG/500px-IkanPepes.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2869911","lang":"ko","updated":"2026-10-14T00:43:29.843Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["밀크타르트","동티모르 요리"],"category":"디저트·과자","ingredients":["쌀","생선","돼지고기","닭고기","콩"],"descriptionLength":426,"categoryOriginal":"디저트","extraCategories":[]},{"id":"PH|아도보","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"아도보","title":"아도보 (스페인 음식)","status":"done","desc":"아도보 (스페인어: Adobo, 재우기, 소스 (음식) 또는 양념)는 음식의 맛을 보존하고 향상시키기 위해 다양한 파프리카 가루, 오레가노, 소금, 마늘, 식초로 구성된 육수(또는 소스)에 음식을 담그는 것을 말한다. 포르투갈 요리의 변형은 카르느 드 비냐달류스로 알려져 있다. 이베리아반도(스페인 요리 및 포르투갈 요리)에 고유한 이 관행은 라틴아메리카 요리, 그리고 아프리카와 아시아의 스페인 및 포르투갈 식민지에서 널리 채택되었다.\n필리핀에서는 식민지 시대 스페인인들이 섬의 식초를 사용하는 다른 원주민 요리 방식에 아도보라는 이름을 붙였다. 비슷하지만, 이것은 스페인의 영향과 별개로 발전했다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Lomo_en_adobo-2009.jpg/500px-Lomo_en_adobo-2009.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4052475","lang":"ko","updated":"2026-10-14T00:43:30.559Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["아도보","아도보 (스페인 음식)"],"category":"고기요리","ingredients":["마늘"],"descriptionLength":336,"categoryOriginal":"음료·소스","extraCategories":[]},{"id":"PH|시니강","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"시니강","title":"시니강","status":"candidate","desc":"시니강(타갈로그어: sinigang)는 필리핀의 국이다. 타마린드 등으로 신 맛을 낸다. 필리핀의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Sinigang_na_Baboy.jpg/500px-Sinigang_na_Baboy.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1866701","lang":"ko","updated":"2026-10-14T00:43:31.278Z","verification":"","risk":"재검토","reasons":["설명 부족"],"aliases":["시니강"],"category":"수프·국물","ingredients":[],"descriptionLength":74,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"PH|레촌","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"레촌","title":"애저 (돼지)","status":"candidate","desc":"애저(-豬)는 어린 새끼 돼지이다. 고기로 먹을 어린 돼지를 가리키기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Madrid_-_Mercado_de_la_Cebada4.jpg/500px-Madrid_-_Mercado_de_la_Cebada4.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1866036","lang":"ko","updated":"2026-10-14T00:43:31.993Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치","설명 부족"],"aliases":["레촌","애저 (돼지)"],"category":"고기요리","ingredients":[],"descriptionLength":43,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"PH|판싯","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"판싯","title":"판싯","status":"done","desc":"판싯(필리핀어: pansit, 영어: pancit)은 필리핀의 국수 요리이다. 볶음국수인 경우가 많으나 국물국수 등 다른 방식으로 조리하기도 한다. 쌀국수, 달걀 국수 등 여러 가지 국수가 사용되며, 흔히 칼라만시를 곁들여 낸다. 필리핀의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/5058Baliuag_Bulacan_Landmarks_during_the_2020_coronavirus_pandemic_24.jpg/500px-5058Baliuag_Bulacan_Landmarks_during_the_2020_coronavirus_pandemic_24.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1984196","lang":"ko","updated":"2026-10-14T00:43:32.709Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["판싯"],"category":"국수·면","ingredients":["쌀","달걀","국수"],"descriptionLength":153,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"PH|룸피아","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"룸피아","title":"룬삐앙","status":"candidate","desc":"룬삐앙(민난어: lūn-piáⁿ, 중국어 간체자: 润饼, 정체자: 潤餅, 병음: rùnbǐng 룬빙[*])은 동남아시아에서 즐겨 먹는 푸젠·차오저우식 롤 요리이다. 중국의 푸젠과 차오저우, 그리고 이곳 출신 이주민이 많은 동남아시아 국가에서 먹는 청명절 음식이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/%E6%BD%A4%E9%A4%85_%286451823745%29.jpg/500px-%E6%BD%A4%E9%A4%85_%286451823745%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1981834","lang":"ko","updated":"2026-10-14T00:43:33.427Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["룸피아","룬삐앙"],"category":"튀김·간식","ingredients":[],"descriptionLength":147,"categoryOriginal":"빵·만두","extraCategories":["빵·밀가루"]},{"id":"PH|할로할로","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"할로할로","title":"할로할로","status":"done","desc":"할로할로(타갈로그어: halo-halo) 또는 할루할로(타갈로그어: haluhalo)는 빙수와 비슷한 필리핀의 후식이다. 필리핀의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Halo_halo1.jpg/500px-Halo_halo1.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1969072","lang":"ko","updated":"2026-10-14T00:43:34.143Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["할로할로"],"category":"디저트·과자","ingredients":[],"descriptionLength":92,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"SG|하이난 치킨라이스","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"하이난 치킨라이스","title":"하이난 치킨라이스","status":"done","desc":"하이난 치킨 라이스(영어: Hainanese chicken rice 하이나니즈 치킨 라이스[*]; 중국어 (싱가포르): 海南鸡饭, hǎinán jīfàn 하이난 지판[*])는 삶은 닭고기와 닭을 삶은 육수에 지은 밥을 양념하여 함께 내는 음식으로 보통 칠리 소스와 오이 고명을 함께 제공한다.\n이 요리는 중국 남부 하이난에서 남양(중국어: 南洋), 즉 동남아시아로 이주한 이민자들에 의해 탄생한 음식으로, 하이난의 원창닭 요리에서 유래한다. 하이난 치킨라이스가 처음 탄생한 곳은 싱가포르로 여겨지며, 싱가포르 전역의 푸드코트나 노점에서 쉽게 찾아볼 수 있는 싱가포르의 대표적인 국민 음식 중 하나이다.\n또한 하이난 출신 사람들이 이주한 동남아시아의 여러 지역에서도 비슷한 형태의 요리를 찾아볼 수 있다. 특히 인도네시아, 말레이시아, 태국, 베트남 등지에서도 하이난 치킨라이스는 널리 사랑받는 일상적인 음식이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/71/Hainanese_Chicken_Rice.jpg/500px-Hainanese_Chicken_Rice.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1822414","lang":"ko","updated":"2026-10-14T00:43:34.863Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["하이난 치킨라이스"],"category":"쌀·밥","ingredients":["닭고기","치킨","게","밥"],"descriptionLength":454,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"SG|칠리크랩","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"칠리크랩","title":"칠리 크랩","status":"done","desc":"칠리 크랩(영어: chilli crab)는 싱가포르의 게 요리이다. 토마토와 고추가 들어간 매운 소스를 곁들인 게 요리로, 1960년대에 싱가포르에서 만들어져 인기를 얻었으며, 이웃한 말레이시아에서도 즐겨 먹는다. 싱가포르의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Chilli_crab-02.jpg/500px-Chilli_crab-02.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=115504","lang":"ko","updated":"2026-10-14T00:43:35.577Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["칠리크랩","칠리 크랩"],"category":"생선·해산물","ingredients":["토마토","게"],"descriptionLength":145,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"SG|락사","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"락사","title":"락사","status":"done","desc":"락사(자위: لقسا‎; 중국어: 叻沙)는 동남아시아에서 인기 있는 매운 국수 요리이다. 락사는 다양한 종류의 국수, 가장 일반적으로 두꺼운 쌀국수와 닭고기, 새우 또는 생선과 같은 토핑으로 구성된다. 락사의 대부분의 변형은 풍부하고 매운 코코넛 커리 수프 또는 타마린드나 아삼 길루구르와 같은 신맛을 내는 재료로 양념한 육수로 준비된다.\n페라나칸 중국 요리에서 유래한 락사 레시피는 일반적으로 싱가포르, 인도네시아, 말레이시아에서 제공된다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Nyonya_Laksa.jpg/500px-Nyonya_Laksa.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=146600","lang":"ko","updated":"2026-10-14T00:43:36.294Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["락사"],"category":"국수·면","ingredients":["쌀","생선","닭고기","새우","코코넛"],"descriptionLength":247,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"SG|카야토스트","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"카야토스트","title":"카야 토스트","status":"done","desc":"카야 토스트(영어: Kaya Toast)는 카야잼을 넣어 만든 토스트이다. 설탕이나 코코넛 밀크, 판단잎, 때때로 마가린이나 버터를 토핑으로 얹어 먹기도 한다. 토스트로서 나오는 경우가 많지만 일부는 크래커로 간주한다. 싱가포르의 국민 요리 중 하나이다.\n싱가포르에서 카야 토스트는 아주 유명하며, 일부 지역에서는 카야 토스트를 주식으로 삼는다. 살짝 익힌 계란을 카야 토스트와 함께 곁들여 먹기도 한다. 싱가포르와 말레이시아의 많은 커피 하우스에서 카야 토스트를 커피와 함께 팔기 때문에 이 지역의 사람들은 커피와 함께 카야 토스트를 먹는 경우가 많다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Dessert_Merlion_Singapore_Cafe_Kaya_Toast.jpg/500px-Dessert_Merlion_Singapore_Cafe_Kaya_Toast.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1235072","lang":"ko","updated":"2026-10-14T00:43:37.010Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["카야토스트","카야 토스트"],"category":"빵·밀가루","ingredients":["버터","코코넛"],"descriptionLength":310,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"SG|바쿠테","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"바쿠테","title":"바쿠테","status":"done","desc":"바쿠테(말레이어: bak kut teh, 중국어: 肉骨茶)는 돼지갈비를 국물에 고아 만든 음식이다. 말레이시아와 싱가포르에 뿌리를 내린 중국 복건성 출신 이민자들에 의해서 소개되었다. 두 나라 외에 태국 남부와 인도네시아의 리아우 섬 주민들도 자주 즐겨 먹는 음식 중의 하나이다. 주 재료로는 돼지갈비, 돼지부속물, 팔각회향, 계피, 정향 봉오리, 당귀, 마늘, 회향씨앗, 버섯, 과 그 외 각종 약재들을 섞어 수 시간 동안 끌여 만든다. 주로 쌀밥과 길게 두 가닥으로 반죽된 밀가루를 기름에 튀겨서 만든 유조(유티아오, 油條)와 함께 먹는다. =\n요리 이름에 차 (茶)라는 단어가 들어감에도 불구하고 실제로 요리에는 “차”가 첨가되지 않는다. 대신 현지 화교들은 바꿋떼와 함께 오룡차를 같이 먹는 식습관이 전통적으로 전해 내려오고 있다.  그 외 소스로는 칠리파디(쥐똥고추, 새눈고추)라는 매운고추와 마늘에 간장을 섞은 양념장을 같이 곁들여 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Bakutteh.jpg/500px-Bakutteh.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1130298","lang":"ko","updated":"2026-10-14T00:43:37.731Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["바쿠테"],"category":"수프·국물","ingredients":["쌀","밀가루","게","마늘","밥"],"descriptionLength":476,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"SG|차퀘이테오","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"차퀘이테오","title":"2018-19년 UEFA 유로파리그","status":"candidate","desc":"2018-19년 UEFA 유로파리그(2018-19 UEFA Europa League)는 유럽 축구 연맹이 주관하는 유럽의 두 번째 권위를 가진 축구 대회의 48번째 시즌이자, UEFA컵에서 UEFA 유로파리그로 바뀐 뒤 10번째 시즌이다. 결승전은 아제르바이잔의 수도 바쿠에 위치한 바쿠 올림픽 경기장에서 개최되었다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Baku_Olympic_Stadium_panorama_1.JPG/500px-Baku_Olympic_Stadium_panorama_1.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1864707","lang":"ko","updated":"2026-10-14T00:43:38.444Z","verification":"","risk":"차단 권고","reasons":["비음식 주제 가능성","등록 이름·별칭과 검색 제목 불일치"],"aliases":["차퀘이테오","2018-19년 UEFA 유로파리그"],"category":"국수·면","ingredients":[],"descriptionLength":177,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"MY|나시르막","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"나시르막","title":"나시 르막","status":"done","desc":"나시 르막(말레이어·인도네시아어: nasi lemak)은 말레이시아의 코코넛밥이다. 말레이시아, 인도네시아(수마트라섬), 브루나이, 싱가포르, 태국(남부), 필리핀(방사모로) 등 동남아시아 지역 및 인접한 오스트레일리아(크리스마스섬과 코코스제도) 지역에서 먹는 대표적인 말레이 요리이며, 말레이시아의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Nasi_lemak_basic.jpg/500px-Nasi_lemak_basic.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1130081","lang":"ko","updated":"2026-10-14T00:43:39.163Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["나시르막","나시 르막"],"category":"쌀·밥","ingredients":["코코넛","밥"],"descriptionLength":187,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"MY|차퀘이테오","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"차퀘이테오","title":"2018-19년 UEFA 유로파리그","status":"candidate","desc":"2018-19년 UEFA 유로파리그(2018-19 UEFA Europa League)는 유럽 축구 연맹이 주관하는 유럽의 두 번째 권위를 가진 축구 대회의 48번째 시즌이자, UEFA컵에서 UEFA 유로파리그로 바뀐 뒤 10번째 시즌이다. 결승전은 아제르바이잔의 수도 바쿠에 위치한 바쿠 올림픽 경기장에서 개최되었다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Baku_Olympic_Stadium_panorama_1.JPG/500px-Baku_Olympic_Stadium_panorama_1.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1864707","lang":"ko","updated":"2026-10-14T00:43:39.878Z","verification":"","risk":"차단 권고","reasons":["비음식 주제 가능성","등록 이름·별칭과 검색 제목 불일치"],"aliases":["차퀘이테오","2018-19년 UEFA 유로파리그"],"category":"국수·면","ingredients":[],"descriptionLength":177,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"MY|로티차나이","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"로티차나이","title":"로티 차나이","status":"done","desc":"로티 차나이(말레이어·인도네시아어: roti canai)는 말레이시아·브루나이·싱가포르·인도네시아 등지에서 먹는 납작빵이다. 말레이시아 남부와 싱가포르에서는 로티 프라타(말레이어: roti prata)라 부르며, 태국에서는 로띠(태국어: โรตี)로 알려져 있다.","image":"https://upload.wikimedia.org/wikipedia/commons/5/56/Canai.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=1139492","lang":"ko","updated":"2026-10-14T00:43:40.801Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["로티차나이","로티 차나이"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":147,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"MY|사테","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"사테","title":"사테","status":"done","desc":"사테(말레이어·인도네시아어: sate, 자와어: saté)는 인도네시아, 말레이시아, 브루나이, 싱가포르를 비롯한 동남아시아 지역에서 먹는 고기 꼬치 구이이다. 대표적인 자와 요리로, 인도네시아와 말레이시아의 국민 음식 가운데 하나로 여겨진다. 태국과 필리핀 등 주변 지역뿐 아니라, 인도네시아를 식민 지배했던 네덜란드와 네덜란드의 식민 지배를 받았던 수리남, 말레이계 이민자가 많은 스리랑카 등에서도 즐겨 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Satay_2.jpg/500px-Satay_2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=88187","lang":"ko","updated":"2026-10-14T00:43:41.515Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["사테"],"category":"고기요리","ingredients":[],"descriptionLength":232,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"MY|락사","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"락사","title":"락사","status":"done","desc":"락사(자위: لقسا‎; 중국어: 叻沙)는 동남아시아에서 인기 있는 매운 국수 요리이다. 락사는 다양한 종류의 국수, 가장 일반적으로 두꺼운 쌀국수와 닭고기, 새우 또는 생선과 같은 토핑으로 구성된다. 락사의 대부분의 변형은 풍부하고 매운 코코넛 커리 수프 또는 타마린드나 아삼 길루구르와 같은 신맛을 내는 재료로 양념한 육수로 준비된다.\n페라나칸 중국 요리에서 유래한 락사 레시피는 일반적으로 싱가포르, 인도네시아, 말레이시아에서 제공된다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Nyonya_Laksa.jpg/500px-Nyonya_Laksa.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=146600","lang":"ko","updated":"2026-10-14T00:43:42.233Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["락사"],"category":"국수·면","ingredients":["쌀","생선","닭고기","새우","코코넛"],"descriptionLength":247,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MY|렌당","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"렌당","title":"른당","status":"candidate","desc":"른당(말레이어·인도네시아어: rendang)은 인도네시아 등 해양 동남아시아 지역의 고기 요리이다. 쇠고기 등 고기를 코코넛밀크와 여러 가지 향신채, 향신료로 만든 페이스트와 함께 조리한 음식으로, 커리로 여겨지기도 한다. 대표적인 파당 요리 가운데 하나이며, 인도네시아의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Randang_cubadak2.jpg/500px-Randang_cubadak2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1424266","lang":"ko","updated":"2026-10-14T00:43:43.155Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["렌당","른당"],"category":"고기요리","ingredients":["쇠고기","코코넛"],"descriptionLength":172,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"NO|포리콜","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"포리콜","title":"포리콜","status":"done","desc":"포리콜(노르웨이어: fårikål)는 노르웨이의 양고기 요리이다. 가을에 먹는 계절 음식으로, 뼈가 붙은 어린양고기를 양배추와 함께 푹 익혀서 삶은 감자와 함께 낸다. 노르웨이의 국민 음식으로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/F%C3%A5r_i_k%C3%A5l.jpg/500px-F%C3%A5r_i_k%C3%A5l.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1840847","lang":"ko","updated":"2026-10-14T00:43:43.871Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["포리콜","Fårikål"],"category":"수프·국물","ingredients":["감자","양고기"],"descriptionLength":113,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"NO|루테피스크","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"루테피스크","title":"루테피스크","status":"done","desc":"루테피스크(노르웨이어: Lutefisk, 스웨덴어: lutfisk, 덴마크어: ludfisk, 핀란드어: lipeäkala)는 스웨덴, 덴마크, 노르웨이 등 노르딕 국가의 전통 요리이다. 건조된 흰살 생선이나 클리프피스크(염건어, 주로 염대구)로 만들어진다. 자연풍으로 말린 흰살 생선(주로 대구)를 며칠 동안 처음에는 깨끗한 물로, 나중에는 잿물로 불려서 만든다. 먹을 때는 그냥 먹거나 버터와 함께 오븐에 구워서 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Norway-Lutefisk-01.jpg/500px-Norway-Lutefisk-01.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=998438","lang":"ko","updated":"2026-10-14T00:43:45.103Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["루테피스크"],"category":"생선·해산물","ingredients":["생선","버터"],"descriptionLength":237,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"NO|라크피스크","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"라크피스크","title":"라크피스크","status":"done","desc":"라크피스크(노르웨이어: rakfisk)는 전통적인 동부 노르웨이 음식으로, 송어나 곤들매기 종류 생선을 소금에 절여 두세 달 동안 절인 후 조리 없이 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Rakfisk.jpg/500px-Rakfisk.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_cont
