function v19Accept(x,p){let title=normalize(p.title),names=[x.name,...v19Aliases(x.id)].map(normalize);if(!title||!names.includes(title))return false;if((V19_WRONG[x.id]||[]).some(v=>normalize(v)===title))return false;if(x.id==='NZ|화이트베이트 프리터'&&['프리터','fritter'].includes(title))return false;let d=(p.extract||'').trim();if(d.length<100||V19_BAD_TOPICS.test(p.title+' '+d.slice(0,240)))return false;return true}
async function v19SearchOne(x){let old=records[x.id];let queries=[{q:x.name,lang:'ko'},...v19Aliases(x.id).map(q=>({q,lang:/[가-힣]/.test(q)?'ko':'en'}))];let found=null,errors=[];for(let query of queries){if(cancel)break;try{let pages=await wiki(query.q,query.lang);for(let pg of pages){if(!v19Accept(x,pg))continue;found={id:x.id,status:'candidate',title:safe(pg.title).slice(0,150),desc:safe(pg.extract),image:safe(pg.thumbnail?.source).slice(0,450),url:`https://${pg.lang}.wikipedia.org/?curid=${pg.pageid}`,query:query.q,lang:pg.lang,verification:'v19-identity-candidate-unreviewed',updated:new Date().toISOString()};break}if(found)break}catch(e){errors.push(String(e.message||e))}}if(cancel)return; if(found){if(await save(found))log('정밀 검색 후보 갱신 '+x.name+' → '+found.title)}else log('정밀 검색 보류 '+x.name+' · 기존 결과 유지'+(errors.length?' · '+errors[0]:''));render()}
async function v19Batch(){if(busy)return;let rows=v19Audit().filter(x=>x.risk!=='일치 후보'&&records[x.id]?.status==='candidate');if(!rows.length){alert('정밀 재검색 대상인 보라색 후보가 없습니다.');return}if(!confirm(`${rows.length}개 보라색 위험 후보를 다시 검색할까요? 기존 초록색 카드는 변경하지 않고, 검색 실패 시 기존 후보도 보존합니다. 새 결과는 자동 완성하지 않습니다.`))return;busy=true;cancel=false;toggle();try{for(let i=0;i<rows.length;i++){if(cancel)break;let x=items.find(v=>v.id===rows[i].id);$('progress').textContent=`정밀 검색 ${i+1}/${rows.length} · ${x.name}`;await v19SearchOne(x);if(!cancel)await new Promise(r=>setTimeout(r,250))}}finally{busy=false;toggle();$('progress').textContent=cancel?'정밀 검색 중지':'정밀 검색 종료';render()}}
function log(s){let d=document.createElement('div');d.textContent=new Date().toLocaleTimeString('ko-KR')+' · '+s;$('log').prepend(d);while($('log').children.length>130)$('log').lastChild.remove()}
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('데이터베이스 연결이 차단되었습니다'))})}
function getAll(){return new Promise((resolve,reject)=>{let t=db.transaction(STORE,'readonly'),q=t.objectStore(STORE).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function put(v){return new Promise((resolve,reject)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('저장 취소'))})}
async function save(v){let prev=records[v.id];try{await put(v);records[v.id]=v;failedStorage=false;return true}catch(e){failedStorage=true;log('⚠ 저장 실패: '+v.id+' / '+e.message);if(prev)records[v.id]=prev;else delete records[v.id];alert('저장에 실패했습니다. 다른 자료는 건드리지 않았습니다. 저장 공간을 확인해 주세요.');cancel=true;controller?.abort();return false}}
function counts(){let c={new:0,candidate:0,done:0,failed:0,searching:0};for(let x of items)c[records[x.id]?.status||'new']++;return c}
function render(){let c=counts();$('status').textContent=`27개국 · 전체 ${items.length}개 | 🟢 완성 ${c.done}/${items.length} · 🟣 후보 ${c.candidate} · ⚪ 미검색 ${c.new} · 🔴 실패 ${c.failed} · 검색 중 ${c.searching}`;$('storage').textContent=`전용 IndexedDB: ${Object.keys(records).length}개 저장${failedStorage?' · ⚠ 저장 실패 발생':''}`;let q=$('countrySearch').value.trim(),cn=$('countries');cn.replaceChildren();function btn(text,fn,cl){let b=document.createElement('button');b.textContent=text;b.className=cl;b.onclick=fn;return b}cn.append(btn('🌐 전체 보기',()=>{active='ALL';render()},'country'));for(let [cc,country] of Object.entries(CATALOG)){if(q&&!country.name.includes(q))continue;let done=country.items.filter(n=>records[cc+'|'+n]?.status==='done').length;cn.append(btn(`${country.flag} ${country.name} (${done}/${country.items.length})`,()=>{active=cc;render()},'country'))}let host=$('foods');host.replaceChildren();$('heading').textContent=active==='ALL'?'🌐 전체 국가 음식 보기':CATALOG[active].flag+' '+CATALOG[active].name;for(let [cc,country] of Object.entries(CATALOG)){if(active!=='ALL'&&active!==cc)continue;let section=document.createElement('div');section.className='group';let done=country.items.filter(n=>records[cc+'|'+n]?.status==='done').length;let h=document.createElement('h3');h.textContent=`${country.flag} ${country.name} (${done}/${country.items.length})`;section.append(h);let row=document.createElement('div');row.className='row';for(let n of country.items){let id=cc+'|'+n,r=records[id],state=r?.status||'new';let b=btn(`${n} · ${{new:'흰색',candidate:'보라색',done:'초록색',failed:'실패',searching:'검색 중'}[state]}`,()=>choose(cc,n),'chip');b.dataset.status=state;row.append(b)}section.append(row);host.append(section)}}
function toggle(){for(let id of ['start','retry'])$(id).disabled=busy;$('stop').disabled=!busy}
function safe(s){return String(s||'').slice(0,1800)}
function fetchWithTimeout(url,ms=9000){controller=new AbortController();let timer=setTimeout(()=>controller.abort(),ms);return fetch(url,{signal:controller.signal,cache:'no-store'}).finally(()=>{clearTimeout(timer);controller=null})}
async function wiki(q,lang){let url=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=4&prop=extracts%7Cpageimages&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=500&format=json&origin=*`;let r=await fetchWithTimeout(url);if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();return Object.values(data.query?.pages||{}).sort((a,b)=>(a.index??99)-(b.index??99)).map(p=>({...p,lang}))}
function normalize(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/\([^)]*\)/g,'').replace(/[^\p{L}\p{N}]/gu,'')}
function verify(name,alias,p){let title=normalize(p.title),n=normalize(name),a=normalize(alias),d=safe(p.extract);if(d.length<85)return false;if(!title||!(title===n||title===a))return false;if(/동음이의|disambiguation|영화|배우|음반|노래|축구 선수|비디오 게임/i.test(d.slice(0,180)))return false;return /음식|요리|식사|식품|재료|고기|빵|튀김|밥|국물|food|dish|cuisine|made from|prepared|traditional|fried|rice|meat|soup|bread/i.test(d)}
async function searchOne(x){let old=records[x.id],pending={id:x.id,status:'searching',updated:new Date().toISOString()};if(!await save(pending))return;render();$('progress').textContent=`검색 중: ${CATALOG[x.cc].name} · ${x.name}`;log('시작 '+x.name);let queries=[{q:x.name,lang:'ko'},...v19Aliases(x.id).map(q=>({q,lang:/[가-힣]/.test(q)?'ko':'en'}))];let best=null,verified=null,errs=[];for(let query of queries){if(cancel)break;try{let pages=await wiki(query.q,query.lang);for(let p of pages){if(!p.extract||p.extract.length<35)continue;let candidate={id:x.id,status:'candidate',title:safe(p.title).slice(0,150),desc:safe(p.extract),image:safe(p.thumbnail?.source).slice(0,450),url:`https://${p.lang}.wikipedia.org/?curid=${p.pageid}`,query:query.q,lang:p.lang,updated:new Date().toISOString()};if(!best&&!V19_BAD_TOPICS.test((p.title||'')+' '+(p.extract||'').slice(0,220))&&!(V19_WRONG[x.id]||[]).some(z=>normalize(z)===normalize(p.title)))best=candidate;if(verify(x.name,query.q,p)&&v19Accept(x,p)){verified={...candidate,status:'done',verification:'rule-exact-title-v1'};break}}if(verified)break}catch(e){if(cancel)break;errs.push(String(e.message||e))}}let result=cancel?old||null:verified||best||{id:x.id,status:'failed',reason:errs.join('; ')||'설명 있는 검색 결과 없음',updated:new Date().toISOString()};if(cancel&&!old){result={id:x.id,status:'new',updated:new Date().toISOString()}}if(result&&!await save(result))return;render();log(`${x.name} → ${result?.status||'new'}${result?.title?' ('+result.title+')':''}`)}
async function batch(onlyFailed=false){if(busy)return;if(!db){alert('저장소 연결이 필요합니다');return}busy=true;cancel=false;toggle();let todo=items.filter(x=>onlyFailed?records[x.id]?.status==='failed':!records[x.id]||['new','failed','searching'].includes(records[x.id].status));log(`자동검색 시작 ${todo.length}개`);try{for(let i=0;i<todo.length;i++){if(cancel)break;$('progress').textContent=`${i+1}/${todo.length} · ${todo[i].name}`;await searchOne(todo[i]);if(!cancel)await new Promise(r=>setTimeout(r,180))}}finally{busy=false;toggle();$('progress').textContent=cancel?'중지됨 · 다시 시작하면 미완료부터 검색':'검색 종료';log($('progress').textContent);render()}}
function choose(cc,name){cardSequence=[];cardIndex=-1;let id=cc+'|'+name,r=records[id];if(r&&['candidate','done'].includes(r.status))showCard(cc,name);else if(busy)alert('자동검색 중입니다.');else single({cc,name,id})}
async function single(x){busy=true;cancel=false;toggle();try{await searchOne(x)}finally{busy=false;toggle()};if(['candidate','done'].includes(records[x.id]?.status))showCard(x.cc,x.name)}
function showCard(cc,name){let r=records[cc+'|'+name];if(!r)return;$('title').textContent=`${CATALOG[cc].flag} ${name}`;$('meta').textContent=`${r.status==='done'?'🟢 완성':'🟣 검토 후보'} · 검색 제목: ${r.title||'없음'} · ${r.verification==='manual'?'사용자 확인':r.verification?'규칙 자동검증':'미검증'}`;$('desc').textContent=r.desc||r.reason||'설명 없음';let q=quality({cc,name,id:cc+'|'+name});let vr=v19Risk({cc,name,id:cc+'|'+name});if(vr?.risk==='차단 권고')$('meta').textContent+=' · 🚫 오검색 의심(기존 카드 유지)';if(q?.needsReview)$('meta').textContent+=' · ⚠ 확인 필요: '+q.reasons.filter(x=>!x.startsWith('사진 없음')).join(', ');$('picture').replaceChildren();if(r.image){let img=document.createElement('img');img.src=r.image;img.alt=name;img.onerror=()=>{img.replaceWith(document.createTextNode('사진을 표시할 수 없습니다.'))};$('picture').append(img)}else $('picture').textContent='📷 사진 준비 중';$('actions').replaceChildren();let button=(text,fn)=>{let b=document.createElement('button');b.textContent=text;b.onclick=fn;$('actions').append(b)};button(r.status==='done'?'🟣 후보로 되돌리기':'🟢 설명 확인 후 카드 완성',async()=>{let next={...r,status:r.status==='done'?'candidate':'done',verification:r.status==='done'?'':'manual'};if(await save(next)){render();showCard(cc,name)}});button('🔁 다시 검색',()=>{$('modal').classList.remove('open');if(!busy)single({cc,name,id:cc+'|'+name})});if(r.url)button('📖 검색 출처',()=>window.open(r.url,'_blank','noopener'));$('modal').classList.add('open')}
function quality(x){let r=records[x.id];if(!r||!['done','candidate'].includes(r.status))return null;let reasons=[];let title=normalize(r.title),name=normalize(x.name);let aliases=v19Aliases(x.id).map(normalize);if(!r.desc||r.desc.trim().length<100)reasons.push('설명이 짧거나 없음');if(!title||!(title===name||aliases.includes(title)))reasons.push('검색 제목이 대표이름·등록 별칭과 다름');if(/동음이의|disambiguation|축구 선수|비디오 게임|영화|음반/i.test((r.desc||'').slice(0,250)))reasons.push('다른 주제 가능성');if(!r.image)reasons.push('사진 없음 (완성 여부와 무관)');return {id:x.id,country:CATALOG[x.cc].name,name:x.name,status:r.status,title:r.title||'',image:!!r.image,verification:r.verification||'',reasons,needsReview:reasons.some(z=>!z.startsWith('사진 없음'))};}
function audit(){auditRows=items.map(quality).filter(Boolean);let bad=auditRows.filter(x=>x.needsReview),noPhoto=auditRows.filter(x=>!x.image);$('auditSummary').style.display='block';$('auditSummary').textContent=`점검 ${auditRows.length}개 | 확인 필요 ${bad.length}개 | 사진 없는 카드 ${noPhoto.length}개. 제목·설명 길이 기반의 기계적 점검이며 사실 검증 결과는 아닙니다. 기존 카드 상태는 변경하지 않았습니다.`;log('읽기 전용 품질 점검: '+auditRows.length+'개, 확인 필요 '+bad.length+'개');return bad}
function browse(mode){let rows=mode==='issues'?audit():items.filter(x=>records[x.id]?.status==='done');cardSequence=rows.map(x=>x.id);cardIndex=0;if(!cardSequence.length){alert(mode==='issues'?'점검 필요 카드가 없습니다. 먼저 품질 점검을 실행해 보세요.':'완성 카드가 없습니다.');return}showByIndex()}
function showByIndex(){if(cardIndex<0||cardIndex>=cardSequence.length)return;let id=cardSequence[cardIndex],sep=id.indexOf('|');showCard(id.slice(0,sep),id.slice(sep+1));$('prevCard').disabled=cardIndex===0;$('nextCard').disabled=cardIndex===cardSequence.length-1}
function auditExport(){if(!auditRows.length)audit();let payload={version:VERSION,generated:new Date().toISOString(),note:'읽기 전용 규칙 점검. 정확성 보장 아님.',items:auditRows};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='World_Food_FRESH_V1_8_quality_audit.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function backup(){let data={version:VERSION,date:new Date().toISOString(),catalog:CATALOG,records:Object.values(records)};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='World_Food_FRESH_V1_9_backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);log('백업 파일 생성')}
async function restore(file){if(!file)return;try{let json=JSON.parse(await file.text()),arr=Array.isArray(json.records)?json.records:Object.entries(json.states||{}).map(([id,v])=>({id,...v}));arr=arr.filter(x=>items.some(i=>i.id===x.id)&&x.status&&typeof x.status==='string');if(!confirm(`${arr.length}개 항목을 전용 저장소에 병합할까요? 기존 저장된 항목은 덮어쓰지 않습니다.`))return;let n=0;for(let x of arr){if(records[x.id])continue;let safeRecord={id:x.id,status:x.status==='searching'?'new':x.status,title:safe(x.title).slice(0,150),desc:safe(x.desc),image:safe(x.image).slice(0,450),url:safe(x.url).slice(0,400),verification:x.verification||'',updated:new Date().toISOString()};if(await save(safeRecord))n++;else break}render();log(`복원 ${n}개`)}catch(e){alert('복원 오류: '+e.message)}}
$('start').onclick=()=>batch();$('retry').onclick=()=>batch(true);$('stop').onclick=()=>{cancel=true;controller?.abort();log('중지 요청')};$('countrySearch').oninput=render;$('export').onclick=backup;$('import').onclick=()=>$('file').click();$('file').onchange=e=>restore(e.target.files[0]);$('cards').onclick=()=>browse('done');$('audit').onclick=audit;$('issues').onclick=()=>browse('issues');$('auditExport').onclick=auditExport;$('prevCard').onclick=()=>{cardIndex--;showByIndex()};$('nextCard').onclick=()=>{cardIndex++;showByIndex()};$('v19Check').onclick=v19Audit;$('v19Retry').onclick=v19Batch;$('v19Export').onclick=v19Download;$('close').onclick=()=>{$('modal').classList.remove('open')};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
(async()=>{try{db=await openDB();let existing=await getAll();for(let x of existing)if(x?.id)records[x.id]=x;log('FRESH V1.9 전용 저장소 연결 · '+existing.length+'개 로드');$('progress').textContent='준비 완료 · 미검색 자동검색을 누르세요';render()}catch(e){log('저장소 연결 오류: '+e.message);$('status').textContent='⚠ IndexedDB 연결 실패: '+e.message;$('start').disabled=true;$('retry').disabled=true;$('import').disabled=true}})();
</script></body></html>
