026-10-14T00:42:40.076Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 토스트 요리가 아닌 베지마이트 재료 자체에 관한 내용입니다."],"aliases":["베지마이트 토스트","베지마이트"],"category":"빵·밀가루","ingredients":["게","빵"],"descriptionLength":0,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"AU|램 요리","countryCode":"AU","country":"호주","flag":"🇦🇺","name":"램 요리","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=415444","lang":"ko","updated":"2026-10-14T00:42:40.794Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 특정 호주 요리가 아닌 양고기 식재료 일반 문서입니다."],"aliases":["램 요리","양고기"],"category":"고기요리","ingredients":["양고기","밥"],"descriptionLength":0,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"CA|푸틴","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"푸틴","title":"푸틴 (음식)","status":"done","desc":"푸틴(프랑스어: poutine)은 캐나다의 감자 요리이다. 감자 튀김에 치즈 커드와 브라운 그레이비를 곁들인 음식으로, 1950년대 후반 상트르뒤케베크 지역에서 만들어졌다. 캐나다의 국민 음식 가운데 하나로 여겨진다. 위안을 주는 음식으로 여겨지며, 해장 음식으로도 사랑받는다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Poutine.JPG/500px-Poutine.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=833143","lang":"ko","updated":"2026-10-14T00:42:42.125Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["푸틴","푸틴 (음식)"],"category":"튀김·간식","ingredients":["김","감자","치즈"],"descriptionLength":157,"categoryOriginal":"수프·국물","extraCategories":["기타·전통요리"]},{"id":"CA|메이플 시럽","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"메이플 시럽","title":"메이플 시럽","status":"done","desc":"메이플 시럽(영어: maple syrup, 프랑스어: sirop d'erable, 네덜란드어: esdoornsiroop)  또는 단풍당밀(丹楓糖蜜)은 단풍나무의  수액으로부터 만드는 감미료의 하나이다. 단풍나무 시럽, 또는 단풍당(丹楓糖)이라고도 부른다.  캐나다 및 미국 등지에서 주로 따뜻한 와플이나 팬케이크 위에 부어 함께 먹는다. 그 외에도 엄지 손가락 한마디 크기로 만든 단풍나뭇 잎 모양의 사탕인 메이플슈거캔디를 만들며 빵이나 후식을 만드는 데 재료로 들어가거나 간혹 맥주를 만들 때 당의 주원료나 감미료로 이용된다. 조림음식의 독특한 향과 맛을 내기 위하여 설탕 대용으로 쓰인다.\n메이플 시럽의 성분은 수크로스가 약 62%를 차지하고, 과당과 포도당이 각각 약 1%정도를 차지한다.\n아메리카 토착민들이 처음으로 메이플 시럽을 채취하고 사용을 하였고 이후 유럽인 정착자들도 이를 받아들여 이용하게 되었다.\n캐나다는 전 메이플 시럽 생산량의 85%를 차지하고 있다. 캐나다 식품검사청(CFIA)에서는 메이플 시럽을 세 등급으로 분류하여 관리하고 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Maple_syrup.jpg/500px-Maple_syrup.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=299461","lang":"ko","updated":"2026-10-14T00:42:42.841Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["메이플 시럽"],"category":"음료·소스","ingredients":["게","빵"],"descriptionLength":537,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|투르티에르","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"투르티에르","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=422695","lang":"ko","updated":"2026-10-14T00:42:43.559Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 캐나다 투르티에르가 아닌 고기 파이 일반 문서입니다."],"aliases":["투르티에르","고기 파이"],"category":"빵·밀가루","ingredients":[],"descriptionLength":0,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|버터 타르트","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"버터 타르트","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=231470","lang":"ko","updated":"2026-10-14T00:42:44.377Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 캐나다 버터 타르트가 아닌 타르트 일반 문서입니다."],"aliases":["버터 타르트","타르트"],"category":"디저트·과자","ingredients":["양파","밀가루","버터","게"],"descriptionLength":0,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|나나이모 바","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"나나이모 바","title":"나나이모 바","status":"done","desc":"나나이모 바(Nanaimo bar, /nəˈnaˈmoʊ/ nə-NY-moh)는 베이킹이 필요 없는 바 디저트로 브리티시컬럼비아주의 캐나다 도시 너나이모의 이름을 따서 명명되었다. 웨이퍼 (음식), 견과류(호두, 아몬드 또는 피칸), 코코넛 부스러기 베이스의 세 가지 층으로 구성된다. 중간에 커스터드 아이싱, 그리고 그 위에 초코 가나슈를 얹어준다. 다양한 유형의 부스러기(crumb), 다양한 맛의 아이싱(예: 땅콩버터 또는 코코넛, 모카), 다양한 유형의 초콜릿으로 구성된 다양한 종류가 존재한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Nanaimo_bar.JPG/500px-Nanaimo_bar.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3818016","lang":"ko","updated":"2026-10-14T00:42:45.196Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["나나이모 바"],"category":"디저트·과자","ingredients":["콩","버터","코코넛"],"descriptionLength":280,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|몬트리올 베이글","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"몬트리올 베이글","title":"몬트리올 베이글","status":"done","desc":"몬트리올 베이글(영어: Montreal-style bagel 몬트리올스타일 베이글[*])은 독특한 종류의 베이글의 일종이다. 기계 작업 없이 손으로 만들며 나무에 불을 붙여 굽는다. 뉴욕 베이글에 비해서 몬트리올 베이글은 더 작고, 더 단 맛이 나며, 더 밀도가 높다. 중앙에 뚫려 있는 베이글 특유의 구멍 역시 몬트리올 베이글이 좀 더 큰 편이다. 몬트리올 베이글은 항상 나무에 불을 붙여 그 위에서 굽는다. 엿기름과 달걀이 주 재료로 들어가며 소금은 이 베이글에 들어가지 않는다. 그리고 나무에 불을 붙여 굽기 전에는 보통 꿀이 들어간 뜨거운 물에 베이글을 데운다.\n많은 몬트리올의 빵집에서는 아직도 몬트리올 베이글을 수작업으로 손수 만들며 나무를 태워서 굽는다. 시중에서 팔리는 몬트리올 베이글에는 양귀비 씨가 뿌려진 \"블랙 시드\"와 참깨가 뿌려진 \"화이트 시드\"가 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Bagels-Montreal-REAL.jpg/500px-Bagels-Montreal-REAL.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1236181","lang":"ko","updated":"2026-10-14T00:42:46.121Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["몬트리올 베이글"],"category":"빵·밀가루","ingredients":["달걀","빵"],"descriptionLength":435,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"CA|연어 요리","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"연어 요리","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=1448380","lang":"ko","updated":"2026-10-14T00:42:46.875Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 특정 캐나다 요리가 아닌 연어 식재료 일반 문서입니다."],"aliases":["연어 요리","연어 (음식)"],"category":"생선·해산물","ingredients":["생선","연어"],"descriptionLength":0,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"CA|베이글","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"베이글","title":"베이글","status":"done","desc":"베이글(영어: bagel, 이디시어: בײגל beygl로부터)은 전통적으로, 손바닥 정도 넓이에 이스트를 첨가한 밀가루를 반죽하여 끓는 물에 데친 다음 구워서 만든 빵이다. 바깥 면이 바삭거리는 것도 있는데 보통은 노릇한 갈색을 띤다. 안쪽은 마치 가래떡같이 쫄깃한 맛과 보통 식빵에 비해 씹는 맛이 있다. 아무것도 넣지 않은 플레인 베이글도 있고 양귀비 씨나 깨를 얹은 베이글도 있다. 가운데에 구멍이 뚫려 있어서 모양은 도넛과 유사하지만, 도넛은 기름에 튀기는 반면 베이글은 그렇지 않아 담백하고 버터, 우유, 설탕이 들어가지 않아서 저지방, 저콜레스테롤의 건강식으로 각광받고 있다.","image":"https://upload.wikimedia.org/wikipedia/commons/9/98/Bagel.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=107452","lang":"ko","updated":"2026-10-14T00:42:47.551Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["베이글"],"category":"빵·밀가루","ingredients":["밀가루","우유","버터","빵"],"descriptionLength":329,"categoryOriginal":"디저트","extraCategories":[]},{"id":"CA|배넉","countryCode":"CA","country":"캐나다","flag":"🇨🇦","name":"배넉","title":"배넉 (음식)","status":"done","desc":"배넉(영어: bannock)은 큰 납작한 종류의 퀵 브레드(베이킹파우더와 탄산 수소 나트륨을 이용해 즉석으로 부풀린 빵)이다. 배넉이라는 단어는 영어에서 크고 둥근 빵을 가리킬 수 있다. 둥근 배넉을 쐐기 모양의 조각으로 자르면 스콘이라고 부른다. 하지만 스코틀랜드에서는 배넉과 스콘의 뜻을 교체할 수 있다.","image":"https://upload.wikimedia.org/wikipedia/commons/d/d2/BannockBeremeal.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=525755","lang":"ko","updated":"2026-10-14T00:42:48.268Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["배넉","배넉 (음식)"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":172,"categoryOriginal":"디저트","extraCategories":[]},{"id":"MX|타코","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"타코","title":"타코","status":"done","desc":"타코(스페인어: taco)는 멕시코의 전통 음식이다. 토티아(토르티야)에 고기와 채소 등 여러 가지 재료를 올리고 소스를 얹어 먹는 음식으로, 대표적인 안토히토이다. 멕시코의 길거리 음식이며,  국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/001_Tacos_de_carnitas%2C_carne_asada_y_al_pastor.jpg/500px-001_Tacos_de_carnitas%2C_carne_asada_y_al_pastor.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=229325","lang":"ko","updated":"2026-10-14T00:42:50.728Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["타코"],"category":"빵·밀가루","ingredients":["채소"],"descriptionLength":128,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"MX|몰레","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"몰레","title":"몰레","status":"done","desc":"몰레(스페인어: mole)는 멕시코 요리에 쓰이는 여러 소스를 일컫는 말이다. 멕시코 밖에서 \"몰레\"는 주로 푸에블라식 소스인 몰레 포블라노를 일컫는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Mole_in_Puebla.JPG/500px-Mole_in_Puebla.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1821283","lang":"ko","updated":"2026-10-14T00:42:51.545Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["몰레"],"category":"음료·소스","ingredients":[],"descriptionLength":85,"categoryOriginal":"음료·소스","extraCategories":["수프·국물"]},{"id":"MX|타말","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"타말","title":"타말","status":"done","desc":"타말(스페인어: tamal)은 멕시코, 과테말라 등 중앙아메리카 많은 나라의 전통 음식이다. 옥수수로 만든 마사 반죽을 옥수수 껍질이나 바나나잎에 싸서 쪄낸다. 고기, 치즈, 토마토 등으로 만든 속이나 소스를 넣기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Gastronom%C3%ADa_de_Tochap%C3%A1n.jpg/500px-Gastronom%C3%ADa_de_Tochap%C3%A1n.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1891244","lang":"ko","updated":"2026-10-14T00:42:52.262Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["타말"],"category":"빵·밀가루","ingredients":["토마토","치즈","바나나","옥수수"],"descriptionLength":124,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"MX|포솔레","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"포솔레","title":"포솔레","status":"done","desc":"포솔레(스페인어: pozole, 나와틀어: pozolli에서 유래)는 멕시코의 전통적인 국 또는 스튜이다. 닉스타말과 고기 (일반적으로 닭고기 또는 돼지고기)로 만들며, 잘게 썬 상추나 양배추, 고추, 양파, 마늘, 무, 아보카도, 살사 또는 라임으로 양념하고 장식할 수 있다. 선콜럼버스 시대부터 중앙아메리카 지역에 존재했으며, 멕시코와 인접 국가들에서 일상식과 축제 요리로 흔하게 볼 수 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Green_pozole%2C_dressed_%2829161841908%29_%28cropped%29.jpg/500px-Green_pozole%2C_dressed_%2829161841908%29_%28cropped%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4049085","lang":"ko","updated":"2026-10-14T00:42:53.080Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["포솔레"],"category":"수프·국물","ingredients":["돼지고기","닭고기","양파","게","마늘"],"descriptionLength":222,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"MX|과카몰레","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"과카몰레","title":"과카몰레","status":"done","desc":"과카몰레(스페인어: guacamole)는 멕시코 요리의 소스로, 콘칩과 유사한 '토토포(Totopo)'라고 하는 튀긴 토르티야 조각으로 퍼서 먹는다.\n'과카'는 멕시코에서 아보카도를 뜻하는 '아과카테(Aguacate)'에서 온 것이며, '몰레'는 멕시코 원주민 어로 '소스'를 뜻한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b9/El_tango_guacamole.jpg/500px-El_tango_guacamole.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=366966","lang":"ko","updated":"2026-10-14T00:42:53.900Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["과카몰레"],"category":"음료·소스","ingredients":[],"descriptionLength":159,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MX|엔칠라다","countryCode":"MX","country":"멕시코","flag":"🇲🇽","name":"엔칠라다","title":"엔칠라다","status":"done","desc":"엔칠라다(스페인어: enchilada IPA: [entʃiˈlaða])는 옥수수 토르티야에 (만두처럼) 소를 넣고 돌돌 만 뒤 매운 고추 소스를 뿌려 먹는 음식이다. 고기, 치즈, 콩, 감자, 채소, 해산물 등으로 엔칠라다의 소를 만든다. 또 취향에 따라 치즈, 사워크림, 상추, 올리브, 다진 양파, 고추, 고수 잎 등을 엔칠라다 위에 얹어서 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Enchilada_Rice_Beans.jpg/500px-Enchilada_Rice_Beans.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=761969","lang":"ko","updated":"2026-10-14T00:42:54.617Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["엔칠라다"],"category":"빵·밀가루","ingredients":["감자","양파","치즈","콩","옥수수"],"descriptionLength":197,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"BR|페이조아다","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"페이조아다","title":"페이조아다","status":"done","desc":"페이조아다(포르투갈어: feijoada)는 포르투갈, 브라질, 앙골라, 모잠비크 등 포르투갈어권 지역의 대표적인 음식이다. 돼지고기나 쇠고기 등을 넣어 만든 강낭콩 스튜의 일종으로, 거의 항상 쌀밥과 함께 먹는다. 고기를 넣지 않고 콩만으로 조리한 것은 포르투갈어로 \"콩\"을 뜻하는 \"페이장\"이라 부르며, 흔히 쌀밥과 함께 점심 식사 때 고기 요리 등의 부식으로 곁들인다. 고기 등 부재료를 넣어 조리한 페이조아다는 주말 점심 식사 주요리로 먹는다. 포르투갈 북부가 기원이며, 브라질에서는 페이조아다가 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Feijoada_%C3%A0_transmontada.jpg/500px-Feijoada_%C3%A0_transmontada.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=210476","lang":"ko","updated":"2026-10-14T00:42:55.333Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["페이조아다"],"category":"수프·국물","ingredients":["쌀","돼지고기","쇠고기","콩","밥"],"descriptionLength":300,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"BR|슈하스코","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"슈하스코","title":"슈하스쿠","status":"done","desc":"슈하스코는 커다란 고기 덩어리를 꼬치에 끼워 숯불 등에 구워 먹는 브라질식 바비큐입니다. 다양한 고기를 얇게 잘라 나누어 먹습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Churrasco_carioca.jpg/500px-Churrasco_carioca.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1811234","lang":"ko","updated":"2026-10-14T00:42:56.051Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["슈하스코","슈하스쿠"],"category":"고기요리","ingredients":["쇠고기","돼지고기","소금"],"descriptionLength":73,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"BR|모케카","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"모케카","title":"모케카","status":"done","desc":"모케카는 생선이나 새우를 토마토와 양파 등 채소와 함께 끓이는 브라질의 해산물 스튜입니다. 지역에 따라 코코넛 밀크와 팜유를 넣기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Moqueca.jpg/500px-Moqueca.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3620208","lang":"ko","updated":"2026-10-14T00:42:56.767Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["모케카"],"category":"생선·해산물","ingredients":["생선","토마토","양파"],"descriptionLength":78,"categoryOriginal":"수프·국물","extraCategories":["수프·국물"]},{"id":"BR|파웅 지 케이주","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"파웅 지 케이주","title":"브라질의 문화","status":"candidate","desc":"브라질의 문화는 다양한 원주민 문화의 융합과 특히 브라질 식민지 시대에 원주민, 포르투갈인 식민지 개척자 및 아프리카인들 사이에서 일어난 문화적 융합으로 형성되었다. 19세기 후반과 20세기 초반에 브라질은 주로 포르투갈, 이탈리아, 스페인, 독일 출신의 상당수 이민자를 받아들였으며, 이들과 함께 일본, 오스트리아, 네덜란드, 아르메니아, 아랍, 유대인, 폴란드, 우크라이나, 프랑스, 러시아, 스위스, 헝가리, 그리스, 중국, 한국 출신의 소수 이민자들이 브라질의 지역 문화 형성에 중요한 기여를 했으며, 이로써 브라질이 현재의 다원적이고 인종적으로 다양한 사회로 존재하는 데 기여했다.\n포르투갈 제국에 의한 3세기 동안의 식민지화의 결과로, 브라질 문화의 많은 측면은 포르투갈의 문화에서 파생되었다. 포르투갈로부터 물려받은 수많은 것에는 포르투갈어, 쌀밥과 콩 및 페이조아다와 같은 음식, 지배적인 종교 및 식민지 건축 양식이 포함된다. 그러나 이러한 측면은 아프리카 및 원주민 전통과 다른 서유럽 국가들의 전통에 의해 영향을 받았다. 브라질 문화의 일부 측면은 이탈리아, 스페인, 독일, 일본 및 기타 유럽 이민자들의 기여이다. 아메리카 원주민과 아프리카인들도 브라질 언어, 요리, 음악, 춤, 종교 형성에 중요한 역할을 했다.\n이 다양한 문화적 배경은 리우 카니발과 분바 메우 보이와 같이 세계적으로 알려진 많은 축제와 행사를 선보이는 데 기여했다. 다채로운 문화는 브라질을 매년 100만 명 이상의 관광객이 방문하는 인기 있는 관광지로 만드는 환경을 조성한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Roda_de_capoeira4.jpg/500px-Roda_de_capoeira4.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3994541","lang":"ko","updated":"2026-10-14T00:42:57.484Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["파웅 지 케이주","브라질의 문화"],"category":"빵·밀가루","ingredients":["쌀","콩","밥"],"descriptionLength":767,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"BR|아카라제","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"아카라제","title":"아카라","status":"done","desc":"아카라제는 콩을 갈아 만든 반죽을 기름에 튀긴 브라질 바이아 지방의 음식입니다. 튀긴 빵을 갈라 새우와 양념한 속재료를 채워 먹기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Beans_Ball-Akara.jpg/500px-Beans_Ball-Akara.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2683285","lang":"ko","updated":"2026-10-14T00:42:58.304Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["아카라제","아카라"],"category":"튀김·간식","ingredients":["동부콩","새우","팜유"],"descriptionLength":78,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"BR|브리가데이루","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"브리가데이루","title":"브리가데이루","status":"done","desc":"브리가데이루는 가당연유와 코코아 가루, 버터를 끓여 만든 브라질의 초콜릿 과자입니다. 작게 둥글려 초콜릿 가루를 묻히기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Brigadeiro.jpg/500px-Brigadeiro.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3620350","lang":"ko","updated":"2026-10-14T00:42:59.430Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["브리가데이루"],"category":"디저트·과자","ingredients":["가당연유","코코아","버터"],"descriptionLength":72,"categoryOriginal":"디저트","extraCategories":[]},{"id":"BR|팡 지 케이주","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"팡 지 케이주","title":"팡 지 케이주","status":"done","desc":"팡 지 케이주(브라질 포르투갈어: pão de queijo)는 브라질의 치즈빵이다. 18세기쯤 미나스제라이스주에서 처음 만들어졌다고 추정된다. \"빵\"이라 불리지만, 카사바 녹말에 달걀, 소금, 기름, 치즈 등을 넣어 만든 쫄깃쫄깃한 비스킷이다. 겉은 바삭바삭하고 속은 부드럽다. 브라질에서는 주로 아침밥이나 간식으로 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Pao_de_queijo_brasil.jpg/500px-Pao_de_queijo_brasil.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1866859","lang":"ko","updated":"2026-10-14T00:43:00.351Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["팡 지 케이주"],"category":"빵·밀가루","ingredients":["치즈","달걀","밥","빵"],"descriptionLength":181,"categoryOriginal":"디저트","extraCategories":[]},{"id":"BR|아사이 볼","countryCode":"BR","country":"브라질","flag":"🇧🇷","name":"아사이 볼","title":"아사이 볼","status":"done","desc":"아사이 볼(açaí bowl) 또는 아사이 나 치젤라(브라질 포르투갈어: açaí na tigela→사발에 담긴 아사이)는 파라주와 아마조나스주가 원산지인 브라질의 달콤한 후식이다. 아사이야자 열매를 얼린 뒤 으깨어 만든 요리로, '흙 맛이 나는 듯한' 또는 크리미한 맛이 난다고 알려져 있다. 갈아내기 전에는 입자가 있는 질감이며, 높은 산도로 인한 신맛이 있어 맛있게 즐길 수 있다. 주로 과라나 시럽과 섞어 스무디 형태로 그릇에 담아 내며, 보통 그래놀라와 바나나를 올려 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e1/Acai_bowl_-_A%C3%A7a%C3%AD_na_tigela.jpg/500px-Acai_bowl_-_A%C3%A7a%C3%AD_na_tigela.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1836093","lang":"ko","updated":"2026-10-14T00:43:01.068Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["아사이 볼"],"category":"디저트·과자","ingredients":["바나나","게"],"descriptionLength":271,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"GB|피시 앤 칩스","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"피시 앤 칩스","title":"피시 앤드 칩스","status":"done","desc":"피시 앤 칩스는 흰살생선에 반죽을 입혀 튀긴 생선튀김과 굵게 썬 감자튀김을 함께 내는 영국의 음식입니다. 소금이나 식초를 곁들이기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Fish_and_chips_blackpool.jpg/500px-Fish_and_chips_blackpool.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=61848","lang":"ko","updated":"2026-10-14T00:43:01.890Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["피시 앤 칩스","피시 앤드 칩스"],"category":"생선·해산물","ingredients":["흰살생선","감자","밀가루"],"descriptionLength":78,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"GB|선데이 로스트","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"선데이 로스트","title":"선데이 로스트","status":"done","desc":"선데이 로스트(영어: Sunday roast)는 영국인들이 주로 일요일에 즐기는 전통적인 식사로, 보통 로스트와, 채소, 요크셔 푸딩, 그레이비 등으로 이루어진다. 영국의 국민 음식 가운데 하나로 여겨진다. 펍에서도 맛볼 수 있으며 영국의 영향을 받은 아일랜드 등의 국가에서도 찾아볼 수 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/A_roast_lamb_dinner_at_Black_Horse_Inn%2C_Nuthurst%2C_West_Sussex_England.jpg/500px-A_roast_lamb_dinner_at_Black_Horse_Inn%2C_Nuthurst%2C_West_Sussex_England.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1595608","lang":"ko","updated":"2026-10-14T00:43:02.605Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["선데이 로스트"],"category":"고기요리","ingredients":["채소"],"descriptionLength":164,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|셰퍼드 파이","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"셰퍼드 파이","title":"셰퍼드 파이","status":"done","desc":"셰퍼드 파이(영어: shepherd's pie) 또는 코티지 파이(영어: cottage pie)는 매시트 포테이토를 올려 구운 고기 파이이다. 다진 양고기로 만든 것은 \"셰퍼드 파이\", 다진 쇠고기로 만든 것은 \"코티지 파이\"라 부른다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Shepherd%27s_Pie_%288227698373%29.jpg/500px-Shepherd%27s_Pie_%288227698373%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1822377","lang":"ko","updated":"2026-10-14T00:43:03.321Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["셰퍼드 파이"],"category":"고기요리","ingredients":["쇠고기","양고기"],"descriptionLength":132,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|스콘","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"스콘","title":"스콘","status":"done","desc":"스콘(영어: scone)은 스코틀랜드에서 기원한 영국식 소형 퀵 브레드이다. 보통, 밀, 보리, 오트밀을 재료로 하여, 베이킹파우더를 팽창제(발효소) 삼아 써서 만든다. 스콘은 크림 티(다른 말로 데본셔 티)의 기본 구성 요소이다.\n상업적으로 판매되는 스콘은 일반적으로 둥근 모양이다. 집에서 구워지는 스콘은 삼각형, 원형, 입방체 등 여러 다양한 모양이다. 많은 사람들이 집에서 스콘을 만들 때는 요리책을 보고 만들기 보다 집안 고유의 방법을 따른다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Scones_cream_jam.jpg/500px-Scones_cream_jam.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=281160","lang":"ko","updated":"2026-10-14T00:43:03.932Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["스콘"],"category":"빵·밀가루","ingredients":[],"descriptionLength":253,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|해기스","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"해기스","title":"해기스","status":"done","desc":"해기스(영어: haggis, 스코틀랜드 게일어: taigeis)는 양이나 염소, 송아지의 내장이 포함된 푸딩의 일종으로, 양이나 염소, 송아지 등의 내장을 다진 양파, 오트밀, 쇠기름, 향신료, 소금 등과 섞은 뒤 그 위장에 넣어서 삶은 요리이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Haggis.JPG/500px-Haggis.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=381055","lang":"ko","updated":"2026-10-14T00:43:04.650Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["해기스"],"category":"고기요리","ingredients":["양파","게"],"descriptionLength":138,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|애프터눈 티","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"애프터눈 티","title":"티 (식사)","status":"done","desc":"애프터눈 티는 오후에 차와 함께 작은 샌드위치, 스콘, 케이크 등을 즐기는 영국의 식사 문화입니다. 여러 음식을 층층이 담은 접시에 내기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Afternoon_meal_in_Tiffin.jpg/500px-Afternoon_meal_in_Tiffin.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=978447","lang":"ko","updated":"2026-10-14T00:43:05.371Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["애프터눈 티","티 (식사)"],"category":"음료·소스","ingredients":["차","스콘","샌드위치"],"descriptionLength":82,"categoryOriginal":"수프·국물","extraCategories":["디저트·과자"]},{"id":"GB|잉글리시 브렉퍼스트","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"잉글리시 브렉퍼스트","title":"잉글리시 브렉퍼스트","status":"done","desc":"잉글리시 브렉퍼스트(영어: English breakfast)는 잉글랜드식 아침 식사이다. 풀 잉글리시 브랙퍼스트(full English breakfast)라는 이름으로도 불리는데, 여러 요리가 큰 접시를 가득 채운 모양에서 비롯된 이름이다. 프라이 업(fry-up)이라는 별칭도 있는데, 달걀, 베이컨, 소시지, 빵 등 다양한 재료를 모두 굽기 때문에 생긴 이름이다.\n유럽대륙의 대다수 국가들이 아침과 점심을 간단히 먹고 저녁을 푸짐하게 먹는 것과는 대조적으로 영국에서는 아침을 푸짐하고 든든하게 먹고 점심과 저녁을 간단하게 먹는 식문화 전통이 있다. 이런 전통은 대영제국의 황금기였던 빅토리아 여왕 시대(1837~1901)에 탄생했다. 19세기 중반에 들어 산업혁명에 따른 경제 발전으로 생활에 여유가 생긴 영국의 중산층과 유산층은 아침식사를 푸짐하고 여유있게 먹기 시작했다. 이것이 정착되어 1950년대에 들어서는 영국인들의 절반 정도가 잉글리시 브렉퍼스트를 즐겼으며, 이 같은 인기에 힘입어 호텔과 카페, 레스토랑에서도 판매되기 시작하였다.\n베이컨, 달걀, 토마토, 버섯, 빵, 버터, 소시지 등이 식탁에 올라온다. 블랙 푸딩, 베이크트 빈즈, 버블 앤드 스퀴크와 해시 브라운도 포함되는 경우가 많으며 주로 홍차와 함께 먹는다.\n오늘날에는 빵이나 시리얼 등의 간소한 메뉴를 선호하기도 하지만, 주말에는 전통적인 잉글리시 브랙퍼스트로 푸짐하게 차려 먹곤 한다. 또한 호텔 등의 숙박업소, ‘올데이브랙퍼스트(all-day-breakfast)’라는 문구를 내건 레스토랑이나 카페, 펍(pub) 등에서도 잉글랜드 지역 전통의 아침식사를 쉽게 맛 볼 수 있다.\n웨일즈, 스코틀랜드, 아일랜드에서는 각 지역마다 조금씩 다른 형태의 아침식사가 발전하였다.\n현대들어 영국에서 제조업이 쇠퇴하고 사무 노동자가 증가하면서 1000kcal가 넘는 잉글리시 브랙퍼스트를 기피하는 사람들도 많이 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Englishbreakfast.jpg/500px-Englishbreakfast.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1835905","lang":"ko","updated":"2026-10-14T00:43:06.086Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["잉글리시 브렉퍼스트"],"category":"기타·전통요리","ingredients":["토마토","달걀","버터","게","빵"],"descriptionLength":942,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GB|샌드위치","countryCode":"GB","country":"영국","flag":"🇬🇧","name":"샌드위치","title":"샌드위치","status":"done","desc":"샌드위치(sandwich)는 얇게 썬 빵 조각 사이에 육류나 채소류 등을 끼워서 먹는 간편한 식사 대용 빵을 말한다. 빵 사이에는 햄, 채소, 치즈, 잼 등 다양한 식재료를 넣으며, 통상 빵에는 열을 가하지 않으나 버터, 기름, 또는 다른 대체물, 혹은 전통적인 양념이나 소스 등을 발라서 풍미와 식감을 높이는 방식을 사용하기도 한다. 샌드위치는 흔히 학교나 직장에서 먹는 점심을 위해, 도시락 통이나 갈색 종이에 넣어서 가져가는 간편 대용식에 속한다.\n이 음식의 기원으로 볼 수 있는 유사한 형태가 고대로부터 많이 존재한다. 다만 오늘날 형태의 샌드위치는 18세기 영국의 4대 샌드위치 백작에 의해 만들어졌고, 이름은 또한 그의 이름으로부터 유래되었다는 것이 전설이다.\n샌드위치는 크게 빵 위에 재료를 올려놓는 오픈 샌드위치(Open sandwich)와 빵과 빵 사이에 속을 채워넣는 클로즈드 샌드위치(Closed sandwich)로 나뉜다. 일반적으로는 샌드위치라고 하면 이 클로즈드 샌드위치를 가리킨다. 또 샌드위치의 재료로 쓰는 빵을 구워서 만든 토스트 사이에 속을 채워넣는 핫 샌드위치(hot sandwich)도 있는데 이 경우는 보통 구운 빵을 가리키는 토스트라고 부르기도 한다.\n한국에서는 미국형 식빵을 미리 잘라놓은 두께 1cm 가량의 정사각형 빵을 많이 사용한다. 미국형 식빵이란 반죽을 굽는 틀에 뚜껑을 닫고 구워 사면이 편평하고 상자 모양을 가지고 있는 빵을 말한다. 샌드위치의 모양은 정해진 것이 아니며, 둥근 모양의 빵을 사용하는 햄버거와는 외관이나 여러 가지 차이가 있고, 빵을 구울 경우 토스트로 분류하는 등 차이점이 있다. 빵을 버터, 마가린 등을 두른 팬 위에서 굽지 않고 안쪽에 넣는 고기 등을 직접 만지지 않기 때문에 손으로 직접 집어 먹어도 손에 기름 성분이 묻지 않는다.","image":"https://upload.wikimedia.org/wikipedia/commons/2/24/Bologna_sandwich.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=144930","lang":"ko","updated":"2026-10-14T00:43:06.803Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["샌드위치"],"category":"빵·밀가루","ingredients":["치즈","버터","게","채소","빵"],"descriptionLength":900,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"DE|브라트부르스트","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"브라트부르스트","title":"브라트부르스트","status":"done","desc":"브라트부르스트는 돼지고기 등으로 만든 독일의 소시지입니다. 팬이나 그릴에 구워 빵, 머스터드와 함께 먹기도 합니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/German_Bratw%C3%BCrste.jpg/500px-German_Bratw%C3%BCrste.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2270929","lang":"ko","updated":"2026-10-14T00:43:07.519Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["브라트부르스트"],"category":"고기요리","ingredients":["돼지고기","향신료"],"descriptionLength":64,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"DE|프레첼","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"프레첼","title":"브레첼","status":"done","desc":"프레첼은 길게 늘인 반죽을 매듭 모양으로 꼬아 굽는 독일의 빵입니다. 겉에 굵은 소금을 뿌리는 경우가 많습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/BrezelnSalz02_%28cropped%29.JPG/500px-BrezelnSalz02_%28cropped%29.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=151734","lang":"ko","updated":"2026-10-14T00:43:08.133Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["프레첼","브레첼"],"category":"빵·밀가루","ingredients":["밀가루","소금","효모"],"descriptionLength":62,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"DE|자우어브라텐","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"자우어브라텐","title":"자우어브라텐","status":"done","desc":"자우어브라텐(독일어: Sauerbraten)은 독일의 고기 요리이다. 쇠고기 등을 포도주 마리네이드에 재어 뒀다가 냄비 로스트 방식으로 익힌 음식이며, 지역에 따라 조금씩 달리 만든다. 독일의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/K%C3%B6stritzer_Schwarzbierbraten_2.JPG/500px-K%C3%B6stritzer_Schwarzbierbraten_2.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=873168","lang":"ko","updated":"2026-10-14T00:43:08.854Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["자우어브라텐"],"category":"고기요리","ingredients":["쇠고기"],"descriptionLength":127,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"DE|슈페츨레","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"슈페츨레","title":"슈페츨레","status":"done","desc":"슈페츨레(Spätzle)는 밀가루에 달걀과 소금을 넣어 만드는 달걀 국수 또는 덤플링이다. 고기요리와 같은 메인 요리의 사이드 메뉴로 곁들여 서빙되는 경우가 많다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Sp%C3%A4tzle-02.jpg/500px-Sp%C3%A4tzle-02.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=873205","lang":"ko","updated":"2026-10-14T00:43:09.567Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["슈페츨레"],"category":"국수·면","ingredients":["밀가루","달걀","국수"],"descriptionLength":91,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"DE|슈니첼","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"슈니첼","title":"슈니첼","status":"done","desc":"슈니첼(독일어: Schnitzel)은 독일어권에서 고기망치 등으로 얇게 두드려 편 고기를 일컫는 말이다. 보통 튀김옷을 입혀 기름에 튀겨 먹는다.\n독일어권 밖에서는 비너 슈니첼과 같이 튀김옷 커틀릿 형태로 튀겨낸 슈니첼 요리를 일컫는 경우가 많다. 송아지고기, 양고기, 닭고기, 쇠고기, 칠면조고기, 돼지고기 등 다양한 고기를 재료로 사용하며, 프랑스 요리인 에스칼로프와 유사한 형태를 갖고 있다.\n이름의 유래는 '음식을 얇게 썬 조각'라는 의미의 중세 고지 독일어의 단어인 Sniz에서 파생된 Snitzel이며, 19세기 비너 슈니첼이 대중적으로 펴지며 본격적으로 자리잡았다.\n슈니첼은 사용하는 재료에 따라서 송아지 고기로 만든 슈니첼 이외에도 돼지고기로 만든 슈바인슈니첼, 닭고기로 만든 후너슈니첼 등 다양한 갈래로 나뉜다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Schweineschnitzel.jpg/500px-Schweineschnitzel.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1322316","lang":"ko","updated":"2026-10-14T00:43:10.284Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["슈니첼"],"category":"고기요리","ingredients":["김","돼지고기","쇠고기","닭고기","게"],"descriptionLength":407,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"DE|슈바르츠발트 케이크","countryCode":"DE","country":"독일","flag":"🇩🇪","name":"슈바르츠발트 케이크","title":"슈바르츠발트 케이크","status":"done","desc":"슈바르츠발트 케이크는 초콜릿 시트 사이에 생크림과 체리를 넣는 독일의 케이크입니다. 이름은 독일의 슈바르츠발트 지역에서 왔습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Black_Forest_gateau.jpg/500px-Black_Forest_gateau.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1840858","lang":"ko","updated":"2026-10-14T00:43:11.001Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["슈바르츠발트 케이크"],"category":"디저트·과자","ingredients":["초콜릿","체리","생크림"],"descriptionLength":72,"categoryOriginal":"디저트","extraCategories":[]},{"id":"GR|무사카","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"무사카","title":"무사카","status":"done","desc":"무사카(moussaka)는 그리스, 레반트, 발칸반도, 이집트, 튀르키예에서 먹는 전통 채소 요리이다. 지역에 따라 여러 가지 형태가 있으나, 주로 가지나 감자를 기반으로 만드는 음식이며, 대개 다진 고기가 들어가지만 채식 버전도 존재한다. 1920년대에 그리스 요리사 니콜라오스 첼레멘데스가 만든 버전이 유명하며, 이 버전이 그리스의 국민 음식이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/MussakasMeKolokithakiaKePatates.jpg/500px-MussakasMeKolokithakiaKePatates.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=534742","lang":"ko","updated":"2026-10-14T00:43:11.719Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["무사카"],"category":"고기요리","ingredients":["감자","채소"],"descriptionLength":200,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"GR|수블라키","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"수블라키","title":"수블라키","status":"done","desc":"수블라키(그리스어: σουβλάκι) 또는 칼라마키(그리스어: καλαμάκι)는 그리스의 꼬치구이이다. 꼬챙이에 고기와 때때로 채소를 꿰어 구워 만드는 요리로, 그리스 외에도 키프로스에서도 즐겨 먹는다. 그리스의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Souvlaki_457.jpg/500px-Souvlaki_457.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=873728","lang":"ko","updated":"2026-10-14T00:43:12.437Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["수블라키"],"category":"고기요리","ingredients":["채소"],"descriptionLength":139,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"GR|그릭 샐러드","countryCode":"GR","country":"그리스","flag":"🇬🇷","name":"그릭 샐러드","title":"과일 샐러드","status":"candidate","desc":"과일 샐러드(Fruit salad)는 과일이 들어간 샐러드이다.\n과일뿐만 아니라, 콘플레이크, 드레싱, 요구르트 등을 곁들여 먹기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Fruktsallad_%28Fruit_salad%29.jpg/500px-Fruktsallad_%28F 표준 아랍어: مُلُوخِيَّة 물루키야[*])는 이집트 등지에서 채소로 먹는 장삭황마 잎을 일컫는 말이며, 장삭황마 잎을 주재료로 끓인 음식을 일컫는 말이기도 하다. 이집트의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Molokheya_hi_res.JPG/500px-Molokheya_hi_res.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2468355","lang":"ko","updated":"2026-10-14T00:43:22.470Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["몰로키야"],"category":"수프·국물","ingredients":["채소"],"descriptionLength":142,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"EG|파타","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"파타","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=170042","lang":"ko","updated":"2026-10-14T00:43:23.188Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 이집트 음식이 아닌 팔레스타인 정당에 관한 내용입니다."],"aliases":["파타"],"category":"쌀·밥","ingredients":[],"descriptionLength":0,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"EG|바스부사","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"바스부사","title":"바스부사","status":"done","desc":"바스부사(Basbousa, 이집트 아랍어: بسبوسة, 로마자: basbūsah)는 이집트에서 시작된 달콤한 시럽에 적신 세몰리나 케이크이다. 세몰리나 반죽은 시트 팬에서 구운 다음 오렌지 꽃수, 장미수 또는 단순 시럽으로 달게 하고 일반적으로 다이아몬드(마름모꼴) 모양 또는 사각형으로 자른다. 이 요리는 또한 과거 오스만 제국 대부분 지역에 퍼졌으며 일반적으로 중동 요리, 마그레브 요리, 그리스 요리, 아제르바이잔 요리, 에티오피아 요리 및 기타 여러 요리에서 찾아볼 수 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/Basboosa.jpg/500px-Basboosa.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3662085","lang":"ko","updated":"2026-10-14T00:43:23.903Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["바스부사"],"category":"디저트·과자","ingredients":["게"],"descriptionLength":271,"categoryOriginal":"디저트","extraCategories":[]},{"id":"EG|풀 메다메스","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"풀 메다메스","title":"스트로베리 딜라이트","status":"candidate","desc":"스트로베리 딜라이트(영어: Strawberry delight)는 미국, 특히 남부와 미네소타주의 농촌 지역에서 볼 수 있는 디저트 샐러드이다. 스트로베리 딜라이트는 그레이엄 크래커 크러스트 위에 우유, 휘핑 토핑, 크림 치즈, 딸기 및 딸기 젤라틴을 얹어 만든다. 변형된 형태로는 아이스크림, 통조림 과일(귤이나 파인애플이 사용됨), 마시멜로, 레몬즙, 호두 등의 재료가 포함될 수 있다. 크러스트 재료를 섞어서 팬에 눌러 담고, 크림 형태의 재료들을 섞어서 그 위에 올린다. 딸기 젤라틴 가루에 끓는 물을 붓고 딸기를 섞은 다음, 이 혼합물을 팬에 담긴 크림 층 위에 붓고 냉장고에서 굳힌다.\n스트로베리 딜라이트라는 이름은 쿠키, 케이크, 그리고 비슷하게 분홍빛이 돌고 달콤한 특성을 가진 다른 음식들을 지칭할 때도 사용된다. 스펀지 케이크와 아이스크림을 곁들인 소다 파운틴 버전이 1922년판 《소다 파운틴》(The Soda fountain) 소식지에 소개되기도 했다.\n페르시아 요리에서 스트로베리 딜라이트(deser-e toot farangi)는 바닐라와 장미수(rosewater) 향을 낸 액체 설탕에 딸기를 담가서 만든다. 딸기, 호두 또는 아몬드 오일, 분유를 섞은 재료는 \"스트로베리 딜라이트\" 보습제 피부 크림으로 제안되기도 했다. 스트로베리 딜라이트라는 이름은 비비추속(H. longipes X H. pycnophylla)과 푸크시아 품종에도 붙여졌다. 인도네시아어-영어 독본에도 한 버전이 수록된 바 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Strawberry_Delight.jpg/500px-Strawberry_Delight.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4138371","lang":"ko","updated":"2026-10-14T00:43:24.827Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["풀 메다메스","스트로베리 딜라이트"],"category":"콩·유제품","ingredients":["치즈","우유","게"],"descriptionLength":741,"categoryOriginal":"디저트","extraCategories":[]},{"id":"EG|아이시 발라디","countryCode":"EG","country":"이집트","flag":"🇪🇬","name":"아이시 발라디","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=66498","lang":"ko","updated":"2026-10-14T00:43:25.542Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 이집트의 빵이 아닌 빵 일반 문서입니다."],"aliases":["아이시 발라디","빵"],"category":"빵·밀가루","ingredients":["쌀","감자","밀가루","버터","옥수수"],"descriptionLength":0,"categoryOriginal":"디저트","extraCategories":[]},{"id":"ZA|보보티","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"보보티","title":"보보티","status":"done","desc":"보보티(아프리칸스어: bobotie)는 남아프리카 공화국의 고기 요리이다. 양념한 다진 고기에 달걀 토핑을 올린 뒤 오븐에 구워 만든 음식으로, 남아프리카의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Bobotie%2C_South_African_dish.jpg/500px-Bobotie%2C_South_African_dish.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1866928","lang":"ko","updated":"2026-10-14T00:43:26.259Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["보보티"],"category":"고기요리","ingredients":["달걀"],"descriptionLength":107,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ZA|브라이","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"브라이","title":"브라이","status":"done","desc":"브라이(아프리칸스어: braai)는 남아프리카 지역의 바비큐이다. 남아프리카 공화국 아프리카너 전통이지만, 나미비아, 레소토, 보츠와나, 잠비아, 짐바브웨 등 주변국에도 브라이 문화가 널리 퍼져 있다. 남아프리카 공화국의 국민 음식 가운데 하나이기도 하다. 남아프리카 공화국에서는 매년 9월 24일을 \"브라이의 날\"로 기념한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fe/Backyard_Braai.jpg/500px-Backyard_Braai.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2885634","lang":"ko","updated":"2026-10-14T00:43:26.977Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["브라이"],"category":"고기요리","ingredients":[],"descriptionLength":183,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"ZA|빌통","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"빌통","title":"빌통","status":"done","desc":"빌통(아프리칸스어: biltong)는 나미비아, 남아프리카 공화국, 짐바브웨의 염지·건조식품이다. 쇠고기와 사냥 고기부터 필레까지, 여러 종류의 고기를 근섬유 결대로 채썰거나 결 반대 방향으로 얇게 저며 만든다. 과거에는 스프링복이나 큰쿠두 등 사냥감을 활용해 만들었으나, 오늘날은 쇠고기와 타조고기를 많이 쓴다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Sliced_Biltong.jpg/500px-Sliced_Biltong.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1837817","lang":"ko","updated":"2026-10-14T00:43:27.690Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["빌통"],"category":"고기요리","ingredients":["쇠고기","게"],"descriptionLength":175,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ZA|버니 차우","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"버니 차우","title":"버니 차우","status":"done","desc":"버니 차우는 속을 파낸 빵 안에 카레를 듬뿍 담아 먹는 남아프리카공화국 더반 지역의 음식입니다. 빵을 뜯어 카레와 함께 먹습니다.","image":"https://upload.wikimedia.org/wikipedia/commons/7/70/Quarter_Mutton_Bunny_Chow.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=1866910","lang":"ko","updated":"2026-10-14T00:43:28.409Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["버니 차우"],"category":"빵·밀가루","ingredients":["빵","카레","채소"],"descriptionLength":72,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"ZA|보어워스","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"보어워스","title":"코스워스 DFV","status":"candidate","desc":"DFV 엔진은 포뮬러 원 자동차 경주를 위해 코스워스가 제작한 내연기관이다. DFV는 더블 포 밸브(Double Four Valve)의 약자로, 실린더 당 4개의 밸브가 있었던 4기통 FVA 엔진의 V8 엔진으로 개발되었기 때문에 붙은 이름이다.\nDFV 엔진은 1967년 콜린 채프먼의 팀 로터스에서 개발하였으며, 미국의 자동차 제조사인 포드가 지원하였다. DFV 엔진은 1960년대 후반부터 1980년대 중반까지 포뮬러 원에서 널리 사용되었으며 자체 제작한 엔진을 사용했던 페라리, 알파 로메오, 르노, BRM과 마트라 등의 팀을 제외한 팀들에서 채용하였다. 또한 DFV 엔진의 변형 엔진들이 CART, 포뮬러 3000, 스포츠카 레이싱 등 다른 유형의 경주에서 사용되었다.\nDFV 엔진은 90도, 2,993cc V8 엔진으로 보어와 스트로크는 85.77 × 64.90 mm이다. 엔진은 400bhp 이상을 지속적으로 출력할 수 있으며 9,000rpm에서 407bhp에 도달하고, 7,000rpm에서 370 N⋅m의 토크를 발생시킨다. 후기에 사용된 DFV 엔진은 11,200rpm에서 최대 510bhp를 출력하였다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Cosworth_DFV.jpg/500px-Cosworth_DFV.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3873233","lang":"ko","updated":"2026-10-14T00:43:29.125Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["보어워스","코스워스 DFV"],"category":"고기요리","ingredients":[],"descriptionLength":570,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"ZA|밀크타르트","countryCode":"ZA","country":"남아프리카공화국","flag":"🇿🇦","name":"밀크타르트","title":"동티모르 요리","status":"candidate","desc":"동티모르 요리(東Timor 料理, 테툼어: hahaan Timor 하한 티모르, 포르투갈어: cozinha timorense 코지냐 티모렌스[*])는 해양 동남아시아에 있는 동티모르의 요리이다. 토착 오스트로네시아 식문화 전통과 포르투갈 식민 지배의 유산이 융합된 독특한 형태로, 그 외에도 말레이 요리 등 다양한 영향을 받아 형성되었다.\n동티모르에서 음식은 의례와 가족 공동체 생활에서 중요한 역할을 하며, 조리법은 주로 구전을 통해 전승된다. 페이조아다나 파스텔 드 나타 같은 포르투갈 요리는 현지 식재료를 활용하여 재해석되었다.\n농업 중심의 생계 구조는 식문화 전반에 깊이 반영되어 있으며, 동물 사육과 어업도 주요한 식량 공급원이다. 쌀, 옥수수, 카사바, 토란, 고구마 등 주식 작물과 콩류, 닭고기와 돼지고기, 생선, 열대 과일 등이 주된 식재료이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1d/IkanPepes.JPG/500px-IkanPepes.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2869911","lang":"ko","updated":"2026-10-14T00:43:29.843Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["밀크타르트","동티모르 요리"],"category":"디저트·과자","ingredients":["쌀","생선","돼지고기","닭고기","콩"],"descriptionLength":426,"categoryOriginal":"디저트","extraCategories":[]},{"id":"PH|아도보","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"아도보","title":"아도보 (스페인 음식)","status":"done","desc":"아도보 (스페인어: Adobo, 재우기, 소스 (음식) 또는 양념)는 음식의 맛을 보존하고 향상시키기 위해 다양한 파프리카 가루, 오레가노, 소금, 마늘, 식초로 구성된 육수(또는 소스)에 음식을 담그는 것을 말한다. 포르투갈 요리의 변형은 카르느 드 비냐달류스로 알려져 있다. 이베리아반도(스페인 요리 및 포르투갈 요리)에 고유한 이 관행은 라틴아메리카 요리, 그리고 아프리카와 아시아의 스페인 및 포르투갈 식민지에서 널리 채택되었다.\n필리핀에서는 식민지 시대 스페인인들이 섬의 식초를 사용하는 다른 원주민 요리 방식에 아도보라는 이름을 붙였다. 비슷하지만, 이것은 스페인의 영향과 별개로 발전했다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Lomo_en_adobo-2009.jpg/500px-Lomo_en_adobo-2009.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4052475","lang":"ko","updated":"2026-10-14T00:43:30.559Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["아도보","아도보 (스페인 음식)"],"category":"고기요리","ingredients":["마늘"],"descriptionLength":336,"categoryOriginal":"음료·소스","extraCategories":[]},{"id":"PH|시니강","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"시니강","title":"시니강","status":"done","desc":"시니강은 타마린드 등으로 새콤한 맛을 내는 필리핀의 국물 요리입니다. 돼지고기나 새우, 생선과 채소를 넣어 끓입니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Sinigang_na_Baboy.jpg/500px-Sinigang_na_Baboy.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1866701","lang":"ko","updated":"2026-10-14T00:43:31.278Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["시니강"],"category":"수프·국물","ingredients":["타마린드","채소","고기 또는 해산물"],"descriptionLength":65,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"PH|레촌","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"레촌","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=1866036","lang":"ko","updated":"2026-10-14T00:43:31.993Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 구운 돼지요리가 아닌 어린 돼지의 정의입니다."],"aliases":["레촌","애저 (돼지)"],"category":"고기요리","ingredients":[],"descriptionLength":0,"categoryOriginal":"고기요리","extraCategories":[]},{"id":"PH|판싯","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"판싯","title":"판싯","status":"done","desc":"판싯(필리핀어: pansit, 영어: pancit)은 필리핀의 국수 요리이다. 볶음국수인 경우가 많으나 국물국수 등 다른 방식으로 조리하기도 한다. 쌀국수, 달걀 국수 등 여러 가지 국수가 사용되며, 흔히 칼라만시를 곁들여 낸다. 필리핀의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/5058Baliuag_Bulacan_Landmarks_during_the_2020_coronavirus_pandemic_24.jpg/500px-5058Baliuag_Bulacan_Landmarks_during_the_2020_coronavirus_pandemic_24.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1984196","lang":"ko","updated":"2026-10-14T00:43:32.709Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["판싯"],"category":"국수·면","ingredients":["쌀","달걀","국수"],"descriptionLength":153,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"PH|룸피아","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"룸피아","title":"룬삐앙","status":"candidate","desc":"룬삐앙(민난어: lūn-piáⁿ, 중국어 간체자: 润饼, 정체자: 潤餅, 병음: rùnbǐng 룬빙[*])은 동남아시아에서 즐겨 먹는 푸젠·차오저우식 롤 요리이다. 중국의 푸젠과 차오저우, 그리고 이곳 출신 이주민이 많은 동남아시아 국가에서 먹는 청명절 음식이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/%E6%BD%A4%E9%A4%85_%286451823745%29.jpg/500px-%E6%BD%A4%E9%A4%85_%286451823745%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1981834","lang":"ko","updated":"2026-10-14T00:43:33.427Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["룸피아","룬삐앙"],"category":"튀김·간식","ingredients":[],"descriptionLength":147,"categoryOriginal":"빵·만두","extraCategories":["빵·밀가루"]},{"id":"PH|할로할로","countryCode":"PH","country":"필리핀","flag":"🇵🇭","name":"할로할로","title":"할로할로","status":"done","desc":"할로할로(타갈로그어: halo-halo) 또는 할루할로(타갈로그어: haluhalo)는 빙수와 비슷한 필리핀의 후식이다. 필리핀의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Halo_halo1.jpg/500px-Halo_halo1.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1969072","lang":"ko","updated":"2026-10-14T00:43:34.143Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["할로할로"],"category":"디저트·과자","ingredients":[],"descriptionLength":92,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"SG|하이난 치킨라이스","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"하이난 치킨라이스","title":"하이난 치킨라이스","status":"done","desc":"하이난 치킨 라이스(영어: Hainanese chicken rice 하이나니즈 치킨 라이스[*]; 중국어 (싱가포르): 海南鸡饭, hǎinán jīfàn 하이난 지판[*])는 삶은 닭고기와 닭을 삶은 육수에 지은 밥을 양념하여 함께 내는 음식으로 보통 칠리 소스와 오이 고명을 함께 제공한다.\n이 요리는 중국 남부 하이난에서 남양(중국어: 南洋), 즉 동남아시아로 이주한 이민자들에 의해 탄생한 음식으로, 하이난의 원창닭 요리에서 유래한다. 하이난 치킨라이스가 처음 탄생한 곳은 싱가포르로 여겨지며, 싱가포르 전역의 푸드코트나 노점에서 쉽게 찾아볼 수 있는 싱가포르의 대표적인 국민 음식 중 하나이다.\n또한 하이난 출신 사람들이 이주한 동남아시아의 여러 지역에서도 비슷한 형태의 요리를 찾아볼 수 있다. 특히 인도네시아, 말레이시아, 태국, 베트남 등지에서도 하이난 치킨라이스는 널리 사랑받는 일상적인 음식이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/71/Hainanese_Chicken_Rice.jpg/500px-Hainanese_Chicken_Rice.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1822414","lang":"ko","updated":"2026-10-14T00:43:34.863Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["하이난 치킨라이스"],"category":"쌀·밥","ingredients":["닭고기","치킨","게","밥"],"descriptionLength":454,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"SG|칠리크랩","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"칠리크랩","title":"칠리 크랩","status":"done","desc":"칠리 크랩(영어: chilli crab)는 싱가포르의 게 요리이다. 토마토와 고추가 들어간 매운 소스를 곁들인 게 요리로, 1960년대에 싱가포르에서 만들어져 인기를 얻었으며, 이웃한 말레이시아에서도 즐겨 먹는다. 싱가포르의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Chilli_crab-02.jpg/500px-Chilli_crab-02.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=115504","lang":"ko","updated":"2026-10-14T00:43:35.577Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["칠리크랩","칠리 크랩"],"category":"생선·해산물","ingredients":["토마토","게"],"descriptionLength":145,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"SG|락사","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"락사","title":"락사","status":"done","desc":"락사(자위: لقسا‎; 중국어: 叻沙)는 동남아시아에서 인기 있는 매운 국수 요리이다. 락사는 다양한 종류의 국수, 가장 일반적으로 두꺼운 쌀국수와 닭고기, 새우 또는 생선과 같은 토핑으로 구성된다. 락사의 대부분의 변형은 풍부하고 매운 코코넛 커리 수프 또는 타마린드나 아삼 길루구르와 같은 신맛을 내는 재료로 양념한 육수로 준비된다.\n페라나칸 중국 요리에서 유래한 락사 레시피는 일반적으로 싱가포르, 인도네시아, 말레이시아에서 제공된다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Nyonya_Laksa.jpg/500px-Nyonya_Laksa.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=146600","lang":"ko","updated":"2026-10-14T00:43:36.294Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["락사"],"category":"국수·면","ingredients":["쌀","생선","닭고기","새우","코코넛"],"descriptionLength":247,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"SG|카야토스트","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"카야토스트","title":"카야 토스트","status":"done","desc":"카야 토스트(영어: Kaya Toast)는 카야잼을 넣어 만든 토스트이다. 설탕이나 코코넛 밀크, 판단잎, 때때로 마가린이나 버터를 토핑으로 얹어 먹기도 한다. 토스트로서 나오는 경우가 많지만 일부는 크래커로 간주한다. 싱가포르의 국민 요리 중 하나이다.\n싱가포르에서 카야 토스트는 아주 유명하며, 일부 지역에서는 카야 토스트를 주식으로 삼는다. 살짝 익힌 계란을 카야 토스트와 함께 곁들여 먹기도 한다. 싱가포르와 말레이시아의 많은 커피 하우스에서 카야 토스트를 커피와 함께 팔기 때문에 이 지역의 사람들은 커피와 함께 카야 토스트를 먹는 경우가 많다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Dessert_Merlion_Singapore_Cafe_Kaya_Toast.jpg/500px-Dessert_Merlion_Singapore_Cafe_Kaya_Toast.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1235072","lang":"ko","updated":"2026-10-14T00:43:37.010Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["카야토스트","카야 토스트"],"category":"빵·밀가루","ingredients":["버터","코코넛"],"descriptionLength":310,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"SG|바쿠테","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"바쿠테","title":"바쿠테","status":"done","desc":"바쿠테(말레이어: bak kut teh, 중국어: 肉骨茶)는 돼지갈비를 국물에 고아 만든 음식이다. 말레이시아와 싱가포르에 뿌리를 내린 중국 복건성 출신 이민자들에 의해서 소개되었다. 두 나라 외에 태국 남부와 인도네시아의 리아우 섬 주민들도 자주 즐겨 먹는 음식 중의 하나이다. 주 재료로는 돼지갈비, 돼지부속물, 팔각회향, 계피, 정향 봉오리, 당귀, 마늘, 회향씨앗, 버섯, 과 그 외 각종 약재들을 섞어 수 시간 동안 끌여 만든다. 주로 쌀밥과 길게 두 가닥으로 반죽된 밀가루를 기름에 튀겨서 만든 유조(유티아오, 油條)와 함께 먹는다. =\n요리 이름에 차 (茶)라는 단어가 들어감에도 불구하고 실제로 요리에는 “차”가 첨가되지 않는다. 대신 현지 화교들은 바꿋떼와 함께 오룡차를 같이 먹는 식습관이 전통적으로 전해 내려오고 있다.  그 외 소스로는 칠리파디(쥐똥고추, 새눈고추)라는 매운고추와 마늘에 간장을 섞은 양념장을 같이 곁들여 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Bakutteh.jpg/500px-Bakutteh.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1130298","lang":"ko","updated":"2026-10-14T00:43:37.731Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["바쿠테"],"category":"수프·국물","ingredients":["쌀","밀가루","게","마늘","밥"],"descriptionLength":476,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"SG|차퀘이테오","countryCode":"SG","country":"싱가포르","flag":"🇸🇬","name":"차퀘이테오","title":"2018-19년 UEFA 유로파리그","status":"candidate","desc":"2018-19년 UEFA 유로파리그(2018-19 UEFA Europa League)는 유럽 축구 연맹이 주관하는 유럽의 두 번째 권위를 가진 축구 대회의 48번째 시즌이자, UEFA컵에서 UEFA 유로파리그로 바뀐 뒤 10번째 시즌이다. 결승전은 아제르바이잔의 수도 바쿠에 위치한 바쿠 올림픽 경기장에서 개최되었다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Baku_Olympic_Stadium_panorama_1.JPG/500px-Baku_Olympic_Stadium_panorama_1.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1864707","lang":"ko","updated":"2026-10-14T00:43:38.444Z","verification":"","risk":"차단 권고","reasons":["비음식 주제 가능성","등록 이름·별칭과 검색 제목 불일치"],"aliases":["차퀘이테오","2018-19년 UEFA 유로파리그"],"category":"국수·면","ingredients":[],"descriptionLength":177,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"MY|나시르막","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"나시르막","title":"나시 르막","status":"done","desc":"나시 르막(말레이어·인도네시아어: nasi lemak)은 말레이시아의 코코넛밥이다. 말레이시아, 인도네시아(수마트라섬), 브루나이, 싱가포르, 태국(남부), 필리핀(방사모로) 등 동남아시아 지역 및 인접한 오스트레일리아(크리스마스섬과 코코스제도) 지역에서 먹는 대표적인 말레이 요리이며, 말레이시아의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Nasi_lemak_basic.jpg/500px-Nasi_lemak_basic.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1130081","lang":"ko","updated":"2026-10-14T00:43:39.163Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["나시르막","나시 르막"],"category":"쌀·밥","ingredients":["코코넛","밥"],"descriptionLength":187,"categoryOriginal":"쌀·밥","extraCategories":[]},{"id":"MY|차퀘이테오","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"차퀘이테오","title":"2018-19년 UEFA 유로파리그","status":"candidate","desc":"2018-19년 UEFA 유로파리그(2018-19 UEFA Europa League)는 유럽 축구 연맹이 주관하는 유럽의 두 번째 권위를 가진 축구 대회의 48번째 시즌이자, UEFA컵에서 UEFA 유로파리그로 바뀐 뒤 10번째 시즌이다. 결승전은 아제르바이잔의 수도 바쿠에 위치한 바쿠 올림픽 경기장에서 개최되었다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Baku_Olympic_Stadium_panorama_1.JPG/500px-Baku_Olympic_Stadium_panorama_1.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1864707","lang":"ko","updated":"2026-10-14T00:43:39.878Z","verification":"","risk":"차단 권고","reasons":["비음식 주제 가능성","등록 이름·별칭과 검색 제목 불일치"],"aliases":["차퀘이테오","2018-19년 UEFA 유로파리그"],"category":"국수·면","ingredients":[],"descriptionLength":177,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"MY|로티차나이","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"로티차나이","title":"로티 차나이","status":"done","desc":"로티 차나이(말레이어·인도네시아어: roti canai)는 말레이시아·브루나이·싱가포르·인도네시아 등지에서 먹는 납작빵이다. 말레이시아 남부와 싱가포르에서는 로티 프라타(말레이어: roti prata)라 부르며, 태국에서는 로띠(태국어: โรตี)로 알려져 있다.","image":"https://upload.wikimedia.org/wikipedia/commons/5/56/Canai.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=1139492","lang":"ko","updated":"2026-10-14T00:43:40.801Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["로티차나이","로티 차나이"],"category":"빵·밀가루","ingredients":["빵"],"descriptionLength":147,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"MY|사테","countryCode":"MY","country":"말레이시아","flag":"🇲🇾","name":"사테","title":"사테","status":"done","desc":"사테(말레이어·인도네시아어: sate, 자와어: saté)는 인도네시아, 말레이시아, 브루나이, 싱가포르를 비롯한 동남아시아 지역에서 먹는 고기 꼬치 구이이다. 대표적인 자와 요리로, 인도네시아와 말레이시아의 국민 음식 가운데 하나로 여겨진다. 태국과 필리핀 등 주변 지역뿐 아니라, 인도네시아를 식민 지배했던 네덜란드와 네덜란드의 식민 지배를 받았던 수리남, 말레이계 이민자가 많은 스리랑카 등에서도 즐겨 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Satay_2.jpg/500px-Satay_2.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=88187","lang":"ko","updated":"2026-10-14T00:43:4 배추와 함께 푹 익혀서 삶은 감자와 함께 낸다. 노르웨이의 국민 음식으로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/F%C3%A5r_i_k%C3%A5l.jpg/500px-F%C3%A5r_i_k%C3%A5l.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1840847","lang":"ko","updated":"2026-10-14T00:43:43.871Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["포리콜","Fårikål"],"category":"수프·국물","ingredients":["감자","양고기"],"descriptionLength":113,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"NO|루테피스크","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"루테피스크","title":"루테피스크","status":"done","desc":"루테피스크(노르웨이어: Lutefisk, 스웨덴어: lutfisk, 덴마크어: ludfisk, 핀란드어: lipeäkala)는 스웨덴, 덴마크, 노르웨이 등 노르딕 국가의 전통 요리이다. 건조된 흰살 생선이나 클리프피스크(염건어, 주로 염대구)로 만들어진다. 자연풍으로 말린 흰살 생선(주로 대구)를 며칠 동안 처음에는 깨끗한 물로, 나중에는 잿물로 불려서 만든다. 먹을 때는 그냥 먹거나 버터와 함께 오븐에 구워서 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Norway-Lutefisk-01.jpg/500px-Norway-Lutefisk-01.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=998438","lang":"ko","updated":"2026-10-14T00:43:45.103Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["루테피스크"],"category":"생선·해산물","ingredients":["생선","버터"],"descriptionLength":237,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"NO|라크피스크","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"라크피스크","title":"라크피스크","status":"done","desc":"라크피스크(노르웨이어: rakfisk)는 전통적인 동부 노르웨이 음식으로, 송어나 곤들매기 종류 생선을 소금에 절여 두세 달 동안 절인 후 조리 없이 먹는다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Rakfisk.jpg/500px-Rakfisk.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=144443","lang":"ko","updated":"2026-10-14T00:43:45.816Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["라크피스크"],"category":"생선·해산물","ingredients":["생선"],"descriptionLength":88,"categoryOriginal":"해산물","extraCategories":[]},{"id":"NO|브루노스트","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"브루노스트","title":"브루노스트","status":"done","desc":"브로노스트(노르웨이어: Brunost)는 노르웨이를 대표하는 갈색 유청 치즈이다. 노르웨이어로 갈색 치즈라는 뜻이며, 주재료인 유청을 의미하는 뮈세를 붙여 뮈소스투라고도 불린다. 일반적인 치즈가 레닛을 이용해 우유의 단백질(카세인)을 응고시켜 만드는 것과 달리, 브로노스트는 치즈 제조 후 남은 유청을 오랜 시간 끓여 유당을 캐러멜화시키는 방식으로 만들어진다. 이 독특한 제조법 덕분에 짭짤하고 발효된 맛 대신, 달콤하고 깊은 캐러멜 풍미를 지니게 되어 노르웨이의 국민 음식으로 확고히 자리 잡았다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Braunkaese.jpg/500px-Braunkaese.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2024331","lang":"ko","updated":"2026-10-14T00:43:46.533Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["브루노스트"],"category":"콩·유제품","ingredients":["치즈","우유","게"],"descriptionLength":279,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"NO|크룸카케","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"크룸카케","title":"크룸카케","status":"done","desc":"크룸카케(노르웨이어: Krumkake, 노르웨이어 발음: [ˈkrʊ̀mˌkɑːkə], '구부러진 케이크'라는 뜻, 복수형: 노르웨이어: krumkaker)는 곡분, 버터, 식용란, 설탕, 크림으로 만드는 노르웨이 쿠키이다.\n이탈리아의 피첼레나 칸놀로와 유사하며, 와플기와 비슷한 장식용 양면 철판을 사용하여 얇고 둥근 케이크를 굽는 것이 전통적이다. 구형 철판은 스토브 위에서 사용하지만, 현대적인 전기 철판은 눌어붙지 않는 표면, 자동 타이머, 한 번에 여러 개를 구울 수 있는 편의성을 제공한다. 뜨거울 때 13~20cm 크기의 크룸카케를 나무나 플라스틱으로 된 원뿔형 틀에 말아 작은 원뿔 모양으로 만든다. 크룸카케는 그대로 먹거나 휘핑크림 또는 다른 속재료를 채워 먹을 수 있다.\n이 비스킷은 노르웨이뿐만 아니라 노르웨이계 미국인 이민자와 그 후손들의 기여 덕분에 미국 뉴잉글랜드와 미국 중서부 지역의 요리에서도 발견된다. 크룸카케는 전통적으로 산바켈세나 로세트와 같은 다른 북유럽 기원의 쿠키와 함께 크리스마스 만찬 준비를 대비하여 제조된다. 이는 전통적인 크리스마스 이브 만찬 후에 달콤한 디저트로 제공된다.\n독일에서 이 쿠키는 보통 달콤한 속재료를 채워 먹는다. 또한 아이스크림 콘의 종류로도 사용된다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/1krumkake.jpg/500px-1krumkake.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4125496","lang":"ko","updated":"2026-10-14T00:43:47.353Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["크룸카케"],"category":"디저트·과자","ingredients":["버터"],"descriptionLength":624,"categoryOriginal":"디저트","extraCategories":[]},{"id":"FI|카르얄란피이라카","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"카르얄란피이라카","title":"굽타기원","status":"candidate","desc":"굽타기원은 서기  318c.~319년부터 시작하는 역사적인 기년법이다. 이 기년법은 굽타 제국의 황제들과 그들의 가신들, 그리고 오늘날의 북인도와 네팔에 있는 후계자들이 사용했다. 서인도의 사우라슈트라 지역에서 사용된 발라비기원(또는 발라비 시대)과 동일하지만, 지역적 차이로 인해 발라비 기원년을 공통 기원으로 환산하는 방식에 약간의 차이가 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Buddha%2C_standing%2C_inscribed_Gift_of_Abhayamira_in_154_GE_474_CE_in_the_reign_of_Kumaragupta_II_Sarnath_Museum.jpg/500px-Buddha%2C_standing%2C_inscribed_Gift_of_Abhayamira_in_154_GE_474_CE_in_the_reign_of_Kumaragupta_II_Sarnath_Museum.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4055658","lang":"ko","updated":"2026-10-14T00:43:48.274Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["카르얄란피이라카","굽타기원"],"category":"빵·밀가루","ingredients":[],"descriptionLength":195,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"FI|로히케이토","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"로히케이토","title":"로히케이토","status":"done","desc":"로히케이토는 연어와 감자, 리크 등을 넣어 끓이는 핀란드의 부드러운 수프입니다. 우유나 크림과 딜을 넣어 고소하고 향긋하게 만듭니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b7/Lohikeitto.jpg/500px-Lohikeitto.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2006025","lang":"ko","updated":"2026-10-14T00:43:48.994Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["로히케이토"],"category":"수프·국물","ingredients":["연어","감자","크림"],"descriptionLength":74,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"FI|포론카리스튀스","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"포론카리스튀스","title":"율리우스 카이사르","status":"candidate","desc":"가이우스 율리우스 카이사르(라틴어: Gaius Julius Caesar: 기원전 100년 7월 12일 ~ 기원전 44년 3월 15일) 또는 줄리어스 시저는 로마 공화국의 정치인, 장군, 작가이다. 그는 로마 공화국이 로마 제국으로 변화하는 데 중요한 역할을 하였다.\n정치적으로 카이사르는 민중파의 노선에 섰다. 기원전 60년대 말에서 50년대에 이르기까지 그는 마르쿠스 리키니우스 크라수스, 그나이우스 폼페이우스 마그누스와 소위 제1차 삼두 정치라는 초법적 정치 연대를 이루어 수년간 로마 정계를 장악하였다. 이들 파벌은 자신들끼리 권력을 분점하고자 하여, 원로원 내에서 마르쿠스 포르키우스 카토, 마르쿠스 칼푸르니우스 비불루스 등 벌족파의 반대를 받았으며, 마르쿠스 툴리우스 키케로가 이에 가세하기도 하였다. 카이사르는 갈리아를 정복(기원전 58년 ~ 52년)하여 로마 제국의 영토를 북해까지 넓혔으며, 기원전 55년에는 로마인 처음으로 브리타니아 침공을 감행하였다. 이러한 공훈 덕분에 카이사르는 강력한 세력가로 입지를 굳혀 폼페이우스를 위협하게 되었으며, 카라이 전투에서 크라수스가 전사하면서 삼두정의 두 정치가 사이에 긴장이 높아졌다. 이렇듯 로마 정계가 재편되면서 카이사르와 폼페이우스는 서로 대치하게 되었으며, 폼페이우스는 원로원의 대의를 내세웠다. 카이사르는 자신의 군단으로 하여금 루비콘강을 건너게 하는 결단을 내려 기원전 48년에 내전이 일어났으며, 파르살루스 전투, 탑수스 전투 등에서 승리한 카이사르는 로마 세계에서 무소불위의 권력자로 등극하였다.\n정권을 장악한 뒤 그는 로마의 사회와 정치에 광범위한 개혁을 실시하였다. 그는 공화정의 귀족 정치를 고도로 중앙집권화하였으며, 급기야 자신을 종신독재관으로 선언하였다. 기원전 44년 3월 15일에 마르쿠스 유니우스 브루투스가 이끄는 일군의 원로원 의원들이 공화정을 복고하고자 음모를 꾸며 카이사르를 암살하였다. 그러나 또 다시 내전이 일어났으며, 결국 카이사르의 양자인 가이우스 옥타비아누스가 영속적인 전제정을 성립하였다. 카이사르가 죽은 지 기원전 42년에, 원로원은 카이사르를 공식적으로 로마의 신으로 축성하였다. 따라서 그의 사후 그의 공식명칭은 신격 카이사르가 되었다(Divus Caesar). 또한 그 이후부터 로마 황제가 죽었을 경우 후임자가 그를 신격화시키는 것이 관례화되었다.\n카이사르의 삶은 본인이 쓴 전쟁 기록(갈리아 전기, 내란기)을 통해 상당 부분 알려져 있으며, 정적임과 동시에 오랜 친구였던 키케로와의 서신과 그의 연설, 살루스티우스의 기록, 카툴루스의 시 등 당대의 다른 사료도 남아 있다. 또 아피아노스, 수에토니우스, 플루타르코스, 카시우스 디오, 스트라본 등 여러 후대 역사가들의 기록도 그의 삶에 대해 더욱 자세하게 서술하고 있다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Retrato_de_Julio_C%C3%A9sar_%2826724093101%29.jpg/500px-Retrato_de_Julio_C%C3%A9sar_%2826724093101%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2575","lang":"ko","updated":"2026-10-14T00:43:50.734Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["포론카리스튀스","율리우스 카이사르"],"category":"고기요리","ingredients":["게"],"descriptionLength":1364,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"FI|칼라쿠코","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"칼라쿠코","title":"아스티도","status":"candidate","desc":"아스티도(이탈리아어: Provincia di Asti)은 이탈리아 피에몬테주의 도이다. 도청 소재지는 아스티이다. 면적은 1,504 km2, 인구는 206,265(2004)이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Flag_of_the_Province_of_Asti.svg/500px-Flag_of_the_Province_of_Asti.svg.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=768526","lang":"ko","updated":"2026-10-14T00:43:51.446Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치","설명 부족"],"aliases":["칼라쿠코","아스티도"],"category":"생선·해산물","ingredients":[],"descriptionLength":99,"categoryOriginal":"음료·소스","extraCategories":["빵·밀가루"]},{"id":"FI|코르바푸스티","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"코르바푸스티","title":"","status":"candidate","desc":"","image":"","url":"https://ko.wikipedia.org/?curid=872878","lang":"ko","updated":"2026-10-14T00:43:52.164Z","verification":"","risk":"차단 권고","reasons":["기존 설명이 핀란드식 코르바푸스티가 아닌 시나몬 롤 일반 문서입니다."],"aliases":["코르바푸스티","시나몬 롤"],"category":"디저트·과자","ingredients":[],"descriptionLength":0,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KH|피시 아목","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"피시 아목","title":"Fish amok","status":"done","desc":"Fish amok or amok trey (Khmer: អាម៉ុកត្រី [ʔaːmok trəj]) is a Khmer steamed fish curry (amok) with a mousse-like consistency, considered one of Cambodia's national dishes. Fish amok is believed to have been a royal Khmer dish dating back to the Khmer Empire, although some question it originating in Cambodia.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Fish_Amok_with_Rice.jpg/500px-Fish_Amok_with_Rice.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://en.wikipedia.org/?curid=12485260","lang":"en","updated":"2026-10-14T00:43:53.392Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["피시 아목","Fish amok"],"category":"생선·해산물","ingredients":[],"descriptionLength":309,"categoryOriginal":"해산물","extraCategories":[]},{"id":"KH|록락","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"록락","title":"금새록","status":"candidate","desc":"금새록(1992년 9월 6일 ~ )은 대한민국의 모델, 배우다.","image":"https://upload.wikimedia.org/wikipedia/commons/e/e8/Keum_Sae_Rok_at_2019_The_Fiery_Priest_press_conference.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=1876106","lang":"ko","updated":"2026-10-14T00:43:54.112Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치","설명 부족"],"aliases":["록락","금새록"],"category":"고기요리","ingredients":[],"descriptionLength":35,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KH|꾸이띠우","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"꾸이띠우","title":"Kuyteav","status":"done","desc":"Kuyteav (Khmer: គុយទាវ, kŭytéav [kujtiəw]) is a Cambodian noodle soup consisting of rice noodles with pork stock and toppings. It is a popular breakfast dish across all of Cambodia. The kuyteav can be found at marketplace stalls, roadside vendors, restaurants and in shophouses across the country, and is distinguished by its clear broth and array of herbs, aromatics and other garnishes and condiments.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/Katieu.jpg/500px-Katieu.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://en.wikipedia.org/?curid=1859216","lang":"en","updated":"2026-10-14T00:43:55.238Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["꾸이띠우","Kuyteav","Kuy teav","គុយទាវ"],"category":"국수·면","ingredients":[],"descriptionLength":403,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"KH|놈반쪽","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"놈반쪽","title":"조선민주주의인민공화국","status":"candidate","desc":"조선민주주의인민공화국(한국 한자: 朝鮮民主主義人民共和國)은 동아시아의 한반도 군사 분계선 북부에 위치한 나라이다. 약칭은 조선(한국 한자: 朝鮮), 공화국(한국 한자: 共和國)이며 대한민국에서는 언론과 여론 구분에 관계없이 북한(한국 한자: 北韓)이라고 부르고 있다. 유엔이 추정하는 조선민주주의인민공화국의 인구는 2024년 기준으로 약 2,649만 명이며, 조선민주주의인민공화국의 공용어는 평양말을 기초로 형성된 문화어이다. 수도는 평양시이며, 이밖에 조선민주주의인민공화국의 주요 도시로는 남포시, 개성시, 라선시 등이 있다.\n조선민주주의인민공화국의 통치 형태는 정당이 조선로동당이 있으며 사실상 일당제 국가라는 평가를 받는다. 초대 최고지도자 김일성은 6.25 전쟁, 8월 종파 사건 등을 거쳐 정적을 제거하여 수령 중심 정치 체제를 완성하였다. 그의 자손인 김정일, 김정은은 차례로 집권을 하며 선대의 수령주의를 이어받은 정치를 펼쳤다. 이 체제는 '주체사상'이라는, 김일성 일가와 그들의 당인 조선로동당의 통치를 멋대로 바꾸는 이념으로 대표된다.\n분단 이후부터 현재까지 김일성 일가의 맘대로, '조선이 없는 지구는 깨버려야 한다'는 김정일의 언급, '수령결사옹위정신', '나쁜놈들'로 대표되는 강경한 수령 중심의 체제의 성립과 유지 의지를 대내외적으로 보여왔다. 이를 위해 경제 개방을 포함한 외부와의 전면적 교류를 꺼려 외부에서 이 국가의 상황을 자세히 알기 어렵다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Flag_of_North_Korea.svg/500px-Flag_of_North_Korea.svg.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=495","lang":"ko","updated":"2026-10-14T00:43:56.778Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["놈반쪽","조선민주주의인민공화국"],"category":"국수·면","ingredients":["김"],"descriptionLength":714,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KH|삼로르 코르코","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"삼로르 코르코","title":"레이르","status":"candidate","desc":"레이르(라틴어: Leir)는 몬머스의 제프리가 12세기에 쓴 유사역사서 브리타니아 열왕사에 나오는 전설적인 브리튼인의 왕이다. 제프리의 브리튼 왕조 족보에 올라온 왕들이 모두 그렇듯이 그 역시 정사에 등장하지 않으며, 실존인물이라는 증거는 없다. 레이르왕 이야기는 훗날 윌리엄 셰익스피어의 비극 리어왕의 원형이 되었다.\n블라두드의 아들로, 블라두드가 인공 날개를 달고 하늘을 날아보려다가 추락사하자 왕위를 계승했다. 실존했다는 증거가 없는 인물인만큼 정확한 재위 기간은 당연히 비정할 수 없으나, 제프리에 따르면 레이르의 치세는 기원전 8세기 전후, 로마가 건국될 때 및 이스라엘에서 예언자 엘리야가 활동하던 시기와 동시기이다. 레이르는 60년간 재위하여 《브리타니아 열왕사》에 올라온 가상의 전설적인 왕들 중 재위기간이 가장 길다. 제프리는 잉글랜드 레스터셔가 레이르가 세운 것이며 레이르의 이름이 붙은 것이라고 주장했다.\n레이르는 창업군주 브루투스의 마지막 직계 남자후손이다. 레이르에게는 딸만 셋(고노릴라, 레간, 코르델리아) 있었기에 브루투스 왕가 직계는 레이르에서 단절된다. 늙은 레이르는 죽음이 가까웠음을 느끼고 왕국을 삼등분하여 딸들에게 물려준다. 고노릴라와 레간은 아버지에게 아부하여 각각 알바니 공작과 콘월 공작과 결혼한다. 한편 왕이 가장 총애한 딸인 코르델리아는 아버지에 대한 사랑을 특별히 증명하려 들어서는 아니된다며 아첨하기를 거부했고, 그 결과 땅을 물려받지 못했다. 프랑크인의 왕 아가니푸스가 코르델리아와 결혼하겠다 하는데 레이르는 지참금도 주지 않으려 했다. 아가니푸스는 개의치 않고 코르델리아를 데려갔다.\n레이르는 고노릴라와 레간에게 왕국의 절반을 넘기고 자신이 죽으면 나머지 절반을 물려줄 생각이었다. 그러나 사위들이 반란을 일으켜 왕국 전체가 홀라당 넘어가 버렸다. 고노릴라의 남편인 알바니 공작 마글라우루스(Maglaurus)는 레이르가 60명의 호위기사는 거느릴 수 있게 해 주었는데, 고노릴라가 이를 30명으로 줄여 버렸다. 레이르는 탈출하여 레간에게로 도망갔으나 레간은 호위기사를 5명으로 줄여 버렸다. 레이르는 다시 알바니로 돌아갔고, 그의 곁에는 단 한 명의 호위기사만 남게 되었다.\n일이 이 지경이 되자 레이르는 장녀와 차녀에게 목숨의 위협을 느끼고 막내사위의 영지인 갈리아로 도망갔다. 레이르는 카리티아(Karitia)의 프랑크 왕궁 밖에 와서 코르델리아를 불렀다. 코르델리아는 아버지를 씻기고 입히고 많은 수행원을 붙여 주었다. 이후 막내사위인 프랑크 왕 아가니푸스가 그를 정식으로 접견하고 프랑스 귀족들이 그를 복위시켜 줄 것을 맹세했다. 이후 레이르는 막내딸과 막내사위를 대동하고 브리튼 섬을 침공, 두 큰딸과 사위들을 처단했다. 이후 레이르는 3년을 더 다스리다가 죽었고 코르데리아가 왕위를 계승했다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/King_Leir_and_his_daughters%2C_marginal_illustration_in_the_Chronica_Majora%2C_c._1250.jpg/500px-King_Leir_and_his_daughters%2C_marginal_illustration_in_the_Chronica_Majora%2C_c._1250.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1621803","lang":"ko","updated":"2026-10-14T00:43:57.491Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["삼로르 코르코","레이르"],"category":"수프·국물","ingredients":["게"],"descriptionLength":1375,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MM|모힝가","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"모힝가","title":"몬 힝가","status":"done","desc":"모힝가는 생선으로 맛을 낸 국물에 쌀국수를 말아 먹는 미얀마의 대표적인 음식입니다. 아침 식사로 즐기는 경우가 많습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/IMG_Mohinga.JPG/500px-IMG_Mohinga.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=580195","lang":"ko","updated":"2026-10-14T00:43:58.208Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["모힝가","몬 힝가"],"category":"국수·면","ingredients":["쌀국수","생선","향신료"],"descriptionLength":67,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MM|라페토","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"라페토","title":"라페토사우루스","status":"candidate","desc":"라페토사우루스(Rapetosaurus)는 백악기 후기에 마다가스카르에서 살았던 용각류인 공룡이다. 티타노사우루스과에 속하며 1995년에 발굴되어 명명되진 공룡으로 학명의 이름은 라페토의 도마뱀이란 뜻을 가지고 있다. 티타노사우루스과중에 유일하게 두개골이 발굴된 종류이며 몸길이는 15M에 몸무게는 12TON이 되는 공룡이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Rapetosaurus_BW.jpg/500px-Rapetosaurus_BW.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2686601","lang":"ko","updated":"2026-10-14T00:43:58.924Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["라페토","라페토사우루스","Lahpet thoke"],"category":"채소·샐러드","ingredients":["게"],"descriptionLength":181,"categoryOriginal":"해산물","extraCategories":[]},{"id":"MM|샨 누들","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"샨 누들","title":"샨 카웃스웨","status":"done","desc":"샨 누들은 미얀마 샨 지역에서 즐겨 먹는 쌀국수 요리입니다. 닭고기나 돼지고기, 토마토 소스를 넣고 국물 있게 또는 비벼서 먹습니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Shan_Noodle.jpg/500px-Shan_Noodle.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4055875","lang":"ko","updated":"2026-10-14T00:44:00.153Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 확인하고 어린이용 한국어 설명으로 보강","사진은 기존 자료 유지, 별도 시각 검증 전"],"aliases":["샨 누들","샨 카웃스웨"],"category":"국수·면","ingredients":["쌀국수","토마토","고기"],"descriptionLength":74,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MM|오노 카욱 스웨","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"오노 카욱 스웨","title":"오노에 쇼로쿠","status":"candidate","desc":"오노에 쇼로쿠(일본어: 尾上 松綠 おのえ しょうろく[*], 간체자 : 松緑)는 가부키 배우의 묘세키이다. 옥호는 오토와야, 정문은 욧츠린에 안긴 떡갈나무, 다른 문양은 후지와에 하나비시이다.\n「쇼로쿠 (松緑)」는 초대 오노에 마츠스케의 배명에서 유래했다. 후에 마츠스케는 이것을 묘세키로 삼고, 말년의 6년간 \"오노에 쇼로쿠\"로 칭했다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Yotsu-wa_ni_Daki-gashiwa_inverted_2.png/500px-Yotsu-wa_ni_Daki-gashiwa_inverted_ ","status":"done","desc":"아히아코(스페인어: ajiaco)는 콜롬비아, 쿠바, 칠레 등 라틴아메리카 지역의 전통 수프이다. 고기와 감자, 옥수수 등이 들어가며, 지역에 따라 조리법이 다르다. 콜롬비아에서는 아히아코가 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Ajiaco.jpg/500px-Ajiaco.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1866706","lang":"ko","updated":"2026-10-14T00:44:03.021Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["아히아코"],"category":"수프·국물","ingredients":["감자","옥수수"],"descriptionLength":126,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"CO|아레파","countryCode":"CO","country":"콜롬비아","flag":"🇨🇴","name":"아레파","title":"아레파","status":"done","desc":"아레파(스페인어: arepa)는 베네수엘라, 콜롬비아 등 남아메리카 북부의 전통 옥수수빵이다. 선콜럼버스 시대부터 먹던 음식이며, 디아스포라를 따라 중앙아메리카와 카리브 등 다른 라틴 아메리카 지역에도 전파되었다. 멕시코의 고르디타나 엘살바도르의 푸푸사와 비슷하다. 콜롬비아와 베네수엘라의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Arepitas_Food_Macro.jpg/500px-Arepitas_Food_Macro.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=845394","lang":"ko","updated":"2026-10-14T00:44:03.737Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["아레파"],"category":"빵·밀가루","ingredients":["옥수수","빵"],"descriptionLength":181,"categoryOriginal":"빵·만두","extraCategories":[]},{"id":"CO|산코초","countryCode":"CO","country":"콜롬비아","flag":"🇨🇴","name":"산코초","title":"상코초","status":"done","desc":"산코초는 고기와 감자, 유카 같은 뿌리채소를 함께 오래 끓이는 콜롬비아 등 중남미의 국물 요리입니다. 가족이 함께 먹는 든든한 음식입니다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Sancocho_de_espinazo_de_cerdo.jpg/500px-Sancocho_de_espinazo_de_cerdo.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3715210","lang":"ko","updated":"2026-10-14T00:44:05.170Z","verification":"editorial-first-pass","risk":"편집 1차 내용 검토 완료 · 사진 별도 확인","reasons":["기존 검색 제목·설명의 음식 정체성을 function compressPhoto(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(new Error('이미지 파일을 선택해 주세요.'));if(file.size>25*1024*1024)return reject(new Error('25MB 이하 사진을 선택해 주세요.'));const reader=new FileReader();reader.onerror=()=>reject(new Error('파일 읽기 실패'));reader.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('이미지 열기 실패'));im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight,scale=Math.min(1,1100/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));let result='';for(let i=0;i<5;i++){const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);result=cv.toDataURL('image/jpeg',Math.max(.48,.78-i*.06));if(result.length<550000)break;w=Math.max(1,Math.round(w*.82));h=Math.max(1,Math.round(h*.82));}resolve(result);}catch(e){reject(e);}};im.src=reader.result;};reader.readAsDataURL(file);});}

function autoCounts(){

 return {waiting,failed,succeeded,empty:remaining.length,done:foods.filter(f=>f.status==='done').length};
}
