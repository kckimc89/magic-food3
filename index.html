ent=thumbnail","url":"https://ko.wikipedia.org/?curid=144443","lang":"ko","updated":"2026-10-14T00:43:45.816Z","verification":"rule-exact-title-v1","risk":"재검토","reasons":["설명 부족"],"aliases":["라크피스크"],"category":"생선·해산물","ingredients":["생선"],"descriptionLength":88,"categoryOriginal":"해산물","extraCategories":[]},{"id":"NO|브루노스트","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"브루노스트","title":"브루노스트","status":"done","desc":"브로노스트(노르웨이어: Brunost)는 노르웨이를 대표하는 갈색 유청 치즈이다. 노르웨이어로 갈색 치즈라는 뜻이며, 주재료인 유청을 의미하는 뮈세를 붙여 뮈소스투라고도 불린다. 일반적인 치즈가 레닛을 이용해 우유의 단백질(카세인)을 응고시켜 만드는 것과 달리, 브로노스트는 치즈 제조 후 남은 유청을 오랜 시간 끓여 유당을 캐러멜화시키는 방식으로 만들어진다. 이 독특한 제조법 덕분에 짭짤하고 발효된 맛 대신, 달콤하고 깊은 캐러멜 풍미를 지니게 되어 노르웨이의 국민 음식으로 확고히 자리 잡았다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Braunkaese.jpg/500px-Braunkaese.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2024331","lang":"ko","updated":"2026-10-14T00:43:46.533Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["브루노스트"],"category":"콩·유제품","ingredients":["치즈","우유","게"],"descriptionLength":279,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"NO|크룸카케","countryCode":"NO","country":"노르웨이","flag":"🇳🇴","name":"크룸카케","title":"크룸카케","status":"done","desc":"크룸카케(노르웨이어: Krumkake, 노르웨이어 발음: [ˈkrʊ̀mˌkɑːkə], '구부러진 케이크'라는 뜻, 복수형: 노르웨이어: krumkaker)는 곡분, 버터, 식용란, 설탕, 크림으로 만드는 노르웨이 쿠키이다.\n이탈리아의 피첼레나 칸놀로와 유사하며, 와플기와 비슷한 장식용 양면 철판을 사용하여 얇고 둥근 케이크를 굽는 것이 전통적이다. 구형 철판은 스토브 위에서 사용하지만, 현대적인 전기 철판은 눌어붙지 않는 표면, 자동 타이머, 한 번에 여러 개를 구울 수 있는 편의성을 제공한다. 뜨거울 때 13~20cm 크기의 크룸카케를 나무나 플라스틱으로 된 원뿔형 틀에 말아 작은 원뿔 모양으로 만든다. 크룸카케는 그대로 먹거나 휘핑크림 또는 다른 속재료를 채워 먹을 수 있다.\n이 비스킷은 노르웨이뿐만 아니라 노르웨이계 미국인 이민자와 그 후손들의 기여 덕분에 미국 뉴잉글랜드와 미국 중서부 지역의 요리에서도 발견된다. 크룸카케는 전통적으로 산바켈세나 로세트와 같은 다른 북유럽 기원의 쿠키와 함께 크리스마스 만찬 준비를 대비하여 제조된다. 이는 전통적인 크리스마스 이브 만찬 후에 달콤한 디저트로 제공된다.\n독일에서 이 쿠키는 보통 달콤한 속재료를 채워 먹는다. 또한 아이스크림 콘의 종류로도 사용된다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/1krumkake.jpg/500px-1krumkake.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4125496","lang":"ko","updated":"2026-10-14T00:43:47.353Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["크룸카케"],"category":"디저트·과자","ingredients":["버터"],"descriptionLength":624,"categoryOriginal":"디저트","extraCategories":[]},{"id":"FI|카르얄란피이라카","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"카르얄란피이라카","title":"굽타기원","status":"candidate","desc":"굽타기원은 서기  318c.~319년부터 시작하는 역사적인 기년법이다. 이 기년법은 굽타 제국의 황제들과 그들의 가신들, 그리고 오늘날의 북인도와 네팔에 있는 후계자들이 사용했다. 서인도의 사우라슈트라 지역에서 사용된 발라비기원(또는 발라비 시대)과 동일하지만, 지역적 차이로 인해 발라비 기원년을 공통 기원으로 환산하는 방식에 약간의 차이가 있다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Buddha%2C_standing%2C_inscribed_Gift_of_Abhayamira_in_154_GE_474_CE_in_the_reign_of_Kumaragupta_II_Sarnath_Museum.jpg/500px-Buddha%2C_standing%2C_inscribed_Gift_of_Abhayamira_in_154_GE_474_CE_in_the_reign_of_Kumaragupta_II_Sarnath_Museum.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4055658","lang":"ko","updated":"2026-10-14T00:43:48.274Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["카르얄란피이라카","굽타기원"],"category":"빵·밀가루","ingredients":[],"descriptionLength":195,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"FI|로히케이토","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"로히케이토","title":"로히케이토","status":"candidate","desc":"로히케이토(핀란드어: lohikeitto, 스웨덴어: laxsoppa)는 핀란드를 중심으로 한 노르딕 국가의 연어 수프로 연어 살코기와 삶은 감자, 리크, 딜을 넣으며 가끔 우유를 넣기도 한다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b7/Lohikeitto.jpg/500px-Lohikeitto.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2006025","lang":"ko","updated":"2026-10-14T00:43:48.994Z","verification":"","risk":"일치 후보","reasons":[],"aliases":["로히케이토"],"category":"수프·국물","ingredients":["감자","우유","연어"],"descriptionLength":108,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"FI|포론카리스튀스","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"포론카리스튀스","title":"율리우스 카이사르","status":"candidate","desc":"가이우스 율리우스 카이사르(라틴어: Gaius Julius Caesar: 기원전 100년 7월 12일 ~ 기원전 44년 3월 15일) 또는 줄리어스 시저는 로마 공화국의 정치인, 장군, 작가이다. 그는 로마 공화국이 로마 제국으로 변화하는 데 중요한 역할을 하였다.\n정치적으로 카이사르는 민중파의 노선에 섰다. 기원전 60년대 말에서 50년대에 이르기까지 그는 마르쿠스 리키니우스 크라수스, 그나이우스 폼페이우스 마그누스와 소위 제1차 삼두 정치라는 초법적 정치 연대를 이루어 수년간 로마 정계를 장악하였다. 이들 파벌은 자신들끼리 권력을 분점하고자 하여, 원로원 내에서 마르쿠스 포르키우스 카토, 마르쿠스 칼푸르니우스 비불루스 등 벌족파의 반대를 받았으며, 마르쿠스 툴리우스 키케로가 이에 가세하기도 하였다. 카이사르는 갈리아를 정복(기원전 58년 ~ 52년)하여 로마 제국의 영토를 북해까지 넓혔으며, 기원전 55년에는 로마인 처음으로 브리타니아 침공을 감행하였다. 이러한 공훈 덕분에 카이사르는 강력한 세력가로 입지를 굳혀 폼페이우스를 위협하게 되었으며, 카라이 전투에서 크라수스가 전사하면서 삼두정의 두 정치가 사이에 긴장이 높아졌다. 이렇듯 로마 정계가 재편되면서 카이사르와 폼페이우스는 서로 대치하게 되었으며, 폼페이우스는 원로원의 대의를 내세웠다. 카이사르는 자신의 군단으로 하여금 루비콘강을 건너게 하는 결단을 내려 기원전 48년에 내전이 일어났으며, 파르살루스 전투, 탑수스 전투 등에서 승리한 카이사르는 로마 세계에서 무소불위의 권력자로 등극하였다.\n정권을 장악한 뒤 그는 로마의 사회와 정치에 광범위한 개혁을 실시하였다. 그는 공화정의 귀족 정치를 고도로 중앙집권화하였으며, 급기야 자신을 종신독재관으로 선언하였다. 기원전 44년 3월 15일에 마르쿠스 유니우스 브루투스가 이끄는 일군의 원로원 의원들이 공화정을 복고하고자 음모를 꾸며 카이사르를 암살하였다. 그러나 또 다시 내전이 일어났으며, 결국 카이사르의 양자인 가이우스 옥타비아누스가 영속적인 전제정을 성립하였다. 카이사르가 죽은 지 기원전 42년에, 원로원은 카이사르를 공식적으로 로마의 신으로 축성하였다. 따라서 그의 사후 그의 공식명칭은 신격 카이사르가 되었다(Divus Caesar). 또한 그 이후부터 로마 황제가 죽었을 경우 후임자가 그를 신격화시키는 것이 관례화되었다.\n카이사르의 삶은 본인이 쓴 전쟁 기록(갈리아 전기, 내란기)을 통해 상당 부분 알려져 있으며, 정적임과 동시에 오랜 친구였던 키케로와의 서신과 그의 연설, 살루스티우스의 기록, 카툴루스의 시 등 당대의 다른 사료도 남아 있다. 또 아피아노스, 수에토니우스, 플루타르코스, 카시우스 디오, 스트라본 등 여러 후대 역사가들의 기록도 그의 삶에 대해 더욱 자세하게 서술하고 있다.\n\n","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Retrato_de_Julio_C%C3%A9sar_%2826724093101%29.jpg/500px-Retrato_de_Julio_C%C3%A9sar_%2826724093101%29.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2575","lang":"ko","updated":"2026-10-14T00:43:50.734Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["포론카리스튀스","율리우스 카이사르"],"category":"고기요리","ingredients":["게"],"descriptionLength":1364,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"FI|칼라쿠코","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"칼라쿠코","title":"아스티도","status":"candidate","desc":"아스티도(이탈리아어: Provincia di Asti)은 이탈리아 피에몬테주의 도이다. 도청 소재지는 아스티이다. 면적은 1,504 km2, 인구는 206,265(2004)이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Flag_of_the_Province_of_Asti.svg/500px-Flag_of_the_Province_of_Asti.svg.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=768526","lang":"ko","updated":"2026-10-14T00:43:51.446Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치","설명 부족"],"aliases":["칼라쿠코","아스티도"],"category":"생선·해산물","ingredients":[],"descriptionLength":99,"categoryOriginal":"음료·소스","extraCategories":["빵·밀가루"]},{"id":"FI|코르바푸스티","countryCode":"FI","country":"핀란드","flag":"🇫🇮","name":"코르바푸스티","title":"시나몬 롤","status":"candidate","desc":"시나몬 롤(cinnamon roll, 시나몬 번, 시나몬 스월, 시나몬 스크롤, 시나몬 데이니시, 시나몬 스네일은 북유럽 (주로 노르딕 국가와 오스트리아, 에스토니아, 네덜란드, 독일)과 북아메리카에서 흔히 제공되는 스위트 롤이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/Kanelbulle.jpg/500px-Kanelbulle.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=872878","lang":"ko","updated":"2026-10-14T00:43:52.164Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["코르바푸스티","시나몬 롤"],"category":"디저트·과자","ingredients":[],"descriptionLength":129,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KH|피시 아목","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"피시 아목","title":"Fish amok","status":"done","desc":"Fish amok or amok trey (Khmer: អាម៉ុកត្រី [ʔaːmok trəj]) is a Khmer steamed fish curry (amok) with a mousse-like consistency, considered one of Cambodia's national dishes. Fish amok is believed to have been a royal Khmer dish dating back to the Khmer Empire, although some question it originating in Cambodia.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Fish_Amok_with_Rice.jpg/500px-Fish_Amok_with_Rice.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://en.wikipedia.org/?curid=12485260","lang":"en","updated":"2026-10-14T00:43:53.392Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["피시 아목","Fish amok"],"category":"생선·해산물","ingredients":[],"descriptionLength":309,"categoryOriginal":"해산물","extraCategories":[]},{"id":"KH|록락","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"록락","title":"금새록","status":"candidate","desc":"금새록(1992년 9월 6일 ~ )은 대한민국의 모델, 배우다.","image":"https://upload.wikimedia.org/wikipedia/commons/e/e8/Keum_Sae_Rok_at_2019_The_Fiery_Priest_press_conference.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","url":"https://ko.wikipedia.org/?curid=1876106","lang":"ko","updated":"2026-10-14T00:43:54.112Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치","설명 부족"],"aliases":["록락","금새록"],"category":"고기요리","ingredients":[],"descriptionLength":35,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KH|꾸이띠우","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"꾸이띠우","title":"Kuyteav","status":"done","desc":"Kuyteav (Khmer: គុយទាវ, kŭytéav [kujtiəw]) is a Cambodian noodle soup consisting of rice noodles with pork stock and toppings. It is a popular breakfast dish across all of Cambodia. The kuyteav can be found at marketplace stalls, roadside vendors, restaurants and in shophouses across the country, and is distinguished by its clear broth and array of herbs, aromatics and other garnishes and condiments.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/Katieu.jpg/500px-Katieu.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://en.wikipedia.org/?curid=1859216","lang":"en","updated":"2026-10-14T00:43:55.238Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["꾸이띠우","Kuyteav","Kuy teav","គុយទាវ"],"category":"국수·면","ingredients":[],"descriptionLength":403,"categoryOriginal":"대표음식","extraCategories":[]},{"id":"KH|놈반쪽","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"놈반쪽","title":"조선민주주의인민공화국","status":"candidate","desc":"조선민주주의인민공화국(한국 한자: 朝鮮民主主義人民共和國)은 동아시아의 한반도 군사 분계선 북부에 위치한 나라이다. 약칭은 조선(한국 한자: 朝鮮), 공화국(한국 한자: 共和國)이며 대한민국에서는 언론과 여론 구분에 관계없이 북한(한국 한자: 北韓)이라고 부르고 있다. 유엔이 추정하는 조선민주주의인민공화국의 인구는 2024년 기준으로 약 2,649만 명이며, 조선민주주의인민공화국의 공용어는 평양말을 기초로 형성된 문화어이다. 수도는 평양시이며, 이밖에 조선민주주의인민공화국의 주요 도시로는 남포시, 개성시, 라선시 등이 있다.\n조선민주주의인민공화국의 통치 형태는 정당이 조선로동당이 있으며 사실상 일당제 국가라는 평가를 받는다. 초대 최고지도자 김일성은 6.25 전쟁, 8월 종파 사건 등을 거쳐 정적을 제거하여 수령 중심 정치 체제를 완성하였다. 그의 자손인 김정일, 김정은은 차례로 집권을 하며 선대의 수령주의를 이어받은 정치를 펼쳤다. 이 체제는 '주체사상'이라는, 김일성 일가와 그들의 당인 조선로동당의 통치를 멋대로 바꾸는 이념으로 대표된다.\n분단 이후부터 현재까지 김일성 일가의 맘대로, '조선이 없는 지구는 깨버려야 한다'는 김정일의 언급, '수령결사옹위정신', '나쁜놈들'로 대표되는 강경한 수령 중심의 체제의 성립과 유지 의지를 대내외적으로 보여왔다. 이를 위해 경제 개방을 포함한 외부와의 전면적 교류를 꺼려 외부에서 이 국가의 상황을 자세히 알기 어렵다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Flag_of_North_Korea.svg/500px-Flag_of_North_Korea.svg.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=495","lang":"ko","updated":"2026-10-14T00:43:56.778Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["놈반쪽","조선민주주의인민공화국"],"category":"국수·면","ingredients":["김"],"descriptionLength":714,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"KH|삼로르 코르코","countryCode":"KH","country":"캄보디아","flag":"🇰🇭","name":"삼로르 코르코","title":"레이르","status":"candidate","desc":"레이르(라틴어: Leir)는 몬머스의 제프리가 12세기에 쓴 유사역사서 브리타니아 열왕사에 나오는 전설적인 브리튼인의 왕이다. 제프리의 브리튼 왕조 족보에 올라온 왕들이 모두 그렇듯이 그 역시 정사에 등장하지 않으며, 실존인물이라는 증거는 없다. 레이르왕 이야기는 훗날 윌리엄 셰익스피어의 비극 리어왕의 원형이 되었다.\n블라두드의 아들로, 블라두드가 인공 날개를 달고 하늘을 날아보려다가 추락사하자 왕위를 계승했다. 실존했다는 증거가 없는 인물인만큼 정확한 재위 기간은 당연히 비정할 수 없으나, 제프리에 따르면 레이르의 치세는 기원전 8세기 전후, 로마가 건국될 때 및 이스라엘에서 예언자 엘리야가 활동하던 시기와 동시기이다. 레이르는 60년간 재위하여 《브리타니아 열왕사》에 올라온 가상의 전설적인 왕들 중 재위기간이 가장 길다. 제프리는 잉글랜드 레스터셔가 레이르가 세운 것이며 레이르의 이름이 붙은 것이라고 주장했다.\n레이르는 창업군주 브루투스의 마지막 직계 남자후손이다. 레이르에게는 딸만 셋(고노릴라, 레간, 코르델리아) 있었기에 브루투스 왕가 직계는 레이르에서 단절된다. 늙은 레이르는 죽음이 가까웠음을 느끼고 왕국을 삼등분하여 딸들에게 물려준다. 고노릴라와 레간은 아버지에게 아부하여 각각 알바니 공작과 콘월 공작과 결혼한다. 한편 왕이 가장 총애한 딸인 코르델리아는 아버지에 대한 사랑을 특별히 증명하려 들어서는 아니된다며 아첨하기를 거부했고, 그 결과 땅을 물려받지 못했다. 프랑크인의 왕 아가니푸스가 코르델리아와 결혼하겠다 하는데 레이르는 지참금도 주지 않으려 했다. 아가니푸스는 개의치 않고 코르델리아를 데려갔다.\n레이르는 고노릴라와 레간에게 왕국의 절반을 넘기고 자신이 죽으면 나머지 절반을 물려줄 생각이었다. 그러나 사위들이 반란을 일으켜 왕국 전체가 홀라당 넘어가 버렸다. 고노릴라의 남편인 알바니 공작 마글라우루스(Maglaurus)는 레이르가 60명의 호위기사는 거느릴 수 있게 해 주었는데, 고노릴라가 이를 30명으로 줄여 버렸다. 레이르는 탈출하여 레간에게로 도망갔으나 레간은 호위기사를 5명으로 줄여 버렸다. 레이르는 다시 알바니로 돌아갔고, 그의 곁에는 단 한 명의 호위기사만 남게 되었다.\n일이 이 지경이 되자 레이르는 장녀와 차녀에게 목숨의 위협을 느끼고 막내사위의 영지인 갈리아로 도망갔다. 레이르는 카리티아(Karitia)의 프랑크 왕궁 밖에 와서 코르델리아를 불렀다. 코르델리아는 아버지를 씻기고 입히고 많은 수행원을 붙여 주었다. 이후 막내사위인 프랑크 왕 아가니푸스가 그를 정식으로 접견하고 프랑스 귀족들이 그를 복위시켜 줄 것을 맹세했다. 이후 레이르는 막내딸과 막내사위를 대동하고 브리튼 섬을 침공, 두 큰딸과 사위들을 처단했다. 이후 레이르는 3년을 더 다스리다가 죽었고 코르데리아가 왕위를 계승했다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/King_Leir_and_his_daughters%2C_marginal_illustration_in_the_Chronica_Majora%2C_c._1250.jpg/500px-King_Leir_and_his_daughters%2C_marginal_illustration_in_the_Chronica_Majora%2C_c._1250.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=1621803","lang":"ko","updated":"2026-10-14T00:43:57.491Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["삼로르 코르코","레이르"],"category":"수프·국물","ingredients":["게"],"descriptionLength":1375,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MM|모힝가","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"모힝가","title":"몬 힝가","status":"candidate","desc":"몬 힝가(버마어: မုန့်ဟင်းခါး)는 미얀마의 국수 요리이다. 쌀국수인 몬 팟을 넣은 몬의 일종으로, 메기 등 민물생선로 만든 걸쭉한 국물에 국수를 말아 낸다. 미얀마의 국민 음식 가운데 하나이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/IMG_Mohinga.JPG/500px-IMG_Mohinga.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=580195","lang":"ko","updated":"2026-10-14T00:43:58.208Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["모힝가","몬 힝가"],"category":"국수·면","ingredients":["쌀","생선","국수"],"descriptionLength":118,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MM|라페토","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"라페토","title":"라페토사우루스","status":"candidate","desc":"라페토사우루스(Rapetosaurus)는 백악기 후기에 마다가스카르에서 살았던 용각류인 공룡이다. 티타노사우루스과에 속하며 1995년에 발굴되어 명명되진 공룡으로 학명의 이름은 라페토의 도마뱀이란 뜻을 가지고 있다. 티타노사우루스과중에 유일하게 두개골이 발굴된 종류이며 몸길이는 15M에 몸무게는 12TON이 되는 공룡이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Rapetosaurus_BW.jpg/500px-Rapetosaurus_BW.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=2686601","lang":"ko","updated":"2026-10-14T00:43:58.924Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["라페토","라페토사우루스","Lahpet thoke"],"category":"채소·샐러드","ingredients":["게"],"descriptionLength":181,"categoryOriginal":"해산물","extraCategories":[]},{"id":"MM|샨 누들","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"샨 누들","title":"샨 카웃스웨","status":"candidate","desc":"샨 카웃스웨(버마어: ရှမ်းခေါက်ဆွဲ) 또는 카오 소이(샨어: ၶဝ်ႈသွႆး)는 미얀마의 국수 요리이다. 샨족 전통 국수 요리를 두루 \"샨 국수\"라는 뜻의 \"샨 카웃스웨\"로 일컫는다. 샨주는 물론 미얀마 전역에서 즐겨 먹는다. 미얀마어 \"카웃스웨\"는 \"국수\"를 뜻한다. 국물국수 형태인 샨 카웃스웨 아이(버마어: ရှမ်းခေါက်ဆွဲအရည်)와 비빔국수 형태인 샨 카웃스웨 톳(버마어: ရှမ်းခေါက်ဆွဲအသုပ်)이 있다. \"아이(အရည်)\"는 \"액체, 국물\"을 뜻한다. \"카웃스웨 톳\"은 미얀마식 국수 샐러드(아톳)이다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Shan_Noodle.jpg/500px-Shan_Noodle.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=4055875","lang":"ko","updated":"2026-10-14T00:44:00.153Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["샨 누들","샨 카웃스웨"],"category":"국수·면","ingredients":["국수"],"descriptionLength":304,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"MM|오노 카욱 스웨","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"오노 카욱 스웨","title":"오노에 쇼로쿠","status":"candidate","desc":"오노에 쇼로쿠(일본어: 尾上 松綠 おのえ しょうろく[*], 간체자 : 松緑)는 가부키 배우의 묘세키이다. 옥호는 오토와야, 정문은 욧츠린에 안긴 떡갈나무, 다른 문양은 후지와에 하나비시이다.\n「쇼로쿠 (松緑)」는 초대 오노에 마츠스케의 배명에서 유래했다. 후에 마츠스케는 이것을 묘세키로 삼고, 말년의 6년간 \"오노에 쇼로쿠\"로 칭했다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Yotsu-wa_ni_Daki-gashiwa_inverted_2.png/500px-Yotsu-wa_ni_Daki-gashiwa_inverted_2.png?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3226931","lang":"ko","updated":"2026-10-14T00:44:00.870Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["오노 카욱 스웨","오노에 쇼로쿠"],"category":"국수·면","ingredients":[],"descriptionLength":188,"categoryOriginal":"디저트","extraCategories":[]},{"id":"MM|난지 똑","countryCode":"MM","country":"미얀마","flag":"🇲🇲","name":"난지 똑","title":"난지 톳","status":"candidate","desc":"난지 톳(버마어: နန်းကြီးသုပ်)은 쌀국수인 난지(နန်းကြီး)를 주재료로 하는 아톳(미얀마식 샐러드)이다. 몬 디의 하나이기도 하다. 만달레 몬 디(버마어: နန်းကြီးသုပ်)로도 불리며, 만달레 몬 디 톳(버마어: မန္တလေးမုန့်တီသုပ်), 난지 몬 디(버마어: နန်းကြီးမုန့်တီ) 등으로도 불린다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/Nan_Gyi_Thoke.jpg/500px-Nan_Gyi_Thoke.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3673631","lang":"ko","updated":"2026-10-14T00:44:01.586Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["난지 똑","난지 톳"],"category":"국수·면","ingredients":["쌀","국수"],"descriptionLength":191,"categoryOriginal":"국수·면","extraCategories":[]},{"id":"CO|반데하 파이사","countryCode":"CO","country":"콜롬비아","flag":"🇨🇴","name":"반데하 파이사","title":"반데하 파이사","status":"done","desc":"반데하 파이사(스페인어: bandeja paisa)는 콜롬비아의 쟁반 요리이다. 쌀밥과 콩, 각종 고기와 소시지, 달걀, 플랜테인, 아보카도, 아레파로 구성된 안티오키아 지역의 전통 음식이며, 콜롬비아의 국민 음식 가운데 하나이기도 하다.","image":" untryCode":"CO","country":"콜롬비아","flag":"🇨🇴","name":"산코초","title":"상코초","status":"candidate","desc":"상코초(스페인어: sancocho)는 과거에 누에바그라나다였던 지역(베네수엘라, 에콰도르, 콜롬비아, 파나마) 및 카리브 섬들(도미니카 공화국, 쿠바, 푸에르토리코) 등 여러 라틴 아메리카 지역에서 먹는 전통 국이다. 고기와 뿌리채소 등이 큰 덩어리로 들어가는 것이 특징이다. 해장 음식으로도 인기가 있다. 파나마의 국민 음식이기도 하다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Sancocho_de_espinazo_de_cerdo.jpg/500px-Sancocho_de_espinazo_de_cerdo.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=3715210","lang":"ko","updated":"2026-10-14T00:44:05.170Z","verification":"","risk":"재검토","reasons":["등록 이름·별칭과 검색 제목 불일치"],"aliases":["산코초","상코초"],"category":"수프·국물","ingredients":["채소"],"descriptionLength":189,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"CO|엠파나다","countryCode":"CO","country":"콜롬비아","flag":"🇨🇴","name":"엠파나다","title":"엠파나다","status":"done","desc":"엠파나다(스페인어: empanada)는 스페인과 라틴아메리카 등 스페인어권 및 스페인의 영향을 받은 지역에서 먹는 소를 넣은 페이스트리이다. 아르헨티나와 칠레의 국민 음식 가운데 하나로 여겨진다.","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/Mar_de_Empanadas_%28Madrid%29.JPG/500px-Mar_de_Empanadas_%28Madrid%29.JPG?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail","url":"https://ko.wikipedia.org/?curid=329884","lang":"ko","updated":"2026-10-14T00:44:05.887Z","verification":"rule-exact-title-v1","risk":"일치 후보","reasons":[],"aliases":["엠파나다"],"category":"빵·밀가루","ingredients":[],"descriptionLength":109,"categoryOriginal":"수프·국물","extraCategories":[]},{"id":"NZ|항이","countryCode":"NZ","country":"뉴질랜드","flag":"🇳🇿","name":"항이","title":"Hāngī","status":"done","desc":"Hāngī (Māori: [ˈhaːŋiː]) is a traditional New Zealand Māori method of cooking food using heated rocks buried in a pit oven, called an umu.‍ It is still used for large groups on special occasions, as it allows large quantities of food to be cooked without the need for commercial cooking appliances.‍","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/ function compressPhoto(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(new Error('이미지 파일을 선택해 주세요.'));if(file.size>25*1024*1024)return reject(new Error('25MB 이하 사진을 선택해 주세요.'));const reader=new FileReader();reader.onerror=()=>reject(new Error('파일 읽기 실패'));reader.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('이미지 열기 실패'));im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight,scale=Math.min(1,1100/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));let result='';for(let i=0;i<5;i++){const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);result=cv.toDataURL('image/jpeg',Math.max(.48,.78-i*.06));if(result.length<550000)break;w=Math.max(1,Math.round(w*.82));h=Math.max(1,Math.round(h*.82));}resolve(result);}catch(e){reject(e);}};im.src=reader.result;};reader.readAsDataURL(file);});}

async function exportBackup(){const payload={app:'World Food Encyclopedia V2',version:'V2.0 Stage 1.4',exported:new Date().toISOString(),baseVersion:DATA.version,edits,user};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='World_Food_V2_Full_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);}
async function importBackup(file){if(!file)return;try{const x=JSON.parse(await file.text());if(x.app!=='World Food Encyclopedia V2'||!x.edits||!Array.isArray(x.edits.added)||!Array.isArray(x.edits.deleted)||typeof x.edits.overrides!=='object')throw new Error('V2 Stage 1.4 전체 백업 파일이 아닙니다.');if(!confirm('현재 항목 추가·수정·삭제 상태와 즐겨찾기를 이 백업으로 바꿀까요? 먼저 현재 자료를 백업하는 것을 권장합니다.'))return;const old={edits,user};await dbWrite('previous_restore',old);edits={...JSON.parse(JSON.stringify(EMPTY)),...x.edits};user={favorites:Array.isArray(x.user?.favorites)?x.user.favorites:[],bucket:Array.isArray(x.user?.bucket)?x.user.bucket:[],notes:x.user?.notes||{}};if(await persist()){saveUser();renderAll();closeDetail();alert('전체 백업을 복원했습니다.');}}catch(e){alert('복원 실패: '+e.message);}}
function openResearch(id){if(!admin)return;const f=foodMap.get(id);if(!f)return;modal(`<h2 class="titleline">🔍 ${esc(f.name)} 검색후보 다시 찾기</h2><p class="warning">검색 결과는 자동으로 완성 카드가 되지 않습니다. 음식이 맞는지 확인한 뒤 후보로만 저장합니다. 기존 직접 입력한 설명·사진은 보호합니다.</p><form class="searchbar" id="wikiForm"><input id="wikiQuery" value="${esc((f.aliases||[]).find(a=>/[A-Za-z]/.test(a))||f.name+' 음식')}" placeholder="음식 이름이나 현지어 별칭"><button type="submit">찾기</button></form><div id="wikiResults" class="manage-list"><p class="muted">한국어 위키백과에서 후보를 찾습니다. 결과가 없으면 검색어를 바꿔보세요.</p></div>`);$('#wikiForm').addEventListener('submit',async e=>{e.preventDefault();const q=$('#wikiQuery').value.trim();if(!q)return;const result=$('#wikiResults');result.innerHTML='<p>검색 중입니다…</p>';try{const api='https://ko.wikipedia.org/w/api.php?action=query&list=search&srlimit=8&format=json&origin=*&srsearch='+encodeURIComponent(q);const r=await fetchWithTimeout(api);const data=await r.json();const pages=data.query?.search||[];result.innerHTML=pages.length?pages.map(p=>`<div class="manage-row"><span><b>${esc(p.title)}</b><br><small class="muted">${esc(p.snippet.replace(/<[^>]+>/g,'').slice(0,150))}</small></span><button type="button" data-wiki="${esc(p.title)}" data-food="${esc(id)}">미리보기</button></div>`).join(''):'<p class="muted">검색 결과가 없습니다. 영어·현지어 이름이나 음식이라는 단어를 추가해 보세요.</p>';}catch(e){result.innerHTML=`<p class="warning">검색 연결에 실패했습니다. 인터넷 연결이나 위키백과 접근을 확인해 주세요. (${esc(e.message)})</p>`;}});}
function fetchWithTimeout(url){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),12000);return fetch(url,{signal:ctrl.signal}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r;}).finally(()=>clearTimeout(timer));}
async function wikiPreview(id,title){const f=foodMap.get(id);if(!f)return;modal(`<h2 class="titleline">후보 내용 확인</h2><p>불러오는 중입니다…</p>`);try{const url='https://ko.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages|info&exintro=1&explaintext=1&inprop=url&pithumbsize=700&redirects=1&format=json&origin=*&titles='+encodeURIComponent(title);const d=await (await fetchWithTimeout(url)).json(),p=Object.values(d.query?.pages||{})[0];if(!p||p.missing!==undefined)throw new Error('문서를 찾지 못했습니다.');const desc=(p.extract||'').slice(0,3500),img=p.thumbnail?.source||'',link=p.fullurl||'';modal(`<h2 class="titleline">${esc(p.title)}</h2><p class="warning">이 문서가 정말 「${esc(f.name)}」 음식인지 직접 확인해 주세요. 천체·인물·스포츠 등 다른 주제라면 저장하지 마세요.</p>${img?`<img class="detail-img" src="${esc(img)}" alt="검색 사진">`:''}<p class="desc">${esc(desc||'설명이 없습니다.')}</p><div class="actions"><button type="button" class="admin-button" id="saveWikiCandidate">이 결과를 검색후보로 저장</button><button type="button" data-action="research" data-id="${esc(id)}">다른 후보 찾기</button></div>`);$('#saveWikiCandidate').addEventListener('click',async()=>{if(!desc||desc.length<25)return alert('설명이 부족하여 저장할 수 없습니다.');if(rejectWikiTopic(p.title,desc))return alert('음식과 무관한 문서로 의심되어 저장을 차단했습니다. 다른 검색어를 사용해 주세요.');if(!confirm('음식과 관련된 문서임을 확인했나요? 후보로만 저장되며 초록색 완성 카드는 되지 않습니다.'))return;const o=edits.overrides[id]||{};Object.assign(o,{title:p.title,desc:o.manualDescSet?o.manualDesc:desc,image:o.manualImageSet?o.manualImage:img,url:link,lang:'ko',status:'candidate',risk:'사용자 확인 대기',verification:'manual-candidate',descriptionLength:(o.manualDescSet?o.manualDesc:desc).length,reviewed:true,updated:new Date().toISOString()});edits.overrides[id]=o;if(await persist()){renderAll();openFood(id);}});}catch(e){modal(`<h2>후보 불러오기 실패</h2><p class="warning">${esc(e.message)}</p><button class="soft-btn" data-action="research" data-id="${esc(id)}">검색으로 돌아가기</button>`);}}
async function init(){renderAll();try{db=await openDB();const saved=await dbRead('edits');if(saved&&Array.isArray(saved.added)&&Array.isArray(saved.deleted)&&saved.overrides){edits={...JSON.parse(JSON.stringify(EMPTY)),...saved};renderAll();}}catch(e){alert('저장소를 열지 못했습니다. 카드 관리를 저장할 수 없습니다. 사파리 일반 모드에서 열어주세요.\n'+e.message);}if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-action],[data-open],[data-country],[data-view-go],[data-cat],[data-restore],[data-permanent],[data-wiki],[data-country-jump]');if(!t)return;
 if(t.dataset.open){openFood(t.dataset.open);return;}
 if(t.dataset.countryJump){renderCountryFoods(t.dataset.countryJump);return;}
 if(t.dataset.country){renderCountryFoods(t.dataset.country);return;}
 if(t.dataset.viewGo){showView(t.dataset.viewGo);return;}
 if(t.dataset.cat){currentFilter=t.dataset.cat;renderFoods();return;}
 if(t.dataset.restore){await restoreItem(t.dataset.restore);return;}
 if(t.dataset.permanent){await permanentDelete(t.dataset.permanent);return;}
 if(t.dataset.wiki){await wikiPreview(t.dataset.food,t.dataset.wiki);return;}
 const action=t.dataset.action,id=t.dataset.id;
 if(action==='toggle-admin'){admin=!admin;renderAll();if($('#detail').classList.contains('active'))closeDetail();return;}
 if(action==='toggle-country-list'){countryListExpanded=!countryListExpanded;renderCountries();return;}
 if(action==='toggle-all-country-cards'){allCountryCardsShown=!allCountryCardsShown;countryCardVisibility={};renderCountries();return;}
 if(action==='toggle-country-cards'){countryCardVisibility[id]=!countryCardsVisible(id);renderCountries();return;}
 if(action==='add-country'){openQuickAdd(id);return;}
 if(action==='trash-country'){openTrash(id);return;}
 if(action==='photo-change'){openEditor(id,'editPhotoFile');return;}
 if(action==='desc-edit'){openEditor(id,'editDesc');return;}
 if(action==='name-edit'){openEditor(id,'editName');return;}
 if(action==='restore-photo'){await restoreOriginal(id,'image');return;}
 if(action==='restore-desc'){await restoreOriginal(id,'desc');return;}
 if(action==='close'){closeDetail();return;}
 if(action==='open'){openFood(id);return;}
 if(action==='fav'||action==='bucket'){toggleList(action==='fav'?'favorites':'bucket',id);return;}
 if(action==='edit'){openEditor(id);return;}
 if(action==='add'){openQuickAdd();return;}
  if(action==='toggle-review'){parentOnlyReview=!parentOnlyReview;renderParent();return;}
 if(action==='trash'){openTrash();return;}
 if(action==='card-remove'){await removeCardOnly(id);return;}
 if(action==='complete-card'){await completeCandidateCard(id);return;}
 if(action==='photo-full'){showFullPhoto(id);return;}
 if(action==='review-group'){reviewGroup=id;parentOnlyReview=false;renderParent();return;}
 if(action==='delete'){await softDelete(id);return;}
 if(action==='reset'){await resetSearch(id);return;}
 if(action==='research'){openResearch(id);return;}
 if(action==='backup'){await exportBackup();return;}
 if(action==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>importBackup(inp.files[0]);inp.click();return;}
 if(action==='reset-user'){if(confirm('즐겨찾기와 먹어보고 싶어요 표시만 초기화할까요?')){user={favorites:[],bucket:[],notes:{}};saveUser();renderAll();}return;}
});
const backTop=$('#backTop');window.addEventListener('scroll',()=>{backTop.classList.toggle('visible',window.scrollY>450);},{passive:true});backTop.addEventListener('click',()=>{const d=$('#detail');if(d.classList.contains('active'))d.scrollTo({top:0,behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'});});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b){if(b.dataset.view==='parent'&&!admin){admin=true;renderAll();}showView(b.dataset.view);}});
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();searchQuery=$('#searchInput').value.trim();renderSearch();}if(e.target.id==='parentSearch'){e.preventDefault();parentQuery=$('#parentSearchInput').value.trim();renderParent();}});
$('#detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
init();
})();
</script>
</body>
