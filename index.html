<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193d64"><title>세계 음식대백과 FRESH V1.2</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body><header><h2>🌍 세계 음식대백과 · FRESH V1.2</h2><div>완성 카드 없이 새롭게 검색하는 독립 실험판</div></header><main><div class="panel"><div class="notice">이 앱은 기존 카드·설명을 가져오지 않습니다. 검색 결과는 검증 전까지 보라색 후보이며, 직접 확인한 경우에만 초록색 완료로 바뀝니다. 현재 27개국 205개 항목이며 101개국 전체는 아닙니다. 기존 검색 결과는 같은 저장소에서 업그레이드하면 유지됩니다.</div><p id="stats" class="stats"></p><button id="batch" class="primary">미검색 음식 자동검색</button> <button id="stop">중지</button> <button id="export">결과 백업</button> <button id="reset">새 앱 결과 초기화</button><p id="progress"></p><p id="current">현재 검색: 대기 중</p><details open><summary>🔎 검색 진행 화면 · 실시간 기록 보기</summary><div id="logs" class="logs" aria-live="polite"></div></details></div><div class="panel"><input id="countrySearch" placeholder="나라 찾기"><div id="countries" class="countries" style="margin-top:12px"></div></div><div class="panel"><h3 id="heading"></h3><div id="foods" class="foods"></div></div><div class="panel"><h3>검색 결과 확인</h3><div id="detail">음식 이름을 누르면 실제 외부 검색을 시작합니다.</div></div></main><script src="app.js"></script></body></html>
