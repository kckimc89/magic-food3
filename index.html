<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193d64"><title>세계 음식대백과 FRESH V1.4</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f8fc;color:#172337}header{background:#193d64;color:white;padding:18px}main{max-width:1050px;margin:auto;padding:18px}.panel{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #14283a12}button,input{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:white}button{cursor:pointer}button:disabled{opacity:.5}.primary{background:#245c9a;color:white}.countries,.foods{display:flex;flex-wrap:wrap;gap:8px}.country{background:#eef4ff}.food{border-radius:30px}.food[data-state="candidate"]{background:#eee3ff}.food[data-state="done"]{background:#ddf4df}.food[data-state="failed"]{background:#ffe4e4}.food[data-state="searching"]{background:#fff3cc}#detail{white-space:pre-wrap;line-height:1.65}small{color:#637287}.stats{font-weight:700}.notice{background:#fff5da;border-radius:10px;padding:12px}
.countrySection{border-top:1px solid #dce4ed;padding:12px 0}.countrySection h3{margin:8px 0}.countrySection .foods{margin-bottom:8px}.logs{height:190px;overflow-y:auto;background:#f4f7fb;border:1px solid #d5dfea;padding:10px;border-radius:10px;font-size:14px;line-height:1.6}.logs>div{padding:3px;border-bottom:1px solid #e2e8f0}#current{font-weight:700}#foods{display:block}#foods>.food{margin:3px}#cardOverlay{position:fixed;inset:0;background:#0c1725aa;z-index:99;display:none;align-items:center;justify-content:center;padding:16px}#cardOverlay.open{display:flex}#cardBox{background:#fff;border-radius:18px;max-width:650px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-sizing:border-box}#cardBox img{max-width:100%;max-height:300px;object-fit:contain;border-radius:10px}#cardBox button{margin:4px}#cardText{line-height:1.8;white-space:pre-wrap}#cardMeta{font-size:13px;color:#52667b} .pill{padding:8px 12px;background:#e5f2e6;border-radius:9px;display:inline-block}</style></head><body><header><h2>🌍 세계 음식대백과 · FRESH V1.4</h2><div>완성 카드 없이 새롭게 검색하는 독립 실험판</div></header><main><div class="panel"><div class="notice">이 앱은 기존 카드·설명을 가져오지 않습니다. 검색 결과는 검증 전까지 보라색 후보이며, 직접 확인한 경우에만 초록색 완료로 바뀝니다. 현재 27개국 205개 항목이며 101개국 전체는 아닙니다. 기존 검색 결과는 같은 저장소에서 업그레이드하면 유지됩니다.</div><p id="stats" class="stats"></p><button id="batch" class="primary">미검색 음식 자동검색</button> <button id="stop">중지</button> <button id="export">결과 백업</button> <button id="reset">새 앱 결과 초기화</button> <button id="review">기존 보라색 자동 검증</button> <button id="cards">🟢 완성 카드 보기</button><p id="progress"></p><p id="current">현재 검색: 대기 중</p><h3>🔎 검색 진행 화면 · 실시간 기록</h3><div id="logs" class="logs" aria-live="polite"></div></div><div class="panel"><input id="countrySearch" placeholder="나라 찾기"><div id="countries" class="countries" style="margin-top:12px"></div></div><div class="panel"><h3 id="heading"></h3><div id="foods" class="foods"></div></div><div class="panel"><h3>검색 결과 확인</h3><div id="detail">음식 이름을 누르면 실제 외부 검색을 시작합니다.</div></div></main><div id="cardOverlay" role="dialog" aria-modal="true" aria-label="음식 카드"><div id="cardBox"><button id="cardClose">✕ 닫기</button><h2 id="cardTitle"></h2><p id="cardMeta"></p><div id="cardPicture"></div><div id="cardText"></div><p id="cardActions"></p></div></div><script>window.FRESH_CATALOG={"ES": {"name": "스페인", "flag": "🇪🇸", "items": ["파에야", "하몬 이베리코", "토르티야 에스파뇰라", "가스파초", "추로스", "파타타스 브라바스", "감바스 알 아히요", "풀포 아 라 가예가", "크로케타", "판 콘 토마테", "코시도 마드릴레뇨", "파바다 아스투리아나", "살모레호", "피스토"]}, "JP": {"name": "일본", "flag": "🇯🇵", "items": ["초밥", "라멘", "덴푸라", "우동", "소바", "오코노미야키", "다코야키", "돈카쓰", "스키야키", "샤부샤부", "오니기리", "미소시루", "스시"]}, "US": {"name": "미국", "flag": "🇺🇸", "items": ["햄버거", "핫도그", "바비큐", "프라이드치킨", "애플파이", "클램차우더", "버펄로윙", "마카로니 앤 치즈", "팬케이크", "뉴욕 스타일 피자", "콘브레드"]}, "KR": {"name": "대한민국", "flag": "🇰🇷", "items": ["김치", "비빔밥", "불고기", "잡채", "떡볶이", "삼계탕", "냉면", "김밥", "된장찌개", "떡국", "송편", "전", "떡", "호떡", "고추장"]}, "IN": {"name": "인도", "flag": "🇮🇳", "items": ["비리야니", "난", "탄두리 치킨", "도사", "사모사", "달", "팔락 파니르", "버터 치킨", "이들리", "차이", "커리"]}, "TH": {"name": "태국", "flag": "🇹🇭", "items": ["팟타이", "똠얌꿍", "쏨땀", "그린 커리", "카오팟", "카오소이", "똠카가이", "망고 찹쌀밥", "뿌팟퐁커리"]}, "VN": {"name": "베트남", "flag": "🇻🇳", "items": ["퍼", "반미", "분짜", "고이꾸온", "반쎄오", "까오러우"]}, "ID": {"name": "인도네시아", "flag": "🇮🇩", "items": ["나시고렝", "렌당", "사테", "가도가도", "소토", "템페"]}, "AU": {"name": "호주", "flag": "🇦🇺", "items": ["미트파이", "베지마이트", "라밍턴", "파블로바", "바비큐", "안작 비스킷", "미트 파이", "베지마이트 토스트", "램 요리"]}, "CA": {"name": "캐나다", "flag": "🇨🇦", "items": ["푸틴", "메이플 시럽", "투르티에르", "버터 타르트", "나나이모 바", "몬트리올 베이글", "연어 요리", "베이글", "배넉"]}, "MX": {"name": "멕시코", "flag": "🇲🇽", "items": ["타코", "몰레", "타말", "포솔레", "과카몰레", "엔칠라다"]}, "BR": {"name": "브라질", "flag": "🇧🇷", "items": ["페이조아다", "슈하스코", "모케카", "파웅 지 케이주", "아카라제", "브리가데이루", "팡 지 케이주", "아사이 볼"]}, "GB": {"name": "영국", "flag": "🇬🇧", "items": ["피시 앤 칩스", "선데이 로스트", "셰퍼드 파이", "스콘", "해기스", "애프터눈 티", "잉글리시 브렉퍼스트", "샌드위치"]}, "DE": {"name": "독일", "flag": "🇩🇪", "items": ["브라트부르스트", "프레첼", "자우어브라텐", "슈페츨레", "슈니첼", "슈바르츠발트 케이크"]}, "GR": {"name": "그리스", "flag": "🇬🇷", "items": ["무사카", "수블라키", "그릭 샐러드", "차치키", "스파나코피타", "돌마데스"]}, "TR": {"name": "튀르키예", "flag": "🇹🇷", "items": ["케밥", "되네르", "만티", "피데", "바클라바", "메네멘"]}, "EG": {"name": "이집트", "flag": "🇪🇬", "items": ["코샤리", "풀 메담메스", "타메야", "몰로키야", "파타", "바스부사", "풀 메다메스", "아이시 발라디"]}, "ZA": {"name": "남아프리카공화국", "flag": "🇿🇦", "items": ["보보티", "브라이", "빌통", "버니 차우", "보어워스", "밀크타르트"]}, "PH": {"name": "필리핀", "flag": "🇵🇭", "items": ["아도보", "시니강", "레촌", "판싯", "룸피아", "할로할로"]}, "SG": {"name": "싱가포르", "flag": "🇸🇬", "items": ["하이난 치킨라이스", "칠리크랩", "락사", "카야토스트", "바쿠테", "차퀘이테오"]}, "MY": {"name": "말레이시아", "flag": "🇲🇾", "items": ["나시르막", "차퀘이테오", "로티차나이", "사테", "락사", "렌당"]}, "NO": {"name": "노르웨이", "flag": "🇳🇴", "items": ["포리콜", "루테피스크", "라크피스크", "브루노스트", "크룸카케"]}, "FI": {"name": "핀란드", "flag": "🇫🇮", "items": ["카르얄란피이라카", "로히케이토", "포론카리스튀스", "칼라쿠코", "코르바푸스티"]}, "KH": {"name": "캄보디아", "flag": "🇰🇭", "items": ["피시 아목", "록락", "꾸이띠우", "놈반쪽", "삼로르 코르코"]}, "MM": {"name": "미얀마", "flag": "🇲🇲", "items": ["모힝가", "라페토", "샨 누들", "오노 카욱 스웨", "난지 똑"]}, "CO": {"name": "콜롬비아", "flag": "🇨🇴", "items": ["반데하 파이사", "아히아코", "아레파", "산코초", "엠파나다"]}, "NZ": {"name": "뉴질랜드", "flag": "🇳🇿", "items": ["항이", "파블로바", "미트파이", "호키포키 아이스크림", "화이트베이트 프리터"]}};</script><script>const VERSION='FRESH V1.4';
// Preserve the V1.1 storage key so completed work survives an update on the same GitHub Pages origin.
const KEY='world_food_fresh_v1_1_results';
let catalog={},states={},active=null,running=false,stop=false,controller=null,seq=0,completed=0,totalBatch=0;
try{states=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){states={}}
for(const [k,v] of Object.entries(states))if(v.status==='searching')states[k]={...v,status:'new'};
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function key(cc,n){return cc+'|'+n} function persist(){try{localStorage.setItem(KEY,JSON.stringify(states))}catch(e){log('저장 오류: '+e.message)}}
function all(){return Object.entries(catalog).flatMap(([cc,v])=>v.items.map(name=>({cc,name})))}
function count(cc){return catalog[cc].items.filter(n=>states[key(cc,n)]?.status==='done').length}
function log(s){const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString('ko-KR')+' · '+s;$('logs').prepend(d);while($('logs').children.length>80)$('logs').lastElementChild.remove()}
function stat(){const items=all(),c={};items.forEach(x=>{const s=states[key(x.cc,x.name)]?.status||'new';c[s]=(c[s]||0)+1});$('stats').textContent=`${Object.keys(catalog).length}개국 · 전체 ${items.length}개 | 초록색 ${c.done||0}/${items.length} · 검색 전 ${c.new||0} · 보라색 ${c.candidate||0} · 실패 ${c.failed||0} · 검색중 ${c.searching||0}`}
function countries(){let q=$('countrySearch').value.trim();$('countries').innerHTML=`<button class="country" data-cc="ALL">🌏 전체 보기</button>`+Object.entries(catalog).filter(([cc,v])=>v.name.includes(q)||cc.toLowerCase().includes(q.toLowerCase())).map(([cc,v])=>`<button class="country" data-cc="${cc}">${esc(v.flag)} ${esc(v.name)} (${count(cc)}/${v.items.length})</button>`).join('');document.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>show(b.dataset.cc))}
function chips(cc){return catalog[cc].items.map(n=>{const s=states[key(cc,n)]?.status||'new';return `<button class="food" data-code="${cc}" data-name="${esc(n)}" data-state="${s}">${esc(n)} · ${{new:'흰색',searching:'검색중',candidate:'보라색',done:'초록색',failed:'실패'}[s]}</button>`}).join('')}
function show(cc){active=cc;let area=$('foods');if(cc==='ALL'){$('heading').textContent='🌏 전체 국가 음식 보기';area.innerHTML=Object.entries(catalog).map(([c,v])=>`<section class="countrySection"><h3>${esc(v.flag)} ${esc(v.name)} (${count(c)}/${v.items.length})</h3><div class="foods">${chips(c)}</div></section>`).join('')}else{let v=catalog[cc];$('heading').textContent=`${v.flag} ${v.name} (${count(cc)}/${v.items.length})`;area.innerHTML=chips(cc)}area.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{const cc=b.dataset.code,n=b.dataset.name,r=states[key(cc,n)];if(r&&['candidate','done'].includes(r.status))card(cc,n);else searchOne(cc,n)});countries();stat()}
function abortableFetch(url,timeout=8500){
 const c=new AbortController();controller=c;let timer;
 const limit=new Promise((_,reject)=>{timer=setTimeout(()=>{c.abort();reject(new Error('8.5초 검색 시간 초과'))},timeout)});
 return Promise.race([fetch(url,{signal:c.signal,cache:'no-store'}),limit]).finally(()=>clearTimeout(timer));
}
async function wiki(q,lang){const url=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=extracts%7Cpageimages&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=500&format=json&origin=*`;let r=await abortableFetch(url);if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();return Object.values(data.query?.pages||{}).sort((a,b)=>(a.index??99)-(b.index??99)).map(p=>({...p,_lang:lang}))}
function verify(cc,n,r){
 if(!r||!r.desc||r.desc.length<65)return false;
 const title=(r.title||'').toLowerCase().replace(/\s/g,'');
 const name=n.toLowerCase().replace(/\s/g,'');
 // Never accept a generic parent food page as proof of a specific dish.
 const normalized=x=>x.replace(/[()（）·・.,\-]/g,'');
 const exact=normalized(title)===normalized(name);
 const related=title.includes(name)&&name.length>=4;
 const foodWords=/음식|요리|식품|먹|만들|조리|재료|소스|빵|고기|국물|튀김|밥|면|스튜|디저트|food|dish|cuisine|prepared|cooked/i;
 const wrong=/동음이의|인명|영화|앨범|노래|소설|게임|도시|지명|축구|배우/i;
 return (exact||related)&&foodWords.test(r.desc)&&!wrong.test(r.desc.slice(0,180));
}
function card(cc,n){const r=states[key(cc,n)];if(!r)return;
 $('cardTitle').textContent=`${catalog[cc].flag} ${catalog[cc].name} · ${n}`;
 $('cardMeta').textContent=`${r.status==='done'?'🟢 완성 카드':'🟣 검색 후보 (검증 전)'} | 검색 제목: ${r.title||'없음'} | 사진: ${r.image?'있음':'없음'}`;
 $('cardText').textContent=r.desc||r.reason||'설명이 없습니다.';
 $('cardPicture').replaceChildren();if(r.image){const im=document.createElement('img');im.src=r.image;im.alt=n;im.onerror=()=>{im.replaceWith(document.createTextNode('사진을 불러오지 못했습니다.'))};$('cardPicture').append(im)}else{$('cardPicture').textContent='📷 사진 준비 중 (설명이 정확하면 카드 완성 가능)'}
 $('cardActions').replaceChildren();if(['candidate','done'].includes(r.status)){const b=document.createElement('button');b.textContent=r.status==='done'?'완료 취소':'설명 확인 후 카드 완성';b.onclick=()=>{r.status=r.status==='done'?'candidate':'done';r.verification=r.status==='done'?'manual':'none';persist();show(active);card(cc,n)};$('cardActions').append(b)}
 const retry=document.createElement('button');retry.textContent='다시 검색';retry.onclick=()=>{closeCard();searchOne(cc,n)};$('cardActions').append(retry);
 $('cardOverlay').classList.add('open');
}
function closeCard(){$('cardOverlay').classList.remove('open')}
function renderDetail(cc,n){let r=states[key(cc,n)];if(!r)return;$('detail').replaceChildren();const h=document.createElement('h3');h.textContent=`${n} → ${r.title||'검색 결과 없음'}`;$('detail').append(h);const p=document.createElement('p');p.textContent=(r.desc||r.reason||'설명 없음').slice(0,350);$('detail').append(p);const b=document.createElement('button');b.textContent='📖 음식 카드 크게 보기';b.onclick=()=>card(cc,n);$('detail').append(b)}
function reviewCandidates(){let accepted=0,remaining=0;for(const x of all()){let r=states[key(x.cc,x.name)];if(r?.status==='candidate'){if(verify(x.cc,x.name,r)){r.status='done';r.verification='automatic-strict-v1';accepted++}else remaining++}}persist();show(active);log(`기존 후보 검증: 자동완성 ${accepted}, 보라색 유지 ${remaining}`);alert(`자동완성 ${accepted}개, 보라색 유지 ${remaining}개. 일반 음식 설명이나 불확실한 후보는 완료하지 않았습니다.`)}
function listCards(){let arr=all().filter(x=>states[key(x.cc,x.name)]?.status==='done');if(!arr.length){alert('완성 카드가 아직 없습니다.');return}card(arr[0].cc,arr[0].name);log(`완성 카드 ${arr.length}개 중 첫 카드 표시`)}
async function doSearch(cc,n){const id=key(cc,n);states[id]={...states[id],status:'searching'};persist();show(active);$('current').textContent=`현재 검색: ${catalog[cc].name} · ${n}`;log('검색 시작: '+catalog[cc].name+' / '+n);try{let pages=await wiki(n,'ko');if(stop)throw Error('사용자 중지');if(!pages.length)pages=await wiki(n,'en');if(stop)throw Error('사용자 중지');if(!pages.length){states[id]={status:'failed',reason:'검색 결과 없음'};log('검색 결과 없음: '+n)}else{const p=pages[0];states[id]={status:'candidate',title:p.title,desc:(p.extract||'').slice(0,2200),image:p.thumbnail?.source||'',url:`https://${p._lang}.wikipedia.org/?curid=${p.pageid}`,query:n};if(verify(cc,n,states[id])){states[id].status='done';states[id].verification='automatic-strict-v1';log('자동 카드 완성: '+n)}else{log('후보 발견: '+n+' → '+p.title)}}}catch(e){let msg=String(e?.message||e);states[id]={status:stop?'new':'failed',reason:msg};log((stop?'중지':'검색 오류')+': '+n+' / '+msg)}finally{controller=null;persist();show(active);renderDetail(cc,n)}}
async function searchOne(cc,n){if(running){log('자동검색 중에는 개별 검색을 시작할 수 없습니다.');return}running=true;stop=false;buttons();try{await doSearch(cc,n)}finally{running=false;buttons()}}
function buttons(){$('batch').disabled=running;$('stop').disabled=!running;$('reset').disabled=running}
async function batch(){if(running)return;running=true;stop=false;buttons();const targets=all().filter(x=>['new','failed'].includes(states[key(x.cc,x.name)]?.status||'new'));totalBatch=targets.length;completed=0;log(`자동검색 시작: ${totalBatch}개`);try{for(const x of targets){if(stop)break;$('progress').textContent=`자동검색 ${completed+1}/${totalBatch}: ${catalog[x.cc].name} · ${x.name}`;await doSearch(x.cc,x.name);completed++;$('progress').textContent=`처리 ${completed}/${totalBatch} · ${stop?'중지됨':'진행 중'}`;if(!stop)await new Promise(r=>setTimeout(r,350))}}finally{running=false;controller=null;buttons();$('progress').textContent=`${stop?'사용자가 중지함':'자동검색 종료'} · 처리 ${completed}/${totalBatch}`;log($('progress').textContent)}}
$('batch').onclick=batch;$('stop').onclick=()=>{if(!running)return;stop=true;controller?.abort();$('progress').textContent='중지 요청: 현재 요청 취소 중';log('중지 버튼 클릭 — 현재 요청 취소')};$('countrySearch').oninput=countries;
$('reset').onclick=()=>{if(confirm('새 앱의 검색 결과를 모두 삭제할까요?')){states={};persist();show(active||'ALL');log('검색 결과 초기화')}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:VERSION,catalog,states},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='world-food-fresh-v1-3-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
$('cardClose').onclick=closeCard;$('cardOverlay').onclick=e=>{if(e.target===$('cardOverlay'))closeCard()};$('review').onclick=reviewCandidates;$('cards').onclick=listCards;catalog=window.FRESH_CATALOG;persist();show('ALL');buttons();log('V1.4 준비 완료 — 전체 보기·한글 국가명·완성수 반영');
</script></body></html>
